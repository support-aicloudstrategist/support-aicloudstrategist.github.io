<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Luxury product campaign preview</title>
  <desc id="desc">A cobalt glass product bottle lit by cyan and violet studio lights.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04111f"/><stop offset=".55" stop-color="#07152a"/><stop offset="1" stop-color="#170d32"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9" stop-opacity=".9"/><stop offset=".35" stop-color="#1685ef" stop-opacity=".82"/><stop offset=".78" stop-color="#6d45e5" stop-opacity=".72"/><stop offset="1" stop-color="#d8b4fe" stop-opacity=".45"/></linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dffaff"/><stop offset=".35" stop-color="#6c7f96"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#22d3ee" stop-opacity=".5"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#000" flood-opacity=".65"/></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="180" cy="200" r="220" fill="url(#halo)" filter="url(#blur)"/>
  <circle cx="690" cy="550" r="250" fill="#8b5cf6" opacity=".16" filter="url(#blur)"/>
  <path d="M0 615C172 570 309 584 444 628s245 39 356-6v178H0Z" fill="#050a13" opacity=".9"/>
  <ellipse cx="404" cy="650" rx="218" ry="48" fill="#000" opacity=".48" filter="url(#blur)"/>
  <g filter="url(#shadow)">
    <rect x="307" y="220" width="194" height="78" rx="28" fill="url(#cap)"/>
    <rect x="332" y="185" width="144" height="55" rx="18" fill="#111c2d" stroke="#b9f7ff" stroke-opacity=".38"/>
    <rect x="235" y="284" width="338" height="330" rx="78" fill="url(#glass)" stroke="#c8fbff" stroke-opacity=".58" stroke-width="3"/>
    <path d="M278 330c43-30 192-33 247 0" fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="9" stroke-linecap="round"/>
    <path d="M284 348v190" fill="none" stroke="#e6fdff" stroke-opacity=".42" stroke-width="12" stroke-linecap="round"/>
    <rect x="295" y="407" width="218" height="92" rx="22" fill="#06111f" fill-opacity=".48" stroke="#e8fdff" stroke-opacity=".22"/>
    <circle cx="404" cy="453" r="19" fill="#dffaff" opacity=".82"/>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity=".14"><circle cx="404" cy="450" r="268"/><circle cx="404" cy="450" r="306"/></g>
</svg>
