    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bffaff" stop-opacity=".9"/><stop offset=".42" stop-color="#22d3ee" stop-opacity=".52"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".2"/></linearGradient>
