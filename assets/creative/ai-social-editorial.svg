<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" aria-labelledby="title desc">
  <title id="title">Editorial social campaign preview</title>
  <desc id="desc">An abstract luxury editorial composition with translucent fabric and chrome forms.</desc>
  <defs>
