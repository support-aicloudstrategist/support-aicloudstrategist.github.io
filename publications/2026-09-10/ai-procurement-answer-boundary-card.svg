<svg xmlns='http://www.w3.org/2000/svg' width='1360' height='900' viewBox='0 0 1360 900'>
  <defs><linearGradient id='hero' x1='0' x2='1' y1='0' y2='1'><stop stop-color='#111827'/><stop offset='.5' stop-color='#1d4ed8'/><stop offset='1' stop-color='#0891b2'/></linearGradient><filter id='shadow' x='-10%' y='-20%' width='120%' height='150%'><feDropShadow dx='0' dy='12' stdDeviation='9' flood-color='#0f172a' flood-opacity='.14'/></filter></defs>
  <rect width='1360' height='900' fill='#eef6ff'/><rect x='38' y='34' width='1284' height='832' rx='46' fill='white' stroke='#bfdbfe' stroke-width='3'/>
  <rect x='72' y='66' width='1216' height='170' rx='34' fill='url(#hero)'/>
  <text x='108' y='112' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='900' fill='#a7f3d0' letter-spacing='3'>AICLOUDSTRATEGIST · EVENING INFOGRAPHIC</text>
  <text x='108' y='160' font-family='Inter,Arial,sans-serif' font-size='36' font-weight='950' fill='white'>AI Procurement Answer Boundary Card: 7 Checks Before Reusing Vendor Answers</text>
  <text x='108' y='200' font-family='Inter,Arial,sans-serif' font-size='18' fill='#dbeafe'>A safe educational checklist for SaaS, AI and operations teams before copying security, privacy, model, cloud or compliance answers into buyer questionnaires.</text>
  <g transform='translate(1128 98)'><rect width='118' height='94' rx='24' fill='rgba(255,255,255,.16)' stroke='#a7f3d0'/><text x='59' y='37' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='950' fill='white'>Q&amp;A</text><text x='59' y='64' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='850' fill='#dbeafe'>Boundary</text></g>
  
  <g filter='url(#shadow)'>
    <rect x='72' y='278' width='260' height='226' rx='28' fill='#eff6ff' stroke='#2563eb' stroke-width='3'/>
    <circle cx='106' cy='313' r='22' fill='white' stroke='#2563eb' stroke-width='3'/>
    <text x='106' y='321' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='950' fill='#2563eb'>1</text>
    <text x='134' y='310' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0f172a'><tspan x='134' dy='0'>Confirm current</tspan><tspan x='134' dy='22'>source</tspan></text>
    <text x='94' y='372' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='94' y='396' font-family='Inter,Arial,sans-serif' font-size='12.1' font-weight='750' fill='#1e293b'><tspan x='94' dy='0'>Which policy, control record,</tspan><tspan x='94' dy='16'>architecture note or owner-approved</tspan><tspan x='94' dy='16'>answer is the source?</tspan></text>
    <text x='94' y='460' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='94' y='481' font-family='Inter,Arial,sans-serif' font-size='11.5' fill='#0f172a'><tspan x='94' dy='0'>Do not reuse old text unless the</tspan><tspan x='94' dy='16'>source and owner are still current.</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='384' y='278' width='260' height='226' rx='28' fill='#f0fdf4' stroke='#16a34a' stroke-width='3'/>
    <circle cx='418' cy='313' r='22' fill='white' stroke='#16a34a' stroke-width='3'/>
    <text x='418' y='321' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='950' fill='#16a34a'>2</text>
    <text x='446' y='310' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0f172a'><tspan x='446' dy='0'>Match the buyer</tspan><tspan x='446' dy='22'>question</tspan></text>
    <text x='406' y='372' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='406' y='396' font-family='Inter,Arial,sans-serif' font-size='12.1' font-weight='750' fill='#1e293b'><tspan x='406' dy='0'>Is the buyer asking about security,</tspan><tspan x='406' dy='16'>privacy, AI use, data location,</tspan><tspan x='406' dy='16'>subprocessors, uptime, support or</tspan><tspan x='406' dy='16'>commercial terms?</tspan></text>
    <text x='406' y='460' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='406' y='481' font-family='Inter,Arial,sans-serif' font-size='11.5' fill='#0f172a'><tspan x='406' dy='0'>Route mixed questions to the right</tspan><tspan x='406' dy='16'>owner instead of pasting one generic</tspan><tspan x='406' dy='16'>answer.</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='696' y='278' width='260' height='226' rx='28' fill='#f5f3ff' stroke='#7c3aed' stroke-width='3'/>
    <circle cx='730' cy='313' r='22' fill='white' stroke='#7c3aed' stroke-width='3'/>
    <text x='730' y='321' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='950' fill='#7c3aed'>3</text>
    <text x='758' y='310' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0f172a'><tspan x='758' dy='0'>Separate fact from</tspan><tspan x='758' dy='22'>intent</tspan></text>
    <text x='718' y='372' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='718' y='396' font-family='Inter,Arial,sans-serif' font-size='12.1' font-weight='750' fill='#1e293b'><tspan x='718' dy='0'>Which statements are already true</tspan><tspan x='718' dy='16'>today, and which are planned,</tspan><tspan x='718' dy='16'>roadmap or conditional?</tspan></text>
    <text x='718' y='460' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='718' y='481' font-family='Inter,Arial,sans-serif' font-size='11.5' fill='#0f172a'><tspan x='718' dy='0'>Label planned work clearly and avoid</tspan><tspan x='718' dy='16'>present-tense claims until evidence</tspan><tspan x='718' dy='16'>exists.</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='1008' y='278' width='260' height='226' rx='28' fill='#fff7ed' stroke='#ea580c' stroke-width='3'/>
    <circle cx='1042' cy='313' r='22' fill='white' stroke='#ea580c' stroke-width='3'/>
    <text x='1042' y='321' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='950' fill='#ea580c'>4</text>
    <text x='1070' y='310' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0f172a'><tspan x='1070' dy='0'>Check regulated</tspan><tspan x='1070' dy='22'>wording</tspan></text>
    <text x='1030' y='372' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='1030' y='396' font-family='Inter,Arial,sans-serif' font-size='12.1' font-weight='750' fill='#1e293b'><tspan x='1030' dy='0'>Could the answer imply legal</tspan><tspan x='1030' dy='16'>compliance, audit approval,</tspan><tspan x='1030' dy='16'>certification, customer outcome,</tspan><tspan x='1030' dy='16'>medical, financial or security</tspan></text>
    <text x='1030' y='460' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='1030' y='481' font-family='Inter,Arial,sans-serif' font-size='11.5' fill='#0f172a'><tspan x='1030' dy='0'>Use bounded operational language and</tspan><tspan x='1030' dy='16'>ask counsel/compliance for risky</tspan><tspan x='1030' dy='16'>wording.</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='228' y='558' width='260' height='226' rx='28' fill='#fef2f2' stroke='#dc2626' stroke-width='3'/>
    <circle cx='262' cy='593' r='22' fill='white' stroke='#dc2626' stroke-width='3'/>
    <text x='262' y='601' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='950' fill='#dc2626'>5</text>
    <text x='290' y='590' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0f172a'><tspan x='290' dy='0'>Name the answer</tspan><tspan x='290' dy='22'>owner</tspan></text>
    <text x='250' y='652' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='250' y='676' font-family='Inter,Arial,sans-serif' font-size='12.1' font-weight='750' fill='#1e293b'><tspan x='250' dy='0'>Who is accountable for approving</tspan><tspan x='250' dy='16'>this answer before it leaves the</tspan><tspan x='250' dy='16'>company?</tspan></text>
    <text x='250' y='740' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='250' y='761' font-family='Inter,Arial,sans-serif' font-size='11.5' fill='#0f172a'><tspan x='250' dy='0'>Capture owner, date, source link and</tspan><tspan x='250' dy='16'>approval status in a simple</tspan><tspan x='250' dy='16'>register.</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='540' y='558' width='260' height='226' rx='28' fill='#ecfeff' stroke='#0891b2' stroke-width='3'/>
    <circle cx='574' cy='593' r='22' fill='white' stroke='#0891b2' stroke-width='3'/>
    <text x='574' y='601' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='950' fill='#0891b2'>6</text>
    <text x='602' y='590' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0f172a'><tspan x='602' dy='0'>Preserve evidence</tspan><tspan x='602' dy='22'>links</tspan></text>
    <text x='562' y='652' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='562' y='676' font-family='Inter,Arial,sans-serif' font-size='12.1' font-weight='750' fill='#1e293b'><tspan x='562' dy='0'>What proof can be shared now: public</tspan><tspan x='562' dy='16'>page, redacted screenshot, policy</tspan><tspan x='562' dy='16'>excerpt, SOC report process, or</tspan><tspan x='562' dy='16'>owner note?</tspan></text>
    <text x='562' y='740' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='562' y='761' font-family='Inter,Arial,sans-serif' font-size='11.5' fill='#0f172a'><tspan x='562' dy='0'>Attach only shareable, non-secret</tspan><tspan x='562' dy='16'>evidence; never send credentials,</tspan><tspan x='562' dy='16'>keys, logs or customer data.</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='852' y='558' width='260' height='226' rx='28' fill='#f8fafc' stroke='#475569' stroke-width='3'/>
    <circle cx='886' cy='593' r='22' fill='white' stroke='#475569' stroke-width='3'/>
    <text x='886' y='601' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='950' fill='#475569'>7</text>
    <text x='914' y='590' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0f172a'><tspan x='914' dy='0'>Review after send</tspan></text>
    <text x='874' y='652' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='874' y='676' font-family='Inter,Arial,sans-serif' font-size='12.1' font-weight='750' fill='#1e293b'><tspan x='874' dy='0'>Which answers created follow-up</tspan><tspan x='874' dy='16'>questions, blocker themes or</tspan><tspan x='874' dy='16'>commitments that need internal</tspan><tspan x='874' dy='16'>cleanup?</tspan></text>
    <text x='874' y='740' font-family='Inter,Arial,sans-serif' font-size='11' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='874' y='761' font-family='Inter,Arial,sans-serif' font-size='11.5' fill='#0f172a'><tspan x='874' dy='0'>Update the answer bank and</tspan><tspan x='874' dy='16'>next-action owner before the next</tspan><tspan x='874' dy='16'>questionnaire arrives.</tspan></text>
  </g>
  <rect x='86' y='818' width='1188' height='44' rx='21' fill='#0f172a'/><text x='680' y='837' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='850' fill='#a7f3d0'>Before reusing vendor answers, verify source, question fit, fact tense, regulated wording, owner approval, evidence links and post-send learning.</text><text x='680' y='856' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='11.5' fill='#e5e7eb'>Educational operations guide only — not legal, compliance, security certification, audit, procurement, ranking, customer-result, revenue, savings, approval, or guaranteed-performance advice.</text>
</svg>