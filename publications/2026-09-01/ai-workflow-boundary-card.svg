<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='960' viewBox='0 0 1200 960'>
  <defs>
    <linearGradient id='hero' x1='0' x2='1' y1='0' y2='1'><stop stop-color='#0f172a'/><stop offset='.55' stop-color='#2563eb'/><stop offset='1' stop-color='#0f766e'/></linearGradient>
    <filter id='shadow' x='-10%' y='-20%' width='120%' height='150%'><feDropShadow dx='0' dy='16' stdDeviation='12' flood-color='#0f172a' flood-opacity='.13'/></filter>
  </defs>
  <rect width='1200' height='960' fill='#f7fbff'/>
  <rect x='42' y='38' width='1116' height='884' rx='44' fill='white' stroke='#bfdbfe' stroke-width='3'/>
  <rect x='74' y='72' width='1052' height='170' rx='36' fill='url(#hero)'/>
  <text x='108' y='120' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='900' fill='#bfdbfe' letter-spacing='3'>AICLOUDSTRATEGIST · MORNING INFOGRAPHIC GUIDE</text>
  <text x='108' y='175' font-family='Inter,Arial,sans-serif' font-size='50' font-weight='950' fill='white'>The AI Workflow Boundary Card</text>
  <text x='108' y='216' font-family='Inter,Arial,sans-serif' font-size='20' fill='#dcfce7'>A safe educational one-page card for deciding what AI can draft, what humans must approve, and what should never be automated blindly.</text>
  <text x='88' y='276' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#0f172a'>Three-zone AI operating rule</text>
  
    <g filter='url(#shadow)'>
      <rect x='86' y='300' width='318' height='306' rx='34' fill='white' stroke='#166534' stroke-opacity='.28' stroke-width='3'/>
      <rect x='110' y='326' width='270' height='76' rx='24' fill='#dcfce7'/>
      <text x='130' y='358' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='950' fill='#166534' letter-spacing='2'>GREEN ZONE</text>
      <text x='130' y='390' font-family='Inter,Arial,sans-serif' font-size='26' font-weight='950' fill='#0f172a'>AI may draft</text>
      <text x='116' y='462' font-family='Inter,Arial,sans-serif' font-size='20' fill='#334155'><tspan x='116' dy='0'>Summaries, internal checklists,</tspan><tspan x='116' dy='24'>meeting notes, first-pass research</tspan><tspan x='116' dy='24'>outlines, and template cleanup.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='452' y='300' width='318' height='306' rx='34' fill='white' stroke='#92400e' stroke-opacity='.28' stroke-width='3'/>
      <rect x='476' y='326' width='270' height='76' rx='24' fill='#fef3c7'/>
      <text x='496' y='358' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='950' fill='#92400e' letter-spacing='2'>AMBER ZONE</text>
      <text x='496' y='390' font-family='Inter,Arial,sans-serif' font-size='26' font-weight='950' fill='#0f172a'>Human approval required</text>
      <text x='482' y='462' font-family='Inter,Arial,sans-serif' font-size='20' fill='#334155'><tspan x='482' dy='0'>Pricing language, customer</tspan><tspan x='482' dy='24'>promises, external posts, policy</tspan><tspan x='482' dy='24'>interpretation, data handling, and</tspan><tspan x='482' dy='24'>vendor decisions.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='818' y='300' width='318' height='306' rx='34' fill='white' stroke='#991b1b' stroke-opacity='.28' stroke-width='3'/>
      <rect x='842' y='326' width='270' height='76' rx='24' fill='#fee2e2'/>
      <text x='862' y='358' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='950' fill='#991b1b' letter-spacing='2'>RED ZONE</text>
      <text x='862' y='390' font-family='Inter,Arial,sans-serif' font-size='26' font-weight='950' fill='#0f172a'>Do not automate blindly</text>
      <text x='848' y='462' font-family='Inter,Arial,sans-serif' font-size='20' fill='#334155'><tspan x='848' dy='0'>Credentials, payments, legal</tspan><tspan x='848' dy='24'>commitments, medical or compliance</tspan><tspan x='848' dy='24'>advice, identity-sensitive action,</tspan><tspan x='848' dy='24'>and destructive changes.</tspan></text>
    </g>
  <rect x='86' y='640' width='1028' height='230' rx='34' fill='#f8fafc' stroke='#cbd5e1'/>
  <text x='108' y='646' transform='translate(0 0)' font-family='Inter,Arial,sans-serif' font-size='0'></text>
  <text x='108' y='650' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='950' fill='#0f172a'>Four checks before AI work becomes an action</text>
  
    <g>
      <circle cx='124' cy='684' r='21' fill='#dbeafe' stroke='#60a5fa'/>
      <text x='124' y='691' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='950' fill='#1d4ed8'>1</text>
      <text x='184' y='690' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='184' dy='0'>Name the owner before AI work starts.</tspan></text>
    </g>
    <g>
      <circle cx='124' cy='738' r='21' fill='#dbeafe' stroke='#60a5fa'/>
      <text x='124' y='745' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='950' fill='#1d4ed8'>2</text>
      <text x='184' y='744' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='184' dy='0'>Mark the risk zone before any output leaves the team.</tspan></text>
    </g>
    <g>
      <circle cx='124' cy='792' r='21' fill='#dbeafe' stroke='#60a5fa'/>
      <text x='124' y='799' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='950' fill='#1d4ed8'>3</text>
      <text x='184' y='798' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='184' dy='0'>Attach the source evidence so reviewers can verify context.</tspan></text>
    </g>
    <g>
      <circle cx='124' cy='846' r='21' fill='#dbeafe' stroke='#60a5fa'/>
      <text x='124' y='853' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='950' fill='#1d4ed8'>4</text>
      <text x='184' y='852' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='184' dy='0'>Keep a correction log when the AI draft is changed.</tspan></text>
    </g>
  <text x='108' y='905' font-family='Inter,Arial,sans-serif' font-size='14' fill='#64748b'>Educational operations guide only — not legal, compliance, medical, financial, security, certification, revenue, savings, ranking, customer-result, or guaranteed-performance advice.</text>
</svg>