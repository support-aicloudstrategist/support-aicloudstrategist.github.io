<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='960' viewBox='0 0 1200 960'>
  <defs>
    <linearGradient id='hero' x1='0' x2='1' y1='0' y2='1'><stop stop-color='#0f172a'/><stop offset='.55' stop-color='#1d4ed8'/><stop offset='1' stop-color='#0f766e'/></linearGradient>
    <filter id='soft' x='-10%' y='-20%' width='120%' height='150%'><feDropShadow dx='0' dy='13' stdDeviation='10' flood-color='#0f172a' flood-opacity='.12'/></filter>
  </defs>
  <rect width='1200' height='960' fill='#f6fbff'/>
  <rect x='42' y='38' width='1116' height='884' rx='44' fill='white' stroke='#bfdbfe' stroke-width='3'/>
  <rect x='74' y='72' width='1052' height='172' rx='36' fill='url(#hero)'/>
  <text x='108' y='120' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='900' fill='#bfdbfe' letter-spacing='3'>AICLOUDSTRATEGIST · MORNING INFOGRAPHIC GUIDE</text>
  <text x='108' y='177' font-family='Inter,Arial,sans-serif' font-size='50' font-weight='950' fill='white'>The AI Meeting Action Receipt</text>
  <text x='108' y='217' font-family='Inter,Arial,sans-serif' font-size='20' fill='#dcfce7'>A safe educational one-page checklist for turning meeting notes into accountable actions without hiding ownership, uncertainty, or customer-impact risk.</text>
  <text x='88' y='276' font-family='Inter,Arial,sans-serif' font-size='23' font-weight='950' fill='#0f172a'>Six fields that keep AI-assisted action tracking accountable</text>
  
    <g filter='url(#soft)'>
      <rect x='88' y='300' width='288' height='178' rx='28' fill='white' stroke='#d8e6f3'/>
      <circle cx='130' cy='346' r='24' fill='#dbeafe'/>
      <text x='130' y='355' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#0f172a'>1</text>
      <text x='168' y='354' font-family='Inter,Arial,sans-serif' font-size='23' font-weight='950' fill='#0f172a'>Decision</text>
      <text x='122' y='405' font-family='Inter,Arial,sans-serif' font-size='17' fill='#475569'><tspan x='122' dy='0'>Write the actual decision</tspan><tspan x='122' dy='22'>separately from background</tspan><tspan x='122' dy='22'>discussion.</tspan></text>
    </g>
    <g filter='url(#soft)'>
      <rect x='456' y='300' width='288' height='178' rx='28' fill='white' stroke='#d8e6f3'/>
      <circle cx='498' cy='346' r='24' fill='#ccfbf1'/>
      <text x='498' y='355' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#0f172a'>2</text>
      <text x='536' y='354' font-family='Inter,Arial,sans-serif' font-size='23' font-weight='950' fill='#0f172a'>Owner</text>
      <text x='490' y='405' font-family='Inter,Arial,sans-serif' font-size='17' fill='#475569'><tspan x='490' dy='0'>Assign one accountable person</tspan><tspan x='490' dy='22'>or role for each next action.</tspan></text>
    </g>
    <g filter='url(#soft)'>
      <rect x='824' y='300' width='288' height='178' rx='28' fill='white' stroke='#d8e6f3'/>
      <circle cx='866' cy='346' r='24' fill='#fef3c7'/>
      <text x='866' y='355' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#0f172a'>3</text>
      <text x='904' y='354' font-family='Inter,Arial,sans-serif' font-size='23' font-weight='950' fill='#0f172a'>Due window</text>
      <text x='858' y='405' font-family='Inter,Arial,sans-serif' font-size='17' fill='#475569'><tspan x='858' dy='0'>Use a realistic date or review</tspan><tspan x='858' dy='22'>window, not an open-ended</tspan><tspan x='858' dy='22'>reminder.</tspan></text>
    </g>
    <g filter='url(#soft)'>
      <rect x='88' y='555' width='288' height='178' rx='28' fill='white' stroke='#d8e6f3'/>
      <circle cx='130' cy='601' r='24' fill='#ede9fe'/>
      <text x='130' y='610' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#0f172a'>4</text>
      <text x='168' y='609' font-family='Inter,Arial,sans-serif' font-size='23' font-weight='950' fill='#0f172a'>Evidence</text>
      <text x='122' y='660' font-family='Inter,Arial,sans-serif' font-size='17' fill='#475569'><tspan x='122' dy='0'>Attach the source note,</tspan><tspan x='122' dy='22'>customer request, document, or</tspan><tspan x='122' dy='22'>metric that triggered the</tspan><tspan x='122' dy='22'>action.</tspan></text>
    </g>
    <g filter='url(#soft)'>
      <rect x='456' y='555' width='288' height='178' rx='28' fill='white' stroke='#d8e6f3'/>
      <circle cx='498' cy='601' r='24' fill='#ffe4e6'/>
      <text x='498' y='610' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#0f172a'>5</text>
      <text x='536' y='609' font-family='Inter,Arial,sans-serif' font-size='23' font-weight='950' fill='#0f172a'>Risk pause</text>
      <text x='490' y='660' font-family='Inter,Arial,sans-serif' font-size='17' fill='#475569'><tspan x='490' dy='0'>Flag any item involving</tspan><tspan x='490' dy='22'>pricing, legal terms, private</tspan><tspan x='490' dy='22'>data, customer promises, or</tspan><tspan x='490' dy='22'>uncertain facts.</tspan></text>
    </g>
    <g filter='url(#soft)'>
      <rect x='824' y='555' width='288' height='178' rx='28' fill='white' stroke='#d8e6f3'/>
      <circle cx='866' cy='601' r='24' fill='#dcfce7'/>
      <text x='866' y='610' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#0f172a'>6</text>
      <text x='904' y='609' font-family='Inter,Arial,sans-serif' font-size='23' font-weight='950' fill='#0f172a'>Close loop</text>
      <text x='858' y='660' font-family='Inter,Arial,sans-serif' font-size='17' fill='#475569'><tspan x='858' dy='0'>Record when the action is done,</tspan><tspan x='858' dy='22'>deferred, corrected, or</tspan><tspan x='858' dy='22'>cancelled.</tspan></text>
    </g>
  <text x='110' y='775' font-family='Inter,Arial,sans-serif' font-size='23' font-weight='950' fill='#0f172a'>How to use the receipt</text>
  
    <g>
      <rect x='110' y='805' width='302' height='94' rx='24' fill='#f8fafc' stroke='#cbd5e1'/>
      <text x='134' y='837' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='950' fill='#2563eb'>USE 1</text>
      <text x='134' y='868' font-family='Inter,Arial,sans-serif' font-size='14' fill='#475569'><tspan x='134' dy='0'>Run the receipt after important</tspan><tspan x='134' dy='19'>meetings, not after every casual</tspan><tspan x='134' dy='19'>chat.</tspan></text>
    </g>
    <g>
      <rect x='450' y='805' width='302' height='94' rx='24' fill='#f8fafc' stroke='#cbd5e1'/>
      <text x='474' y='837' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='950' fill='#2563eb'>USE 2</text>
      <text x='474' y='868' font-family='Inter,Arial,sans-serif' font-size='14' fill='#475569'><tspan x='474' dy='0'>Keep risk-pause items human-reviewed</tspan><tspan x='474' dy='19'>before any customer-facing message.</tspan></text>
    </g>
    <g>
      <rect x='790' y='805' width='302' height='94' rx='24' fill='#f8fafc' stroke='#cbd5e1'/>
      <text x='814' y='837' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='950' fill='#2563eb'>USE 3</text>
      <text x='814' y='868' font-family='Inter,Arial,sans-serif' font-size='14' fill='#475569'><tspan x='814' dy='0'>Review open receipts weekly so</tspan><tspan x='814' dy='19'>automation does not multiply stale</tspan><tspan x='814' dy='19'>tasks.</tspan></text>
    </g>
</svg>