<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='900' viewBox='0 0 1200 900'>
  <defs>
    <linearGradient id='hero' x1='0' x2='1' y1='0' y2='1'><stop stop-color='#0f172a'/><stop offset='.55' stop-color='#1d4ed8'/><stop offset='1' stop-color='#0f766e'/></linearGradient>
    <filter id='shadow' x='-10%' y='-20%' width='120%' height='150%'><feDropShadow dx='0' dy='12' stdDeviation='8' flood-color='#0f172a' flood-opacity='.14'/></filter>
  </defs>
  <rect width='1200' height='900' fill='#f8fafc'/>
  <rect x='36' y='34' width='1128' height='832' rx='44' fill='white' stroke='#bfdbfe' stroke-width='3'/>
  <rect x='70' y='68' width='1060' height='152' rx='34' fill='url(#hero)'/>
  <text x='106' y='112' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='900' fill='#bfdbfe' letter-spacing='3'>AICLOUDSTRATEGIST · MORNING INFOGRAPHIC</text>
  <text x='106' y='162' font-family='Inter,Arial,sans-serif' font-size='45' font-weight='950' fill='white'>Manual Work Automation Triage: 6 Checks Before You Automate</text>
  <text x='106' y='198' font-family='Inter,Arial,sans-serif' font-size='18' fill='#ecfeff'>A safe educational checklist for business owners deciding which repetitive work is ready for automation and which tasks still need human judgement first.</text>
  
  <g filter='url(#shadow)'>
    <rect x='84' y='260' width='304' height='206' rx='28' fill='#dbeafe' stroke='#2563eb' stroke-width='3'/>
    <circle cx='126' cy='302' r='25' fill='white' stroke='#2563eb' stroke-width='3'/>
    <text x='126' y='311' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='26' font-weight='950' fill='#2563eb'>1</text>
    <text x='162' y='296' font-family='Inter,Arial,sans-serif' font-size='21' font-weight='950' fill='#0f172a'><tspan x='162' dy='0'>Frequency is visible</tspan></text>
    <text x='112' y='356' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='112' y='382' font-family='Inter,Arial,sans-serif' font-size='14' font-weight='750' fill='#1e293b'><tspan x='112' dy='0'>Does this task happen often enough</tspan><tspan x='112' dy='18'>to justify a workflow?</tspan></text>
    <text x='112' y='432' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='112' y='456' font-family='Inter,Arial,sans-serif' font-size='13' fill='#0f172a'><tspan x='112' dy='0'>Count occurrences for one week</tspan><tspan x='112' dy='18'>before building automation.</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='448' y='260' width='304' height='206' rx='28' fill='#dcfce7' stroke='#16a34a' stroke-width='3'/>
    <circle cx='490' cy='302' r='25' fill='white' stroke='#16a34a' stroke-width='3'/>
    <text x='490' y='311' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='26' font-weight='950' fill='#16a34a'>2</text>
    <text x='526' y='296' font-family='Inter,Arial,sans-serif' font-size='21' font-weight='950' fill='#0f172a'><tspan x='526' dy='0'>Input is predictable</tspan></text>
    <text x='476' y='356' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='476' y='382' font-family='Inter,Arial,sans-serif' font-size='14' font-weight='750' fill='#1e293b'><tspan x='476' dy='0'>Do requests arrive in a consistent</tspan><tspan x='476' dy='18'>format, channel, or form field?</tspan></text>
    <text x='476' y='432' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='476' y='456' font-family='Inter,Arial,sans-serif' font-size='13' fill='#0f172a'><tspan x='476' dy='0'>Standardise intake before asking</tspan><tspan x='476' dy='18'>software to decide.</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='812' y='260' width='304' height='206' rx='28' fill='#fef3c7' stroke='#d97706' stroke-width='3'/>
    <circle cx='854' cy='302' r='25' fill='white' stroke='#d97706' stroke-width='3'/>
    <text x='854' y='311' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='26' font-weight='950' fill='#d97706'>3</text>
    <text x='890' y='296' font-family='Inter,Arial,sans-serif' font-size='21' font-weight='950' fill='#0f172a'><tspan x='890' dy='0'>Decision rule is</tspan><tspan x='890' dy='24'>simple</tspan></text>
    <text x='840' y='356' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='840' y='382' font-family='Inter,Arial,sans-serif' font-size='14' font-weight='750' fill='#1e293b'><tspan x='840' dy='0'>Can a non-expert explain the route,</tspan><tspan x='840' dy='18'>approval, or next step in one</tspan><tspan x='840' dy='18'>sentence?</tspan></text>
    <text x='840' y='432' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='840' y='456' font-family='Inter,Arial,sans-serif' font-size='13' fill='#0f172a'><tspan x='840' dy='0'>Automate routing and reminders</tspan><tspan x='840' dy='18'>before automating judgement.</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='84' y='520' width='304' height='206' rx='28' fill='#ede9fe' stroke='#7c3aed' stroke-width='3'/>
    <circle cx='126' cy='562' r='25' fill='white' stroke='#7c3aed' stroke-width='3'/>
    <text x='126' y='571' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='26' font-weight='950' fill='#7c3aed'>4</text>
    <text x='162' y='556' font-family='Inter,Arial,sans-serif' font-size='21' font-weight='950' fill='#0f172a'><tspan x='162' dy='0'>Exception path</tspan><tspan x='162' dy='24'>exists</tspan></text>
    <text x='112' y='616' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='112' y='642' font-family='Inter,Arial,sans-serif' font-size='14' font-weight='750' fill='#1e293b'><tspan x='112' dy='0'>Where should unclear, emotional,</tspan><tspan x='112' dy='18'>high-value, or sensitive cases go?</tspan></text>
    <text x='112' y='692' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='112' y='716' font-family='Inter,Arial,sans-serif' font-size='13' fill='#0f172a'><tspan x='112' dy='0'>Send exceptions to a named human</tspan><tspan x='112' dy='18'>owner with context.</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='448' y='520' width='304' height='206' rx='28' fill='#cffafe' stroke='#0891b2' stroke-width='3'/>
    <circle cx='490' cy='562' r='25' fill='white' stroke='#0891b2' stroke-width='3'/>
    <text x='490' y='571' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='26' font-weight='950' fill='#0891b2'>5</text>
    <text x='526' y='556' font-family='Inter,Arial,sans-serif' font-size='21' font-weight='950' fill='#0f172a'><tspan x='526' dy='0'>Evidence is retained</tspan></text>
    <text x='476' y='616' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='476' y='642' font-family='Inter,Arial,sans-serif' font-size='14' font-weight='750' fill='#1e293b'><tspan x='476' dy='0'>Will the business keep the source</tspan><tspan x='476' dy='18'>message, timestamp, owner, and final</tspan><tspan x='476' dy='18'>action?</tspan></text>
    <text x='476' y='692' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='476' y='716' font-family='Inter,Arial,sans-serif' font-size='13' fill='#0f172a'><tspan x='476' dy='0'>Log the before/after decision trail,</tspan><tspan x='476' dy='18'>not just the task status.</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='812' y='520' width='304' height='206' rx='28' fill='#fee2e2' stroke='#dc2626' stroke-width='3'/>
    <circle cx='854' cy='562' r='25' fill='white' stroke='#dc2626' stroke-width='3'/>
    <text x='854' y='571' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='26' font-weight='950' fill='#dc2626'>6</text>
    <text x='890' y='556' font-family='Inter,Arial,sans-serif' font-size='21' font-weight='950' fill='#0f172a'><tspan x='890' dy='0'>Customer impact is</tspan><tspan x='890' dy='24'>reversible</tspan></text>
    <text x='840' y='616' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='840' y='642' font-family='Inter,Arial,sans-serif' font-size='14' font-weight='750' fill='#1e293b'><tspan x='840' dy='0'>Can the action be corrected quickly</tspan><tspan x='840' dy='18'>if automation is wrong?</tspan></text>
    <text x='840' y='692' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='840' y='716' font-family='Inter,Arial,sans-serif' font-size='13' fill='#0f172a'><tspan x='840' dy='0'>Start with drafts, reminders, tags,</tspan><tspan x='840' dy='18'>and queues before external</tspan><tspan x='840' dy='18'>commitments.</tspan></text>
  </g>
  <rect x='78' y='804' width='1044' height='52' rx='22' fill='#0f172a'/>
  <text x='600' y='826' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='850' fill='#bfdbfe'>Start with drafts, queues, routing and evidence before automated external commitments.</text>
  <text x='600' y='846' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='12' fill='#e5f6ff'>Educational operations guide only — not legal, compliance, medical, financial, security, certification, revenue, savings, ranking, customer-result, approval, or guaranteed-performance advice.</text>
</svg>