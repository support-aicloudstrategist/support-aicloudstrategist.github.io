<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='920' viewBox='0 0 1200 920'>
  <defs>
    <linearGradient id='hero' x1='0' x2='1' y1='0' y2='1'><stop stop-color='#111827'/><stop offset='.45' stop-color='#0369a1'/><stop offset='1' stop-color='#65a30d'/></linearGradient>
    <filter id='shadow' x='-10%' y='-20%' width='120%' height='150%'><feDropShadow dx='0' dy='12' stdDeviation='8' flood-color='#0f172a' flood-opacity='.15'/></filter>
  </defs>
  <rect width='1200' height='920' fill='#f8fafc'/>
  <rect x='36' y='34' width='1128' height='852' rx='44' fill='white' stroke='#bae6fd' stroke-width='3'/>
  <rect x='70' y='68' width='1060' height='164' rx='34' fill='url(#hero)'/>
  <text x='106' y='112' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='900' fill='#bae6fd' letter-spacing='3'>AICLOUDSTRATEGIST · EVENING INFOGRAPHIC</text>
  <text x='106' y='163' font-family='Inter,Arial,sans-serif' font-size='43' font-weight='950' fill='white'>Cloud Bill Owner Triage: 6 Checks Before You Cut Costs</text>
  <text x='106' y='199' font-family='Inter,Arial,sans-serif' font-size='18' fill='#f0fdf4'>A safe educational checklist for owners who see a cloud bill spike and need evidence before changing systems, vendors, or workloads.</text>
  <g transform='translate(958 112)'><rect x='0' y='0' width='112' height='72' rx='20' fill='rgba(255,255,255,.15)' stroke='#d9f99d'/><text x='56' y='31' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='white'>Bill</text><text x='56' y='55' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='15' font-weight='800' fill='#ecfccb'>Evidence first</text></g>
  
  <g filter='url(#shadow)'>
    <rect x='82' y='272' width='306' height='212' rx='30' fill='#e0f2fe' stroke='#0369a1' stroke-width='3'/>
    <circle cx='124' cy='314' r='25' fill='white' stroke='#0369a1' stroke-width='3'/>
    <text x='124' y='323' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='26' font-weight='950' fill='#0369a1'>1</text>
    <text x='158' y='308' font-family='Inter,Arial,sans-serif' font-size='21' font-weight='950' fill='#0f172a'><tspan x='158' dy='0'>Spike date is known</tspan></text>
    <text x='110' y='370' font-family='Inter,Arial,sans-serif' font-size='12' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='110' y='396' font-family='Inter,Arial,sans-serif' font-size='14' font-weight='750' fill='#1e293b'><tspan x='110' dy='0'>Which day or hour did the bill pattern</tspan><tspan x='110' dy='18'>change?</tspan></text>
    <text x='110' y='448' font-family='Inter,Arial,sans-serif' font-size='12' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='110' y='471' font-family='Inter,Arial,sans-serif' font-size='13' fill='#0f172a'><tspan x='110' dy='0'>Mark the first abnormal billing period</tspan><tspan x='110' dy='18'>before touching resources.</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='445' y='272' width='306' height='212' rx='30' fill='#ecfccb' stroke='#65a30d' stroke-width='3'/>
    <circle cx='487' cy='314' r='25' fill='white' stroke='#65a30d' stroke-width='3'/>
    <text x='487' y='323' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='26' font-weight='950' fill='#65a30d'>2</text>
    <text x='521' y='308' font-family='Inter,Arial,sans-serif' font-size='21' font-weight='950' fill='#0f172a'><tspan x='521' dy='0'>Owner is assigned</tspan></text>
    <text x='473' y='370' font-family='Inter,Arial,sans-serif' font-size='12' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='473' y='396' font-family='Inter,Arial,sans-serif' font-size='14' font-weight='750' fill='#1e293b'><tspan x='473' dy='0'>Who can explain the workload, data,</tspan><tspan x='473' dy='18'>user traffic, or deployment?</tspan></text>
    <text x='473' y='448' font-family='Inter,Arial,sans-serif' font-size='12' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='473' y='471' font-family='Inter,Arial,sans-serif' font-size='13' fill='#0f172a'><tspan x='473' dy='0'>Assign one business owner and one</tspan><tspan x='473' dy='18'>technical owner for review.</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='808' y='272' width='306' height='212' rx='30' fill='#fef9c3' stroke='#ca8a04' stroke-width='3'/>
    <circle cx='850' cy='314' r='25' fill='white' stroke='#ca8a04' stroke-width='3'/>
    <text x='850' y='323' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='26' font-weight='950' fill='#ca8a04'>3</text>
    <text x='884' y='308' font-family='Inter,Arial,sans-serif' font-size='21' font-weight='950' fill='#0f172a'><tspan x='884' dy='0'>Usage driver is</tspan><tspan x='884' dy='24'>separated</tspan></text>
    <text x='836' y='370' font-family='Inter,Arial,sans-serif' font-size='12' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='836' y='396' font-family='Inter,Arial,sans-serif' font-size='14' font-weight='750' fill='#1e293b'><tspan x='836' dy='0'>Is the increase from compute, storage,</tspan><tspan x='836' dy='18'>data transfer, support, licensing, or</tspan><tspan x='836' dy='18'>AI tokens?</tspan></text>
    <text x='836' y='448' font-family='Inter,Arial,sans-serif' font-size='12' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='836' y='471' font-family='Inter,Arial,sans-serif' font-size='13' fill='#0f172a'><tspan x='836' dy='0'>Split the bill by service category</tspan><tspan x='836' dy='18'>before proposing changes.</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='82' y='532' width='306' height='212' rx='30' fill='#f3e8ff' stroke='#7e22ce' stroke-width='3'/>
    <circle cx='124' cy='574' r='25' fill='white' stroke='#7e22ce' stroke-width='3'/>
    <text x='124' y='583' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='26' font-weight='950' fill='#7e22ce'>4</text>
    <text x='158' y='568' font-family='Inter,Arial,sans-serif' font-size='21' font-weight='950' fill='#0f172a'><tspan x='158' dy='0'>Business value is</tspan><tspan x='158' dy='24'>checked</tspan></text>
    <text x='110' y='630' font-family='Inter,Arial,sans-serif' font-size='12' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='110' y='656' font-family='Inter,Arial,sans-serif' font-size='14' font-weight='750' fill='#1e293b'><tspan x='110' dy='0'>Is the spend linked to a launch,</tspan><tspan x='110' dy='18'>customer demand, backup, audit,</tspan><tspan x='110' dy='18'>experiment, or forgotten resource?</tspan></text>
    <text x='110' y='708' font-family='Inter,Arial,sans-serif' font-size='12' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='110' y='731' font-family='Inter,Arial,sans-serif' font-size='13' fill='#0f172a'><tspan x='110' dy='0'>Tag each large item as keep, pause,</tspan><tspan x='110' dy='18'>resize, investigate, or retire.</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='445' y='532' width='306' height='212' rx='30' fill='#ffedd5' stroke='#ea580c' stroke-width='3'/>
    <circle cx='487' cy='574' r='25' fill='white' stroke='#ea580c' stroke-width='3'/>
    <text x='487' y='583' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='26' font-weight='950' fill='#ea580c'>5</text>
    <text x='521' y='568' font-family='Inter,Arial,sans-serif' font-size='21' font-weight='950' fill='#0f172a'><tspan x='521' dy='0'>Risk path is visible</tspan></text>
    <text x='473' y='630' font-family='Inter,Arial,sans-serif' font-size='12' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='473' y='656' font-family='Inter,Arial,sans-serif' font-size='14' font-weight='750' fill='#1e293b'><tspan x='473' dy='0'>Could a cost change affect uptime,</tspan><tspan x='473' dy='18'>security logging, backup retention, or</tspan><tspan x='473' dy='18'>customer experience?</tspan></text>
    <text x='473' y='708' font-family='Inter,Arial,sans-serif' font-size='12' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='473' y='731' font-family='Inter,Arial,sans-serif' font-size='13' fill='#0f172a'><tspan x='473' dy='0'>Route risky changes to approval; start</tspan><tspan x='473' dy='18'>with reports and alerts.</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='808' y='532' width='306' height='212' rx='30' fill='#fee2e2' stroke='#dc2626' stroke-width='3'/>
    <circle cx='850' cy='574' r='25' fill='white' stroke='#dc2626' stroke-width='3'/>
    <text x='850' y='583' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='26' font-weight='950' fill='#dc2626'>6</text>
    <text x='884' y='568' font-family='Inter,Arial,sans-serif' font-size='21' font-weight='950' fill='#0f172a'><tspan x='884' dy='0'>Evidence loop</tspan><tspan x='884' dy='24'>remains</tspan></text>
    <text x='836' y='630' font-family='Inter,Arial,sans-serif' font-size='12' font-weight='900' fill='#475569'>OWNER QUESTION</text>
    <text x='836' y='656' font-family='Inter,Arial,sans-serif' font-size='14' font-weight='750' fill='#1e293b'><tspan x='836' dy='0'>Will the team see whether the action</tspan><tspan x='836' dy='18'>helped or created side effects?</tspan></text>
    <text x='836' y='708' font-family='Inter,Arial,sans-serif' font-size='12' font-weight='900' fill='#475569'>SAFE FIRST ACTION</text>
    <text x='836' y='731' font-family='Inter,Arial,sans-serif' font-size='13' fill='#0f172a'><tspan x='836' dy='0'>Record before state, action, owner,</tspan><tspan x='836' dy='18'>timestamp, and follow-up review date.</tspan></text>
  </g>
  <rect x='78' y='824' width='1044' height='52' rx='22' fill='#111827'/>
  <text x='600' y='846' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='850' fill='#bae6fd'>Cut cloud costs only after date, owner, service driver, value, risk, and evidence are visible.</text>
  <text x='600' y='866' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='12' fill='#e5f6ff'>Educational operations guide only — not legal, compliance, medical, financial, security, certification, savings, ranking, customer-result, approval, or guaranteed-performance advice.</text>
</svg>