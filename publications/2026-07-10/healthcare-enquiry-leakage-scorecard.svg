<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675'><rect width='1200' height='675' fill='#f7fbff'/><circle cx='1060' cy='90' r='110' fill='#18a7a7' opacity='.16'/><circle cx='120' cy='610' r='120' fill='#ffb84d' opacity='.18'/><text x='52' y='68' font-size='24' font-weight='900' fill='#0f5e7a'>AICloudStrategist knowledge post A</text><text x='52' y='118' font-size='44' font-weight='900' fill='#17324d'>Healthcare GrowthOS leakage scorecard</text><text x='52' y='158' font-size='23' fill='#475569'>Six handoffs to inspect before adding more ad spend or automation.</text><g><rect x='50' y='210' width='300' height='170' rx='24' fill='white' stroke='#18a7a7' stroke-width='3'/><circle cx='92' cy='254' r='24' fill='#ffb84d'/><text x='92' y='262' text-anchor='middle' font-size='24' font-weight='900' fill='#17324d'>1</text><text x='132' y='252' font-size='25' font-weight='900' fill='#17324d'>Missed call</text><text x='132' y='286' font-size='21' font-weight='800' fill='#0f5e7a'>No callback SLA</text><foreignObject x='78' y='306' width='244' height='55'><div xmlns='http://www.w3.org/1999/xhtml' style='font:17px Arial;color:#334155;line-height:1.25'>Route every missed call to a named owner and timer.</div></foreignObject></g><g><rect x='390' y='210' width='300' height='170' rx='24' fill='white' stroke='#18a7a7' stroke-width='3'/><circle cx='432' cy='254' r='24' fill='#ffb84d'/><text x='432' y='262' text-anchor='middle' font-size='24' font-weight='900' fill='#17324d'>2</text><text x='472' y='252' font-size='25' font-weight='900' fill='#17324d'>WhatsApp chat</text><text x='472' y='286' font-size='21' font-weight='800' fill='#0f5e7a'>No owner</text><foreignObject x='418' y='306' width='244' height='55'><div xmlns='http://www.w3.org/1999/xhtml' style='font:17px Arial;color:#334155;line-height:1.25'>Assign chat ownership before asking for patient details.</div></foreignObject></g><g><rect x='730' y='210' width='300' height='170' rx='24' fill='white' stroke='#18a7a7' stroke-width='3'/><circle cx='772' cy='254' r='24' fill='#ffb84d'/><text x='772' y='262' text-anchor='middle' font-size='24' font-weight='900' fill='#17324d'>3</text><text x='812' y='252' font-size='25' font-weight='900' fill='#17324d'>Web form</text><text x='812' y='286' font-size='21' font-weight='800' fill='#0f5e7a'>No CRM handoff</text><foreignObject x='758' y='306' width='244' height='55'><div xmlns='http://www.w3.org/1999/xhtml' style='font:17px Arial;color:#334155;line-height:1.25'>Create one source of truth before running campaigns.</div></foreignObject></g><g><rect x='50' y='430' width='300' height='170' rx='24' fill='white' stroke='#18a7a7' stroke-width='3'/><circle cx='92' cy='474' r='24' fill='#ffb84d'/><text x='92' y='482' text-anchor='middle' font-size='24' font-weight='900' fill='#17324d'>4</text><text x='132' y='472' font-size='25' font-weight='900' fill='#17324d'>Campaign lead</text><text x='132' y='506' font-size='21' font-weight='800' fill='#0f5e7a'>No source tag</text><foreignObject x='78' y='526' width='244' height='55'><div xmlns='http://www.w3.org/1999/xhtml' style='font:17px Arial;color:#334155;line-height:1.25'>Keep UTM/source tags through the full journey.</div></foreignObject></g><g><rect x='390' y='430' width='300' height='170' rx='24' fill='white' stroke='#18a7a7' stroke-width='3'/><circle cx='432' cy='474' r='24' fill='#ffb84d'/><text x='432' y='482' text-anchor='middle' font-size='24' font-weight='900' fill='#17324d'>5</text><text x='472' y='472' font-size='25' font-weight='900' fill='#17324d'>Appointment request</text><text x='472' y='506' font-size='21' font-weight='800' fill='#0f5e7a'>No reminder loop</text><foreignObject x='418' y='526' width='244' height='55'><div xmlns='http://www.w3.org/1999/xhtml' style='font:17px Arial;color:#334155;line-height:1.25'>Automate reminders with human escalation on failure.</div></foreignObject></g><g><rect x='730' y='430' width='300' height='170' rx='24' fill='white' stroke='#18a7a7' stroke-width='3'/><circle cx='772' cy='474' r='24' fill='#ffb84d'/><text x='772' y='482' text-anchor='middle' font-size='24' font-weight='900' fill='#17324d'>6</text><text x='812' y='472' font-size='25' font-weight='900' fill='#17324d'>Review request</text><text x='812' y='506' font-size='21' font-weight='800' fill='#0f5e7a'>No trust follow-up</text><foreignObject x='758' y='526' width='244' height='55'><div xmlns='http://www.w3.org/1999/xhtml' style='font:17px Arial;color:#334155;line-height:1.25'>Ask for feedback only after care touchpoints are complete.</div></foreignObject></g><rect x='50' y='625' width='1100' height='34' rx='17' fill='#17324d'/><text x='600' y='648' text-anchor='middle' font-size='17' font-weight='800' fill='white'>Demo operating model • No client results claimed • AICS Healthcare GrowthOS</text></svg>