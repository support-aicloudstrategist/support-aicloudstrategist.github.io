<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title>The AI Answer Verification Loop</title><desc>A safe educational loop for checking AI-generated answers before they influence customers, teams, vendors, public pages, or decisions.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#06111f"/><stop offset="0.55" stop-color="#0f2f49"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020617" flood-opacity="0.28"/></filter>
<style><![CDATA[
.title{font:900 72px Inter,Segoe UI,Arial,sans-serif;fill:#f8fbff} .sub{font:500 28px Inter,Segoe UI,Arial,sans-serif;fill:#c8f7f1} .kicker{font:900 22px Inter,Segoe UI,Arial,sans-serif;letter-spacing:4px;fill:#93c5fd} .num{font:900 42px Inter,Segoe UI,Arial,sans-serif;fill:#06111f} .h{font:900 28px Inter,Segoe UI,Arial,sans-serif;fill:#f8fbff} .p{font:600 19px Inter,Segoe UI,Arial,sans-serif;fill:#dcecff} .small{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#bfeee8} .ring{fill:none;stroke:#67e8f9;stroke-width:20;stroke-linecap:round;stroke-dasharray:92 33;opacity:.72} .card{fill:rgba(255,255,255,.10);stroke:rgba(255,255,255,.25);stroke-width:2} .bubble{fill:#a7f3d0} .arrow{fill:#fbbf24}
]]></style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1290" cy="140" r="250" fill="#22d3ee" opacity="0.10"/><circle cx="180" cy="790" r="310" fill="#a78bfa" opacity="0.12"/>
<text x="90" y="110" class="kicker">AICS EVENING EDUCATIONAL INFOGRAPHIC</text>
<text x="90" y="195" class="title">The AI Answer</text><text x="90" y="275" class="title">Verification Loop</text>
<text x="92" y="330" class="sub">Check answers before they affect customers, teams, vendors, public pages, or decisions.</text>
<g transform="translate(950 452)" filter="url(#shadow)"><circle r="246" class="ring"/><circle r="142" fill="#ffffff" opacity=".95"/><text text-anchor="middle" y="-22" style="font:900 34px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a">VERIFY</text><text text-anchor="middle" y="22" style="font:800 26px Inter,Segoe UI,Arial,sans-serif;fill:#0f766e">before use</text><text text-anchor="middle" y="62" style="font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#334155">source • claim • risk • audience • action</text></g>
<g transform="translate(92 410)" filter="url(#shadow)"><rect class="card" rx="30" width="340" height="150"/><circle class="bubble" cx="54" cy="54" r="34"/><text x="54" y="68" text-anchor="middle" class="num">1</text><text x="104" y="52" class="h">Source check</text><text x="36" y="98" dy="0" class="p">Confirm which notes, records, policies,</text><text x="36" y="98" dy="25" class="p">URLs, or examples the answer is allowed to</text><text x="36" y="98" dy="50" class="p">use.</text></g>
<g transform="translate(450 465)" filter="url(#shadow)"><rect class="card" rx="30" width="340" height="150"/><circle class="bubble" cx="54" cy="54" r="34"/><text x="54" y="68" text-anchor="middle" class="num">2</text><text x="104" y="52" class="h">Claim check</text><text x="36" y="98" dy="0" class="p">Separate facts, assumptions, estimates,</text><text x="36" y="98" dy="25" class="p">opinions, and missing information before</text><text x="36" y="98" dy="50" class="p">sharing.</text></g>
<g transform="translate(725 650)" filter="url(#shadow)"><rect class="card" rx="30" width="340" height="150"/><circle class="bubble" cx="54" cy="54" r="34"/><text x="54" y="68" text-anchor="middle" class="num">3</text><text x="104" y="52" class="h">Risk check</text><text x="36" y="98" dy="0" class="p">Pause for human review when the answer</text><text x="36" y="98" dy="25" class="p">touches price, identity, legal meaning,</text><text x="36" y="98" dy="50" class="p">security, health, payments, or public</text></g>
<g transform="translate(1095 612)" filter="url(#shadow)"><rect class="card" rx="30" width="340" height="150"/><circle class="bubble" cx="54" cy="54" r="34"/><text x="54" y="68" text-anchor="middle" class="num">4</text><text x="104" y="52" class="h">Audience check</text><text x="36" y="98" dy="0" class="p">Rewrite only for the intended reader:</text><text x="36" y="98" dy="25" class="p">customer, employee, vendor, owner, or</text><text x="36" y="98" dy="50" class="p">internal reviewer.</text></g>
<g transform="translate(1185 325)" filter="url(#shadow)"><rect class="card" rx="30" width="340" height="150"/><circle class="bubble" cx="54" cy="54" r="34"/><text x="54" y="68" text-anchor="middle" class="num">5</text><text x="104" y="52" class="h">Action check</text><text x="36" y="98" dy="0" class="p">Make the next step small, reversible,</text><text x="36" y="98" dy="25" class="p">tracked, and owned by a named human.</text></g>
<text x="90" y="845" class="small">Boundary: Educational workflow only — not legal, compliance, medical, financial, security, certification, savings, ranking, revenue, booking, or guaranteed-performance advice.</text></svg>