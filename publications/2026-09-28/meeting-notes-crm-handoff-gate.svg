<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='900' viewBox='0 0 1200 900'>
<defs><linearGradient id='hero' x1='0' x2='1'><stop stop-color='#0f172a'/><stop offset='.55' stop-color='#075985'/><stop offset='1' stop-color='#065f46'/></linearGradient><pattern id='grid' width='32' height='32' patternUnits='userSpaceOnUse'><path d='M 32 0 L 0 0 0 32' fill='none' stroke='#bfdbfe' stroke-width='1' opacity='.55'/></pattern><filter id='shadow'><feDropShadow dx='0' dy='8' stdDeviation='9' flood-color='#0f172a' flood-opacity='.15'/></filter></defs>
<rect width='1200' height='900' fill='#eff6ff'/><rect width='1200' height='900' fill='url(#grid)'/><rect x='34' y='34' width='1132' height='832' rx='44' fill='#ffffff' stroke='#bfdbfe' stroke-width='3'/>
<rect x='58' y='58' width='1084' height='172' rx='34' fill='url(#hero)'/>
<text x='88' y='105' fill='#bae6fd' font-size='24' font-weight='900'>AICloudStrategist • safe educational infographic • evening post</text>
<foreignObject x='88' y='124' width='760' height='84'><div xmlns='http://www.w3.org/1999/xhtml' style='font:44px Inter,Arial,sans-serif;font-weight:900;line-height:1.05;color:white'>Meeting Notes to CRM Handoff Gate: 7 Safe Checks Before Automating Follow-Up</div></foreignObject>
<rect x='885' y='92' width='220' height='96' rx='24' fill='rgba(255,255,255,.13)' stroke='#7dd3fc'/><text x='995' y='130' text-anchor='middle' fill='white' font-size='44' font-weight='900'>7</text><text x='995' y='162' text-anchor='middle' fill='#d1fae5' font-size='18' font-weight='800'>review checks</text>
<g filter='url(#shadow)'><rect x='60' y='260' width='340' height='132' rx='24' fill='#ffffff' stroke='#0ea5e9' stroke-width='3'/><circle cx='102' cy='302' r='25' fill='#0ea5e9'/><text x='102' y='312' text-anchor='middle' fill='white' font-size='25' font-weight='900'>1</text><text x='142' y='298' fill='#0f172a' font-size='22' font-weight='900'>Consent boundary</text><foreignObject x='142' y='312' width='235' height='62'><div xmlns='http://www.w3.org/1999/xhtml' style='font:16px Inter,Arial,sans-serif;line-height:1.22;color:#334155'>Confirm the meeting-notes source is allowed for internal processing before copying anything into CRM.</div></foreignObject></g><g filter='url(#shadow)'><rect x='430' y='260' width='340' height='132' rx='24' fill='#ffffff' stroke='#22c55e' stroke-width='3'/><circle cx='472' cy='302' r='25' fill='#22c55e'/><text x='472' y='312' text-anchor='middle' fill='white' font-size='25' font-weight='900'>2</text><text x='512' y='298' fill='#0f172a' font-size='22' font-weight='900'>Identity match</text><foreignObject x='512' y='312' width='235' height='62'><div xmlns='http://www.w3.org/1999/xhtml' style='font:16px Inter,Arial,sans-serif;line-height:1.22;color:#334155'>Match the contact, company, owner, and deal record before creating tasks or updating fields.</div></foreignObject></g><g filter='url(#shadow)'><rect x='800' y='260' width='340' height='132' rx='24' fill='#ffffff' stroke='#f59e0b' stroke-width='3'/><circle cx='842' cy='302' r='25' fill='#f59e0b'/><text x='842' y='312' text-anchor='middle' fill='white' font-size='25' font-weight='900'>3</text><text x='882' y='298' fill='#0f172a' font-size='22' font-weight='900'>Sensitive-data filter</text><foreignObject x='882' y='312' width='235' height='62'><div xmlns='http://www.w3.org/1999/xhtml' style='font:16px Inter,Arial,sans-serif;line-height:1.22;color:#334155'>Remove unnecessary personal, health, financial, legal, credential, or confidential details from summaries.</div></foreignObject></g><g filter='url(#shadow)'><rect x='60' y='430' width='340' height='132' rx='24' fill='#ffffff' stroke='#0ea5e9' stroke-width='3'/><circle cx='102' cy='472' r='25' fill='#0ea5e9'/><text x='102' y='482' text-anchor='middle' fill='white' font-size='25' font-weight='900'>4</text><text x='142' y='468' fill='#0f172a' font-size='22' font-weight='900'>Promise control</text><foreignObject x='142' y='482' width='235' height='62'><div xmlns='http://www.w3.org/1999/xhtml' style='font:16px Inter,Arial,sans-serif;line-height:1.22;color:#334155'>Separate facts from guesses; do not convert casual discussion into commitments, pricing, dates, or guarantees.</div></foreignObject></g><g filter='url(#shadow)'><rect x='430' y='430' width='340' height='132' rx='24' fill='#ffffff' stroke='#22c55e' stroke-width='3'/><circle cx='472' cy='472' r='25' fill='#22c55e'/><text x='472' y='482' text-anchor='middle' fill='white' font-size='25' font-weight='900'>5</text><text x='512' y='468' fill='#0f172a' font-size='22' font-weight='900'>Human owner</text><foreignObject x='512' y='482' width='235' height='62'><div xmlns='http://www.w3.org/1999/xhtml' style='font:16px Inter,Arial,sans-serif;line-height:1.22;color:#334155'>Assign a named reviewer for ambiguous notes, objections, next steps, and customer-facing replies.</div></foreignObject></g><g filter='url(#shadow)'><rect x='800' y='430' width='340' height='132' rx='24' fill='#ffffff' stroke='#f59e0b' stroke-width='3'/><circle cx='842' cy='472' r='25' fill='#f59e0b'/><text x='842' y='482' text-anchor='middle' fill='white' font-size='25' font-weight='900'>6</text><text x='882' y='468' fill='#0f172a' font-size='22' font-weight='900'>Audit trail</text><foreignObject x='882' y='482' width='235' height='62'><div xmlns='http://www.w3.org/1999/xhtml' style='font:16px Inter,Arial,sans-serif;line-height:1.22;color:#334155'>Keep source link, timestamp, automation rule, reviewer, and change reason visible for later review.</div></foreignObject></g><g filter='url(#shadow)'><rect x='245' y='600' width='340' height='132' rx='24' fill='#ffffff' stroke='#dc2626' stroke-width='3'/><circle cx='287' cy='642' r='25' fill='#dc2626'/><text x='287' y='652' text-anchor='middle' fill='white' font-size='25' font-weight='900'>7</text><text x='327' y='638' fill='#0f172a' font-size='22' font-weight='900'>Safe next action</text><foreignObject x='327' y='652' width='235' height='62'><div xmlns='http://www.w3.org/1999/xhtml' style='font:16px Inter,Arial,sans-serif;line-height:1.22;color:#334155'>Create a draft task or internal reminder first; send external follow-up only after approved review.</div></foreignObject></g>
<rect x='635' y='614' width='415' height='106' rx='26' fill='#fff7ed' stroke='#fb923c' stroke-width='3'/><text x='666' y='650' fill='#9a3412' font-size='23' font-weight='900'>Boundary</text><foreignObject x='666' y='665' width='350' height='45'><div xmlns='http://www.w3.org/1999/xhtml' style='font:16px Inter,Arial,sans-serif;line-height:1.25;color:#7c2d12'>Draft internal actions first. External sends need approved review.</div></foreignObject>
<text x='70' y='818' fill='#475569' font-size='17'>No client results, rankings, certifications, savings, revenue, privacy, compliance, or legal guarantees are claimed.</text>
</svg>