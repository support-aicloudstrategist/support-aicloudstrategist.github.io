<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900'>
<defs><pattern id='grid' width='32' height='32' patternUnits='userSpaceOnUse'><path d='M32 0 H0 V32' fill='none' stroke='#86C7E8' stroke-opacity='.12' stroke-width='1'/></pattern><filter id='glow'><feGaussianBlur stdDeviation='4' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<style>.node{fill:#142F50;stroke:#5FE0EB;stroke-width:3}.node2{fill:none;stroke:#2563EB;stroke-width:2;stroke-dasharray:7 7}.icon{fill:none;stroke:#F7FBFF;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.num{fill:#F59E0B;stroke:#FFE3A0;stroke-width:2}.numtext{fill:#102B49;font-family:Arial,sans-serif;font-size:25px;font-weight:900}.step{fill:#FFF;font-family:Arial,sans-serif;font-size:14px;font-weight:900;letter-spacing:.4px}.body{fill:#BDE9F4;font-family:Arial,sans-serif;font-size:17px;font-weight:400}.arrow{fill:none;stroke:#3DCEDC;stroke-width:4}.arrowhead{fill:none;stroke:#3DCEDC;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width='1600' height='900' fill='#1E3A5F'/><rect width='1600' height='900' fill='url(#grid)'/>
<path d='M55 45 H1545 V190 H55 Z' fill='#142F50' stroke='#3DCEDC' stroke-width='3'/><text x='92' y='86' fill='#68DBE8' font-size='19' font-weight='800' font-family='Arial'>AICLOUDSTRATEGIST · SAFE EDUCATIONAL INFOGRAPHIC · EVENING</text><text x='92' y='135' fill='#FFF' font-size='44' font-weight='900' font-family='Arial'>DON'T SHIP THE FIRST AI ANSWER</text><text x='92' y='173' fill='#FFC657' font-size='27' font-weight='800' font-family='Arial'>6-STEP VERIFICATION LOOP</text><text x='1500' y='133' text-anchor='end' fill='#BDE9F4' font-size='21' font-family='Arial'>AI output is a draft to inspect,</text><text x='1500' y='161' text-anchor='end' fill='#BDE9F4' font-size='21' font-family='Arial'>not evidence by itself.</text>
<path d='M178 290 H283' class='arrow'/><path d='M270 280 L283 290 L270 300' class='arrowhead'/><path d='M438 290 H543' class='arrow'/><path d='M530 280 L543 290 L530 300' class='arrowhead'/><path d='M698 290 H803' class='arrow'/><path d='M790 280 L803 290 L790 300' class='arrowhead'/><path d='M958 290 H1063' class='arrow'/><path d='M1050 280 L1063 290 L1050 300' class='arrowhead'/><path d='M1218 290 H1323' class='arrow'/><path d='M1310 280 L1323 290 L1310 300' class='arrowhead'/><g><circle cx='105' cy='290' r='72' class='node'/><circle cx='105' cy='290' r='59' class='node2'/><g transform='translate(105 290)' class='icon'><circle cx='0' cy='0' r='25'/><circle cx='0' cy='0' r='13'/><path d='M0 0 L30 -30 M20 -30 H30 V-20'/></g><circle cx='53' cy='238' r='23' class='num'/><text x='53' y='247' text-anchor='middle' class='numtext'>1</text><text x='105' y='392' text-anchor='middle' class='step'>DEFINE THE TASK</text><text x='105' y='440' text-anchor='middle' class='body'>Write the intended use,</text><text x='105' y='465' text-anchor='middle' class='body'>audience, required format,</text><text x='105' y='490' text-anchor='middle' class='body'>and acceptance criteria.</text></g><g><circle cx='365' cy='290' r='72' class='node'/><circle cx='365' cy='290' r='59' class='node2'/><g transform='translate(365 290)' class='icon'><path d='M-24 -31 H13 L26 -18 V31 H-24 Z M13 -31 V-18 H26'/><circle cx='-2' cy='4' r='13'/><path d='M8 14 L24 30'/></g><circle cx='313' cy='238' r='23' class='num'/><text x='313' y='247' text-anchor='middle' class='numtext'>2</text><text x='365' y='392' text-anchor='middle' class='step'>CHECK THE SOURCES</text><text x='365' y='440' text-anchor='middle' class='body'>Open the cited source,</text><text x='365' y='465' text-anchor='middle' class='body'>confirm it exists, and verify</text><text x='365' y='490' text-anchor='middle' class='body'>that it supports the claim.</text></g><g><circle cx='625' cy='290' r='72' class='node'/><circle cx='625' cy='290' r='59' class='node2'/><g transform='translate(625 290)' class='icon'><rect x='-27' y='-32' width='54' height='64' rx='6'/><rect x='-16' y='-22' width='32' height='13'/><path d='M-16 4 H-8 M4 4 H12 M-16 16 H-8 M4 16 H12'/></g><circle cx='573' cy='238' r='23' class='num'/><text x='573' y='247' text-anchor='middle' class='numtext'>3</text><text x='625' y='392' text-anchor='middle' class='step'>RECOMPUTE THE NUMBERS</text><text x='625' y='440' text-anchor='middle' class='body'>Recalculate totals,</text><text x='625' y='465' text-anchor='middle' class='body'>percentages, dates, units,</text><text x='625' y='490' text-anchor='middle' class='body'>and conversions from the</text><text x='625' y='515' text-anchor='middle' class='body'>original inputs.</text></g><g><circle cx='885' cy='290' r='72' class='node'/><circle cx='885' cy='290' r='59' class='node2'/><g transform='translate(885 290)' class='icon'><rect x='-29' y='-31' width='58' height='62' rx='4'/><path d='M-16 -13 L-10 -7 L0 -20 M-16 3 L-10 9 L0 -4 M-16 19 L-10 25 L0 12 M7 -14 H18 M7 2 H18 M7 18 H18'/></g><circle cx='833' cy='238' r='23' class='num'/><text x='833' y='247' text-anchor='middle' class='numtext'>4</text><text x='885' y='392' text-anchor='middle' class='step'>TEST THE CONSTRAINTS</text><text x='885' y='440' text-anchor='middle' class='body'>Check required fields,</text><text x='885' y='465' text-anchor='middle' class='body'>exclusions, policy</text><text x='885' y='490' text-anchor='middle' class='body'>boundaries, tone, and output</text><text x='885' y='515' text-anchor='middle' class='body'>format.</text></g><g><circle cx='1145' cy='290' r='72' class='node'/><circle cx='1145' cy='290' r='59' class='node2'/><g transform='translate(1145 290)' class='icon'><path d='M0 -34 L34 29 H-34 Z'/><path d='M0 -14 V9 M0 20 V22'/></g><circle cx='1093' cy='238' r='23' class='num'/><text x='1093' y='247' text-anchor='middle' class='numtext'>5</text><text x='1145' y='392' text-anchor='middle' class='step'>REVIEW THE RISK</text><text x='1145' y='440' text-anchor='middle' class='body'>Route higher-risk or</text><text x='1145' y='465' text-anchor='middle' class='body'>irreversible decisions to an</text><text x='1145' y='490' text-anchor='middle' class='body'>authorized human.</text></g><g><circle cx='1405' cy='290' r='72' class='node'/><circle cx='1405' cy='290' r='59' class='node2'/><g transform='translate(1405 290)' class='icon'><path d='M-24 -31 H11 L24 -18 V31 H-24 Z M11 -31 V-18 H24 M-13 -8 H13 M-13 4 H13 M-13 16 H4'/><circle cx='20' cy='20' r='12'/><path d='M15 20 L19 24 L26 15'/></g><circle cx='1353' cy='238' r='23' class='num'/><text x='1353' y='247' text-anchor='middle' class='numtext'>6</text><text x='1405' y='392' text-anchor='middle' class='step'>RECORD THE DECISION</text><text x='1405' y='440' text-anchor='middle' class='body'>Save the input, output,</text><text x='1405' y='465' text-anchor='middle' class='body'>evidence, reviewer, decision,</text><text x='1405' y='490' text-anchor='middle' class='body'>and date.</text></g>
<g><path d='M55 560 H1545 V820 H55 Z' fill='#142F50' stroke='#F59E0B' stroke-width='3'/><text x='88' y='610' fill='#FFC657' font-size='24' font-weight='900' font-family='Arial'>DECISION GATE</text><text x='88' y='650' fill='#E8F5FA' font-size='20' font-family='Arial'>USE only when evidence, calculations, constraints, and authorized review are complete.</text><text x='88' y='681' fill='#BDE9F4' font-size='18' font-family='Arial'>Otherwise: REVISE or ESCALATE.</text><g transform='translate(89 718)'><rect width='320' height='67' rx='8' fill='#0F604F' stroke='#64E6C8' stroke-width='2'/><text x='160' y='43' text-anchor='middle' fill='#FFF' font-size='24' font-weight='900' font-family='Arial'>USE</text></g><g transform='translate(445 718)'><rect width='320' height='67' rx='8' fill='#6F5316' stroke='#FFC657' stroke-width='2'/><text x='160' y='43' text-anchor='middle' fill='#FFF' font-size='24' font-weight='900' font-family='Arial'>REVISE</text></g><g transform='translate(801 718)'><rect width='320' height='67' rx='8' fill='#713C42' stroke='#FF9D8E' stroke-width='2'/><text x='160' y='43' text-anchor='middle' fill='#FFF' font-size='24' font-weight='900' font-family='Arial'>ESCALATE</text></g><path d='M1170 718 H1506 V785 H1170 Z' fill='#1E3A5F' stroke='#5FE0EB' stroke-width='2'/><text x='1338' y='747' text-anchor='middle' fill='#68DBE8' font-size='15' font-weight='800' font-family='Arial'>EVIDENCE · REVIEWER · DATE</text><text x='1338' y='773' text-anchor='middle' fill='#FFF' font-size='17' font-family='Arial'>Preserve the decision trail</text></g>
<text x='800' y='868' text-anchor='middle' fill='#BDE9F4' font-size='16' font-family='Arial'>Educational AI-output review material only.</text></svg>