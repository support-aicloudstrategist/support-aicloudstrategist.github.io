fff' stroke='#7D8FC4' stroke-width='4'/><path d='M21 -19 L25 -15 L32 -24' fill='none' stroke='#7D8FC4' stroke-width='3'/></g><text x='83' y='554' fill='#3D3D4B' font-size='17'>Who is authorized to export, verify,</text><text x='83' y='578' fill='#3D3D4B' font-size='17'>retain, and approve deletion?</text></g><g filter='url(#shadow)'><rect x='430' y='455' width='340' height='190' rx='25' fill='#FFFEFA' stroke='#7CA875' stroke-width='4'/><circle cx='469' cy='494' r='23' fill='#7CA875'/><text x='469' y='502' text-anchor='middle' fill='white' font-size='23' font-weight='900'>5</text><text x='505' y='501' fill='#2C3944' font-size='20' font-weight='900'>RESTORE TEST</text><g transform='translate(730 499)'><path d='M-30 -26 H18 V25 H-30 Z M-20 -13 H8 M-20 -2 H8 M-20 9 H-4' fill='none' stroke='#7CA875' stroke-width='5' stroke-linecap='round'/><circle cx='23' cy='18' r='15' fill='#fff' stroke='#7CA875' stroke-width='4'/><path d='M16 18 L21 23 L30 12' fill='none' stroke='#7CA875' stroke-width='4'/></g><text x='458' y='554' fill='#3D3D4B' font-size='17'>Can a sample export be opened, counted,</text><text x='458' y='578' fill='#3D3D4B' font-size='17'>and reconstructed in a safe test</text><text x='458' y='602' fill='#3D3D4B' font-size='17'>location?</text></g><g filter='url(#shadow)'><rect x='805' y='455' width='340' height='190' rx='25' fill='#FFFEFA' stroke='#9A7DB3' stroke-width='4'/><circle cx='844' cy='494' r='23' fill='#9A7DB3'/><text x='844' y='502' text-anchor='middle' fill='white' font-size='23' font-weight='900'>6</text><text x='880' y='501' fill='#2C3944' font-size='20' font-weight='900'>EXIT SEQUENCE</text><g transform='translate(1105 499)'><path d='M-30 21 C-15 -26 13 29 32 -20' fill='none' stroke='#9A7DB3' stroke-width='5' stroke-linecap='round'/><circle cx='-29' cy='21' r='7' fill='#fff' stroke='#9A7DB3' stroke-width='4'/><circle cx='1' cy='1' r='7' fill='#fff' stroke='#9A7DB3' stroke-width='4'/><path d='M23 -24 L33 -20 L29 -10' fill='none' stroke='#9A7DB3' stroke-width='5'/></g><text x='833' y='554' fill='#3D3D4B' font-size='17'>Are access removal, retention,</text><text x='833' y='578' fill='#3D3D4B' font-size='17'>integrations, billing, and final</text><text x='833' y='602' fill='#3D3D4B' font-size='17'>verification ordered and assigned?</text></g><g filter='url(#shadow)'><rect x='55' y='675' width='1090' height='170' rx='28' fill='#F4E5B4' stroke='#C58A1E' stroke-width='4'/><text x='85' y='717' fill='#76520F' font-size='24' font-weight='900'>DECISION RULE</text><text x='85' y='755' fill='#3D3D4B' font-size='22' font-weight='800'>Choose only when records, owners, test evidence, and sequence are clear.</text><g transform='translate(85 778)'><rect width='176' height='42' rx='12' fill='#D9EAD7'/><text x='88' y='28' text-anchor='middle' fill='#315C39' font-size='18' font-weight='900'>RENEW</text></g><g transform='translate(280 778)'><rect width='230' height='42' rx='12' fill='#DDE6F7'/><text x='115' y='28' text-anchor='middle' fill='#3B4F7B' font-size='18' font-weight='900'>RENEGOTIATE</text></g><g transform='translate(529 778)'><rect width='176' height='42' rx='12' fill='#F7D9D1'/><text x='88' y='28' text-anchor='middle' fill='#7A3E32' font-size='18' font-weight='900'>EXIT</text></g></g><text x='600' y='879' text-anchor='middle' fill='#6A615C' font-size='15'>Educational vendor-exit planning material only.</text></svg>