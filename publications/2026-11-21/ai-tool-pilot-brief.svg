<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675'>
<defs><filter id='shadow' x='-12%' y='-12%' width='135%' height='145%'><feDropShadow dx='3' dy='5' stdDeviation='4' flood-color='#5b5146' flood-opacity='.20'/></filter><style>.title{font-family:Arial,sans-serif;font-size:43px;font-weight:900;fill:#2d2d2d}.sub{font-family:Arial,sans-serif;font-size:20px;font-weight:900;fill:#d8544a;letter-spacing:2px}.deck{font-family:Arial,sans-serif;font-size:16px;font-weight:600;fill:#555}.num{font-family:Arial,sans-serif;font-size:20px;font-weight:900;fill:white;text-anchor:middle}.heading{font-family:Arial,sans-serif;font-size:17px;font-weight:900;fill:#2d2d2d}.body{font-family:Arial,sans-serif;font-size:13px;font-weight:600;fill:#2d2d2d}.labels{font-family:Arial,sans-serif;font-size:10px;font-weight:900;fill:#514a44;letter-spacing:.5px}.strip{font-family:Arial,sans-serif;font-size:11px;font-weight:800;fill:#2d2d2d}.footer{font-family:Arial,sans-serif;font-size:8.7px;font-weight:800;fill:white;letter-spacing:.25px}</style></defs>
<rect width='1200' height='675' fill='#fff8f0'/><path d='M44 58 Q320 31 680 55' fill='none' stroke='#a8d8ea' stroke-width='12' stroke-linecap='round' opacity='.72'/><text x='48' y='72' class='title'>BEFORE YOU BUY AN AI TOOL</text><text x='50' y='105' class='sub'>A 6-BOX PILOT BRIEF</text><text x='50' y='133' class='deck'>Define a small, reviewable pilot before choosing an AI tool.</text><path d='M1110 55l8 17 18 3-13 12 3 18-16-8-16 8 3-18-13-12 18-3z' fill='#e8655a'/>
<g filter='url(#shadow)'><rect x='48' y='160' width='336' height='164' rx='22' fill='#a8d8ea' stroke='#2d2d2d' stroke-width='3'/><circle cx='83' cy='194' r='21' fill='#2d2d2d'/><text x='83' y='202' class='num'>1</text><text x='115' y='200' class='heading'>BUSINESS TASK</text><path d='M340 185 q12 -10 24 0 q-12 10 -24 0z' fill='none' stroke='#2d2d2d' stroke-width='2'/><text x='70' y='235' class='body'><tspan x='70' dy='0'>Name one task, its current owner, the</tspan><tspan x='70' dy='18'>trigger that starts it and the output that</tspan><tspan x='70' dy='18'>marks it complete.</tspan></text><path d='M68 285 Q216 279 364 285' fill='none' stroke='#5b5146' stroke-width='1.5' stroke-dasharray='5 6'/><text x='70' y='305' class='labels'><tspan x='70' dy='0'>TASK · OWNER · TRIGGER · OUTPUT</tspan></text></g><g filter='url(#shadow)'><rect x='432' y='160' width='336' height='164' rx='22' fill='#ffd5c2' stroke='#2d2d2d' stroke-width='3'/><circle cx='467' cy='194' r='21' fill='#2d2d2d'/><text x='467' y='202' class='num'>2</text><text x='499' y='200' class='heading'>EVIDENCE BASELINE</text><path d='M724 185 q12 -10 24 0 q-12 10 -24 0z' fill='none' stroke='#2d2d2d' stroke-width='2'/><text x='454' y='235' class='body'><tspan x='454' dy='0'>Record current time, error, rework or queue</tspan><tspan x='454' dy='18'>evidence using a consistent method. If no</tspan><tspan x='454' dy='18'>baseline exists, observe first.</tspan></text><path d='M452 285 Q600 279 748 285' fill='none' stroke='#5b5146' stroke-width='1.5' stroke-dasharray='5 6'/><text x='454' y='305' class='labels'><tspan x='454' dy='0'>TIME · ERROR · REWORK · QUEUE · OBSERVE</tspan><tspan x='454' dy='15'>FIRST</tspan></text></g><g filter='url(#shadow)'><rect x='816' y='160' width='336' height='164' rx='22' fill='#b5e5cf' stroke='#2d2d2d' stroke-width='3'/><circle cx='851' cy='194' r='21' fill='#2d2d2d'/><text x='851' y='202' class='num'>3</text><text x='883' y='200' class='heading'>DATA BOUNDARY</text><path d='M1108 185 q12 -10 24 0 q-12 10 -24 0z' fill='none' stroke='#2d2d2d' stroke-width='2'/><text x='838' y='235' class='body'><tspan x='838' dy='0'>List the data the pilot may use, the data</tspan><tspan x='838' dy='18'>it must not use and the approved storage or</tspan><tspan x='838' dy='18'>access path.</tspan></text><path d='M836 285 Q984 279 1132 285' fill='none' stroke='#5b5146' stroke-width='1.5' stroke-dasharray='5 6'/><text x='838' y='305' class='labels'><tspan x='838' dy='0'>ALLOWED · RESTRICTED · APPROVED PATH</tspan></text></g><g filter='url(#shadow)'><rect x='48' y='350' width='336' height='164' rx='22' fill='#d5c6e0' stroke='#2d2d2d' stroke-width='3'/><circle cx='83' cy='384' r='21' fill='#2d2d2d'/><text x='83' y='392' class='num'>4</text><text x='115' y='390' class='heading'>HUMAN CONTROL</text><path d='M340 375 q12 -10 24 0 q-12 10 -24 0z' fill='none' stroke='#2d2d2d' stroke-width='2'/><text x='70' y='425' class='body'><tspan x='70' dy='0'>Identify who reviews outputs, what requires</tspan><tspan x='70' dy='18'>approval and when the workflow must stop or</tspan><tspan x='70' dy='18'>return to a person.</tspan></text><path d='M68 475 Q216 469 364 475' fill='none' stroke='#5b5146' stroke-width='1.5' stroke-dasharray='5 6'/><text x='70' y='495' class='labels'><tspan x='70' dy='0'>REVIEW · APPROVAL · STOP · RETURN TO</tspan><tspan x='70' dy='15'>PERSON</tspan></text></g><g filter='url(#shadow)'><rect x='432' y='350' width='336' height='164' rx='22' fill='#f7df9c' stroke='#2d2d2d' stroke-width='3'/><circle cx='467' cy='384' r='21' fill='#2d2d2d'/><text x='467' y='392' class='num'>5</text><text x='499' y='390' class='heading'>PILOT MEASURE</text><path d='M724 375 q12 -10 24 0 q-12 10 -24 0z' fill='none' stroke='#2d2d2d' stroke-width='2'/><text x='454' y='425' class='body'><tspan x='454' dy='0'>Choose one observable process measure and</tspan><tspan x='454' dy='18'>one quality check. Define how both will be</tspan><tspan x='454' dy='18'>recorded.</tspan></text><path d='M452 475 Q600 469 748 475' fill='none' stroke='#5b5146' stroke-width='1.5' stroke-dasharray='5 6'/><text x='454' y='495' class='labels'><tspan x='454' dy='0'>PROCESS MEASURE · QUALITY CHECK ·</tspan><tspan x='454' dy='15'>RECORD BOTH</tspan></text></g><g filter='url(#shadow)'><rect x='816' y='350' width='336' height='164' rx='22' fill='#f3b6c6' stroke='#2d2d2d' stroke-width='3'/><circle cx='851' cy='384' r='21' fill='#2d2d2d'/><text x='851' y='392' class='num'>6</text><text x='883' y='390' class='heading'>EXIT DECISION</text><path d='M1108 375 q12 -10 24 0 q-12 10 -24 0z' fill='none' stroke='#2d2d2d' stroke-width='2'/><text x='838' y='425' class='body'><tspan x='838' dy='0'>At the review date, choose: proceed, revise</tspan><tspan x='838' dy='18'>or stop. Record the evidence and owner for</tspan><tspan x='838' dy='18'>the next decision.</tspan></text><path d='M836 475 Q984 469 1132 475' fill='none' stroke='#5b5146' stroke-width='1.5' stroke-dasharray='5 6'/><text x='838' y='495' class='labels'><tspan x='838' dy='0'>PROCEED · REVISE · STOP · EVIDENCE +</tspan><tspan x='838' dy='15'>OWNER</tspan></text></g>
<rect x='48' y='535' width='1104' height='69' rx='19' fill='#fffdf8' stroke='#2d2d2d' stroke-width='3' stroke-dasharray='8 7'/><text x='70' y='560' class='heading'>MINIMUM PILOT RECORD</text><text x='70' y='583' class='strip'>task · owner · trigger · baseline · allowed data · restricted data · reviewer · stop condition · process measure · quality check · review date · exit decision</text>
<rect x='48' y='622' width='1104' height='32' rx='12' fill='#2d2d2d'/><text x='600' y='642' class='footer' text-anchor='middle'>EDUCATIONAL PILOT-PLANNING MATERIAL · NOT A PERFORMANCE GUARANTEE, SECURITY ASSESSMENT, LEGAL OR COMPLIANCE ADVICE, PROCUREMENT RECOMMENDATION OR PRODUCTION-CHANGE INSTRUCTION</text>
</svg>