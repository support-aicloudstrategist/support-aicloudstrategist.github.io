<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Clinic missed-call owner board</title><desc id="d">Synthetic board for assigning callback ownership without patient data.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#10243a"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs><rect width="1200" height="720" rx="34" fill="#f4f8fb"/><rect x="36" y="32" width="1128" height="656" rx="28" fill="url(#bg)"/><text x="82" y="100" fill="#bae6fd" font-family="Arial" font-size="22" font-weight="700" letter-spacing="3">NO-PHI OWNER BOARD · SYNTHETIC EXAMPLE</text><text x="82" y="158" fill="white" font-family="Arial" font-size="45" font-weight="700">Missed calls → named owner → safe next step</text><text x="82" y="198" fill="#d8f3f0" font-family="Arial" font-size="22">Review one shift before choosing a tool.</text><g font-family="Arial"><rect x="82" y="246" width="244" height="180" rx="18" fill="#fff"/><text x="108" y="285" fill="#075985" font-size="18" font-weight="700">1 · WINDOW</text><text x="108" y="330" fill="#10243a" font-size="25" font-weight="700">Tue · 09–13</text><text x="108" y="370" fill="#456" font-size="18">Phone total: 18</text><text x="108" y="400" fill="#456" font-size="18">Queue total: 15</text><rect x="350" y="246" width="244" height="180" rx="18" fill="#fff"/><text x="376" y="285" fill="#0f766e" font-size="18" font-weight="700">2 · OWNER</text><text x="376" y="330" fill="#10243a" font-size="25" font-weight="700">Front-desk role</text><text x="376" y="370" fill="#456" font-size="18">Backup: practice lead</text><text x="376" y="400" fill="#456" font-size="18">Review: 14:00</text><rect x="618" y="246" width="244" height="180" rx="18" fill="#fff"/><text x="644" y="285" fill="#b45309" font-size="18" font-weight="700">3 · STATUS</text><text x="644" y="330" fill="#10243a" font-size="25" font-weight="700">Assigned →</text><text x="644" y="370" fill="#456" font-size="18">Attempted · Reached</text><text x="644" y="400" fill="#456" font-size="18">Scheduled · Closed</text><rect x="886" y="246" width="244" height="180" rx="18" fill="#fff"/><text x="912" y="285" fill="#be123c" font-size="18" font-weight="700">4 · HOLD RULE</text><text x="912" y="330" fill="#10243a" font-size="22" font-weight="700">Pause if:</text><text x="912" y="365" fill="#456" font-size="17">totals conflict</text><text x="912" y="392" fill="#456" font-size="17">owner is unclear</text><text x="912" y="419" fill="#456" font-size="17">data request is unsafe</text></g><rect x="82" y="486" width="1048" height="132" rx="18" fill="#081c30" stroke="#69c7bd" stroke-width="2"/><text x="112" y="535" fill="#d8f3f0" font-family="Arial" font-size="22" font-weight="700">BOUNDARY</text><text x="112" y="574" fill="white" font-family="Arial" font-size="21">No names · no numbers · no recordings · no clinical details</text><text x="112" y="604" fill="#bae6fd" font-family="Arial" font-size="17">Synthetic education only — not a patient-growth result or compliance proof.</text></svg>