<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='900' viewBox='0 0 1200 900'>
  <defs>
    <linearGradient id='bg' x1='0' x2='1' y1='0' y2='1'><stop offset='0%' stop-color='#f0fdfa'/><stop offset='48%' stop-color='#eef2ff'/><stop offset='100%' stop-color='#fff7ed'/></linearGradient>
    <filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='0' dy='14' stdDeviation='14' flood-color='#0f172a' flood-opacity='.15'/></filter>
  </defs>
  <rect width='1200' height='900' fill='url(#bg)'/>
  <rect x='42' y='42' width='1116' height='816' rx='42' fill='rgba(255,255,255,.74)' stroke='#bae6fd'/>
  <text x='75' y='104' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='900' fill='#0f766e' letter-spacing='3'>AICLOUDSTRATEGIST · EVENING SAFE AI WORKFLOW</text>
  <text x='75' y='166' font-family='Inter,Arial,sans-serif' font-size='58' font-weight='950' fill='#111827'>The AI Reply Safety Stoplight</text>
  <text x='75' y='211' font-family='Inter,Arial,sans-serif' font-size='22' fill='#334155'>A safe educational checklist for deciding when an AI assistant may draft, pause, or escalate a customer-facing reply.</text>
  
    <g filter='url(#shadow)'>
      <rect x='86' y='268' width='1028' height='122' rx='28' fill='#ffffff' stroke='#dbeafe'/>
      <circle cx='160' cy='329' r='42' fill='#16a34a'/>
      <text x='160' y='338' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='20' font-weight='950' fill='#fff'>Green</text>
      <text x='235' y='313' font-family='Inter,Arial,sans-serif' font-size='28' font-weight='950' fill='#132033'>Routine answer</text>
      <text x='268' y='347' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='268' dy='0'>Use only approved facts, current public information, and a</tspan><tspan x='268' dy='24'>visible owner-approved knowledge source.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='86' y='426' width='1028' height='122' rx='28' fill='#ffffff' stroke='#dbeafe'/>
      <circle cx='160' cy='487' r='42' fill='#f59e0b'/>
      <text x='160' y='496' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='20' font-weight='950' fill='#fff'>Amber</text>
      <text x='235' y='471' font-family='Inter,Arial,sans-serif' font-size='28' font-weight='950' fill='#132033'>Needs review</text>
      <text x='268' y='505' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='268' dy='0'>Pause for a human when the message includes uncertainty,</tspan><tspan x='268' dy='24'>unusual context, pricing nuance, or customer frustration.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='86' y='584' width='1028' height='122' rx='28' fill='#ffffff' stroke='#dbeafe'/>
      <circle cx='160' cy='645' r='42' fill='#dc2626'/>
      <text x='160' y='654' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='20' font-weight='950' fill='#fff'>Red</text>
      <text x='235' y='629' font-family='Inter,Arial,sans-serif' font-size='28' font-weight='950' fill='#132033'>Must escalate</text>
      <text x='268' y='663' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='268' dy='0'>Do not auto-answer legal, medical, compliance, security,</tspan><tspan x='268' dy='24'>payment, credential, identity, contract, or result-claim</tspan><tspan x='268' dy='24'>topics.</tspan></text>
    </g>
  <text x='92' y='726' font-family='Inter,Arial,sans-serif' font-size='21' font-weight='950' fill='#0f172a'>Five checks before a customer-facing reply leaves the queue</text>
  
      <g>
        <rect x='94' y='762' width='176' height='82' rx='20' fill='#eff6ff' stroke='#bfdbfe'/>
        <text x='182' y='793' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#1d4ed8'>Source</text>
        <text x='110' y='823' font-family='Inter,Arial,sans-serif' font-size='13.5' fill='#334155'>Can the answer be traced to an approved source?</text>
      </g>
      <g>
        <rect x='298' y='762' width='176' height='82' rx='20' fill='#eff6ff' stroke='#bfdbfe'/>
        <text x='386' y='793' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#1d4ed8'>Scope</text>
        <text x='314' y='823' font-family='Inter,Arial,sans-serif' font-size='13.5' fill='#334155'>Is the request inside the assistant’s allowed bo</text>
      </g>
      <g>
        <rect x='502' y='762' width='176' height='82' rx='20' fill='#eff6ff' stroke='#bfdbfe'/>
        <text x='590' y='793' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#1d4ed8'>Risk</text>
        <text x='518' y='823' font-family='Inter,Arial,sans-serif' font-size='13.5' fill='#334155'>Could the reply create a legal, financial, healt</text>
      </g>
      <g>
        <rect x='706' y='762' width='176' height='82' rx='20' fill='#eff6ff' stroke='#bfdbfe'/>
        <text x='794' y='793' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#1d4ed8'>Owner</text>
        <text x='722' y='823' font-family='Inter,Arial,sans-serif' font-size='13.5' fill='#334155'>Is a named human responsible for exceptions?</text>
      </g>
      <g>
        <rect x='910' y='762' width='176' height='82' rx='20' fill='#eff6ff' stroke='#bfdbfe'/>
        <text x='998' y='793' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#1d4ed8'>Record</text>
        <text x='926' y='823' font-family='Inter,Arial,sans-serif' font-size='13.5' fill='#334155'>Will the decision, source, reviewer, and final s</text>
      </g>
  <rect x='75' y='858' width='1050' height='1' fill='#cbd5e1'/>
</svg>