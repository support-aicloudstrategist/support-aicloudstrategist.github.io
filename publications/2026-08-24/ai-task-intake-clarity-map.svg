<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='900' viewBox='0 0 1200 900'>
  <defs>
    <linearGradient id='bg' x1='0' x2='1' y1='0' y2='1'><stop offset='0%' stop-color='#eef2ff'/><stop offset='48%' stop-color='#ecfeff'/><stop offset='100%' stop-color='#fff7ed'/></linearGradient>
    <filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='0' dy='14' stdDeviation='13' flood-color='#0f172a' flood-opacity='.16'/></filter>
  </defs>
  <rect width='1200' height='900' fill='url(#bg)'/>
  <rect x='42' y='42' width='1116' height='816' rx='42' fill='rgba(255,255,255,.72)' stroke='#bfdbfe'/>
  <text x='75' y='108' font-family='Inter,Arial,sans-serif' font-size='19' font-weight='900' fill='#0f766e' letter-spacing='3'>AICLOUDSTRATEGIST · SAFE AI AUTOMATION</text>
  <text x='75' y='170' font-family='Inter,Arial,sans-serif' font-size='56' font-weight='950' fill='#111827'>The AI Task Intake Clarity Map</text>
  <text x='75' y='213' font-family='Inter,Arial,sans-serif' font-size='22' fill='#334155'>A safe educational checklist for deciding what an AI workflow is allowed to do before anyone automates a business task.</text>
  <path d='M145 660 C275 730, 420 705, 555 750 S850 785, 1048 706' fill='none' stroke='#99f6e4' stroke-width='18' stroke-linecap='round' opacity='.65'/>
  
    <g filter='url(#shadow)'>
      <rect x='80' y='300' width='150' height='310' rx='28' fill='#ffffff' stroke='#d8e6f3'/>
      <circle cx='155' cy='362' r='42' fill='#0f766e'/>
      <text x='155' y='376' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='40' font-weight='950' fill='#fff'>1</text>
      <text x='155' y='439' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#152033'>Goal</text>
      <text x='102' y='480' font-family='Inter,Arial,sans-serif' font-size='16.5' fill='#334155'><tspan x='102' dy='0'>Write the business task</tspan><tspan x='102' dy='23'>in plain language before</tspan><tspan x='102' dy='23'>choosing any model,</tspan><tspan x='102' dy='23'>agent, app, or</tspan><tspan x='102' dy='23'>automation tool.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='250' y='322' width='150' height='310' rx='28' fill='#ffffff' stroke='#d8e6f3'/>
      <circle cx='325' cy='384' r='42' fill='#2563eb'/>
      <text x='325' y='398' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='40' font-weight='950' fill='#fff'>2</text>
      <text x='325' y='461' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#152033'>Inputs</text>
      <text x='272' y='502' font-family='Inter,Arial,sans-serif' font-size='16.5' fill='#334155'><tspan x='272' dy='0'>List the data sources</tspan><tspan x='272' dy='23'>the workflow may read</tspan><tspan x='272' dy='23'>and exclude private,</tspan><tspan x='272' dy='23'>sensitive, or unapproved</tspan><tspan x='272' dy='23'>material.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='420' y='300' width='150' height='310' rx='28' fill='#ffffff' stroke='#d8e6f3'/>
      <circle cx='495' cy='362' r='42' fill='#7c3aed'/>
      <text x='495' y='376' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='40' font-weight='950' fill='#fff'>3</text>
      <text x='495' y='439' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#152033'>Decision rights</text>
      <text x='442' y='480' font-family='Inter,Arial,sans-serif' font-size='16.5' fill='#334155'><tspan x='442' dy='0'>Mark what AI can</tspan><tspan x='442' dy='23'>suggest, what a human</tspan><tspan x='442' dy='23'>must approve, and what</tspan><tspan x='442' dy='23'>the system must never</tspan><tspan x='442' dy='23'>decide alone.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='590' y='322' width='150' height='310' rx='28' fill='#ffffff' stroke='#d8e6f3'/>
      <circle cx='665' cy='384' r='42' fill='#ea580c'/>
      <text x='665' y='398' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='40' font-weight='950' fill='#fff'>4</text>
      <text x='665' y='461' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#152033'>Handoff</text>
      <text x='612' y='502' font-family='Inter,Arial,sans-serif' font-size='16.5' fill='#334155'><tspan x='612' dy='0'>Define the owner,</tspan><tspan x='612' dy='23'>escalation path,</tspan><tspan x='612' dy='23'>fallback step, and</tspan><tspan x='612' dy='23'>expected response time</tspan><tspan x='612' dy='23'>for unclear cases.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='760' y='300' width='150' height='310' rx='28' fill='#ffffff' stroke='#d8e6f3'/>
      <circle cx='835' cy='362' r='42' fill='#0891b2'/>
      <text x='835' y='376' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='40' font-weight='950' fill='#fff'>5</text>
      <text x='835' y='439' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#152033'>Evidence</text>
      <text x='782' y='480' font-family='Inter,Arial,sans-serif' font-size='16.5' fill='#334155'><tspan x='782' dy='0'>Keep a short log of</tspan><tspan x='782' dy='23'>input category, action</tspan><tspan x='782' dy='23'>taken, reviewer, final</tspan><tspan x='782' dy='23'>status, and unresolved</tspan><tspan x='782' dy='23'>exceptions.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='930' y='322' width='150' height='310' rx='28' fill='#ffffff' stroke='#d8e6f3'/>
      <circle cx='1005' cy='384' r='42' fill='#475569'/>
      <text x='1005' y='398' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='40' font-weight='950' fill='#fff'>6</text>
      <text x='1005' y='461' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#152033'>Review</text>
      <text x='952' y='502' font-family='Inter,Arial,sans-serif' font-size='16.5' fill='#334155'><tspan x='952' dy='0'>Recheck the workflow</tspan><tspan x='952' dy='23'>after real use and</tspan><tspan x='952' dy='23'>remove shortcuts that</tspan><tspan x='952' dy='23'>create risk, confusion,</tspan><tspan x='952' dy='23'>or customer friction.</tspan></text>
    </g>
  <rect x='75' y='770' width='1050' height='76' rx='22' fill='#0f172a'/>
  <text x='100' y='803' font-family='Inter,Arial,sans-serif' font-size='19' font-weight='850' fill='#bae6fd'>Truth boundary</text>
  <text x='100' y='831' font-family='Inter,Arial,sans-serif' font-size='17' fill='#e5f0ff'>Educational workflow only — not legal, compliance, medical, financial, security, certification, savings, ranking, revenue, booking, or guaranteed-performance advice.</text>
</svg>