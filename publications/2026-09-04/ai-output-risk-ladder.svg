<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='900' viewBox='0 0 1200 900'>
  <defs>
    <linearGradient id='hero' x1='0' x2='1' y1='0' y2='1'><stop stop-color='#0f172a'/><stop offset='.5' stop-color='#1d4ed8'/><stop offset='1' stop-color='#991b1b'/></linearGradient>
    <filter id='shadow' x='-10%' y='-20%' width='120%' height='150%'><feDropShadow dx='0' dy='14' stdDeviation='9' flood-color='#0f172a' flood-opacity='.14'/></filter>
  </defs>
  <rect width='1200' height='900' fill='#f8fafc'/>
  <rect x='36' y='34' width='1128' height='832' rx='44' fill='white' stroke='#dbeafe' stroke-width='3'/>
  <rect x='70' y='68' width='1060' height='150' rx='34' fill='url(#hero)'/>
  <text x='106' y='112' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='900' fill='#bfdbfe' letter-spacing='3'>AICLOUDSTRATEGIST · EVENING INFOGRAPHIC</text>
  <text x='106' y='166' font-family='Inter,Arial,sans-serif' font-size='54' font-weight='950' fill='white'>The AI Output Risk Ladder</text>
  <text x='106' y='202' font-family='Inter,Arial,sans-serif' font-size='18' fill='#e0f2fe'>A safe educational checklist for deciding when an AI-assisted draft can be used as-is, when it needs owner review, and when it must stop before becoming a business action.</text>
  <text x='600' y='264' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#0f172a'>Five levels for deciding use, review, or stop</text>
  
  <g filter='url(#shadow)'>
    <rect x='340' y='690' width='520' height='88' rx='26' fill='#dcfce7' stroke='#16a34a' stroke-width='3'/>
    <circle cx='388' cy='734' r='29' fill='white' stroke='#16a34a' stroke-width='3'/>
    <text x='388' y='743' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='28' font-weight='950' fill='#16a34a'>1</text>
    <text x='432' y='727' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#0f172a'><tspan x='432.0' dy='0'>Safe note</tspan></text>
    <text x='590' y='724' font-family='Inter,Arial,sans-serif' font-size='15' fill='#334155'><tspan x='590.0' dy='0'>Internal reminder, summary, or personal</tspan><tspan x='590.0' dy='18'>checklist</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='290' y='572' width='620' height='88' rx='26' fill='#dbeafe' stroke='#2563eb' stroke-width='3'/>
    <circle cx='338' cy='616' r='29' fill='white' stroke='#2563eb' stroke-width='3'/>
    <text x='338' y='625' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='28' font-weight='950' fill='#2563eb'>2</text>
    <text x='382' y='609' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#0f172a'><tspan x='382.0' dy='0'>Team draft</tspan></text>
    <text x='540' y='606' font-family='Inter,Arial,sans-serif' font-size='15' fill='#334155'><tspan x='540.0' dy='0'>Draft for a colleague, task, or operating</tspan><tspan x='540.0' dy='18'>note</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='240' y='454' width='720' height='88' rx='26' fill='#fef3c7' stroke='#d97706' stroke-width='3'/>
    <circle cx='288' cy='498' r='29' fill='white' stroke='#d97706' stroke-width='3'/>
    <text x='288' y='507' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='28' font-weight='950' fill='#d97706'>3</text>
    <text x='332' y='491' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#0f172a'><tspan x='332.0' dy='0'>Customer-facing</tspan><tspan x='332.0' dy='22'>draft</tspan></text>
    <text x='490' y='488' font-family='Inter,Arial,sans-serif' font-size='15' fill='#334155'><tspan x='490.0' dy='0'>Website copy, support reply, proposal note,</tspan><tspan x='490.0' dy='18'>or FAQ</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='190' y='336' width='820' height='88' rx='26' fill='#ffedd5' stroke='#ea580c' stroke-width='3'/>
    <circle cx='238' cy='380' r='29' fill='white' stroke='#ea580c' stroke-width='3'/>
    <text x='238' y='389' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='28' font-weight='950' fill='#ea580c'>4</text>
    <text x='282' y='373' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#0f172a'><tspan x='282.0' dy='0'>Sensitive-domain</tspan><tspan x='282.0' dy='22'>answer</tspan></text>
    <text x='440' y='370' font-family='Inter,Arial,sans-serif' font-size='15' fill='#334155'><tspan x='440.0' dy='0'>Privacy, security, health, finance, legal,</tspan><tspan x='440.0' dy='18'>compliance, or HR-like topics</tspan></text>
  </g>
  <g filter='url(#shadow)'>
    <rect x='140' y='218' width='920' height='88' rx='26' fill='#fee2e2' stroke='#dc2626' stroke-width='3'/>
    <circle cx='188' cy='262' r='29' fill='white' stroke='#dc2626' stroke-width='3'/>
    <text x='188' y='271' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='28' font-weight='950' fill='#dc2626'>5</text>
    <text x='232' y='255' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='950' fill='#0f172a'><tspan x='232.0' dy='0'>External</tspan><tspan x='232.0' dy='22'>commitment</tspan></text>
    <text x='390' y='252' font-family='Inter,Arial,sans-serif' font-size='15' fill='#334155'><tspan x='390.0' dy='0'>Contract-like promise, spend decision,</tspan><tspan x='390.0' dy='18'>guarantee, customer send, or production</tspan><tspan x='390.0' dy='18'>change</tspan></text>
  </g>
  <rect x='78' y='802' width='1044' height='52' rx='22' fill='#0f172a'/>
  <text x='600' y='824' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='13' font-weight='800' fill='#bfdbfe'>Before publishing or acting: source named · claim type known · risk marked · owner route set · stop rule clear</text>
  <text x='600' y='844' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='12' fill='#e5e7eb'>Educational operations guide only — not legal, compliance, medical, financial, security, certification, revenue, savings, ranking, customer-result, approval, or guaranteed-performance advice.</text>
</svg>