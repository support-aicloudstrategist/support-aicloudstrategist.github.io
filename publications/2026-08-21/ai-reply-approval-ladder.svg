<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900' role='img' aria-labelledby='title desc'>
<title id='title'>AI Reply Approval Ladder: 5 checks before a bot answers a customer</title><desc id='desc'>Five AI reply approval checks: routine facts, customer context, promise control, human review, and audit trail.</desc>
<defs><pattern id='grid' width='40' height='40' patternUnits='userSpaceOnUse'><path d='M40 0H0V40' fill='none' stroke='#24405f' stroke-width='1' opacity='.45'/></pattern></defs>
<rect width='1600' height='900' fill='#0b1220'/><rect width='1600' height='900' fill='url(#grid)'/>
<circle cx='1410' cy='120' r='118' fill='#38bdf8' opacity='.12'/><circle cx='126' cy='780' r='160' fill='#22c55e' opacity='.10'/>
<text x='92' y='88' font-family='Inter,Arial,sans-serif' font-size='27' font-weight='900' fill='#38bdf8'>AICloudStrategist • safe educational workflow</text>
<text x='92' y='150' font-family='Inter,Arial,sans-serif' font-size='52' font-weight='900' fill='#e5f0ff'>AI Reply Approval Ladder</text>
<text x='92' y='194' font-family='Inter,Arial,sans-serif' font-size='25' font-weight='650' fill='#a8bdd8'>5 checks before a bot answers a customer</text>
<path d='M210 664 L460 262 L1115 262 L1290 664' fill='none' stroke='#38bdf8' stroke-width='5' opacity='.48'/>
<g font-family='Inter,Arial,sans-serif'><g transform='translate(130 600)'>
<rect x='0' y='0' width='930' height='72' rx='18' fill='#111c2e' stroke='#22c55e' stroke-width='3'/>
<circle cx='38' cy='36' r='24' fill='#22c55e'/><text x='38' y='45' text-anchor='middle' font-size='24' font-weight='900' fill='#0b1220'>1</text>
<text x='84' y='30' font-size='26' font-weight='900' fill='#e5f0ff'>Routine facts</text>
<text x='84' y='57' font-size='17' fill='#a8bdd8'>Only automate answers that repeat approved, low-risk business facts.</text>
<text x='1045' y='44' font-size='18' font-weight='800' fill='#22c55e'>APPROVAL GATE</text>
</g><g transform='translate(130 500)'>
<rect x='70' y='0' width='825' height='72' rx='18' fill='#111c2e' stroke='#38bdf8' stroke-width='3'/>
<circle cx='108' cy='36' r='24' fill='#38bdf8'/><text x='108' y='45' text-anchor='middle' font-size='24' font-weight='900' fill='#0b1220'>2</text>
<text x='154' y='30' font-size='26' font-weight='900' fill='#e5f0ff'>Customer context</text>
<text x='154' y='57' font-size='17' fill='#a8bdd8'>Check whether the message includes personal, sensitive, urgent, or unusual context.</text>
<text x='1045' y='44' font-size='18' font-weight='800' fill='#38bdf8'>APPROVAL GATE</text>
</g><g transform='translate(130 400)'>
<rect x='140' y='0' width='720' height='72' rx='18' fill='#111c2e' stroke='#facc15' stroke-width='3'/>
<circle cx='178' cy='36' r='24' fill='#facc15'/><text x='178' y='45' text-anchor='middle' font-size='24' font-weight='900' fill='#0b1220'>3</text>
<text x='224' y='30' font-size='26' font-weight='900' fill='#e5f0ff'>Promise control</text>
<text x='224' y='57' font-size='17' fill='#a8bdd8'>Do not let automation promise price, timing, availability, diagnosis, refund, or results.</text>
<text x='1045' y='44' font-size='18' font-weight='800' fill='#facc15'>APPROVAL GATE</text>
</g><g transform='translate(130 300)'>
<rect x='210' y='0' width='615' height='72' rx='18' fill='#111c2e' stroke='#fb923c' stroke-width='3'/>
<circle cx='248' cy='36' r='24' fill='#fb923c'/><text x='248' y='45' text-anchor='middle' font-size='24' font-weight='900' fill='#0b1220'>4</text>
<text x='294' y='30' font-size='26' font-weight='900' fill='#e5f0ff'>Human review</text>
<text x='294' y='57' font-size='17' fill='#a8bdd8'>Route uncertain, emotional, legal, medical, payment, credential, or complaint items to a person.</text>
<text x='1045' y='44' font-size='18' font-weight='800' fill='#fb923c'>APPROVAL GATE</text>
</g><g transform='translate(130 200)'>
<rect x='280' y='0' width='510' height='72' rx='18' fill='#111c2e' stroke='#a78bfa' stroke-width='3'/>
<circle cx='318' cy='36' r='24' fill='#a78bfa'/><text x='318' y='45' text-anchor='middle' font-size='24' font-weight='900' fill='#0b1220'>5</text>
<text x='364' y='30' font-size='26' font-weight='900' fill='#e5f0ff'>Audit trail</text>
<text x='364' y='57' font-size='17' fill='#a8bdd8'>Keep the source message, generated reply, owner, decision, and timestamp visible.</text>
<text x='1045' y='44' font-size='18' font-weight='800' fill='#a78bfa'>APPROVAL GATE</text>
</g></g>
<rect x='92' y='760' width='1416' height='78' rx='20' fill='#08111f' stroke='#24405f'/>
<text x='124' y='806' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='900' fill='#facc15'>Truth boundary:</text>
<text x='318' y='806' font-family='Inter,Arial,sans-serif' font-size='19' fill='#e5f0ff'>Educational workflow only — no legal, compliance, medical, financial, security, certification, savings, ranking, revenue, booking, or guaranteed-performance advice.</text>
<text x='92' y='868' font-family='Inter,Arial,sans-serif' font-size='17' fill='#a8bdd8'>support-aicloudstrategist.github.io/publications/2026-08-21/ai-reply-approval-ladder.html</text>
</svg>