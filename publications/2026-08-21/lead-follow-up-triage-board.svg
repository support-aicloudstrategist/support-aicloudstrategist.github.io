<text x='90' y='44' font-size='24' font-weight='900' fill='#152033'>Risk pause</text>
<rect x='90' y='63' width='116' height='24' rx='12' fill='#ffd166' opacity='.16'/><text x='103' y='81' font-size='13' font-weight='800' fill='#152033'>MORNING CHECK</text>
<text x='32' y='122' font-size='18' fill='#475569'>Are legal, medical, tax, pricing, refund, credential, OTP,</text>
<text x='32' y='150' font-size='18' fill='#475569'>or sensitive-data items paused for review?</text>
<text x='32' y='178' font-size='18' fill='#475569'></text>
</g><g transform='translate(430 520)'>
<rect width='316' height='210' rx='26' fill='#ffffff' stroke='#d8e6f3' stroke-width='2'/>
<circle cx='48' cy='48' r='26' fill='#3b82f6'/><text x='48' y='57' text-anchor='middle' font-size='25' font-weight='900' fill='white'>5</text>
<text x='90' y='44' font-size='24' font-weight='900' fill='#152033'>Promise check</text>
<rect x='90' y='63' width='116' height='24' rx='12' fill='#3b82f6' opacity='.16'/><text x='103' y='81' font-size='13' font-weight='800' fill='#152033'>MORNING CHECK</text>
<text x='32' y='122' font-size='18' fill='#475569'>Do automated replies match what the team can</text>
<text x='32' y='150' font-size='18' fill='#475569'>actually honour today?</text>
<text x='32' y='178' font-size='18' fill='#475569'></text>
</g><g transform='translate(788 520)'>
<rect width='316' height='210' rx='26' fill='#ffffff' stroke='#d8e6f3' stroke-width='2'/>
<circle cx='48' cy='48' r='26' fill='#10b981'/><text x='48' y='57' text-anchor='middle' font-size='25' font-weight='900' fill='white'>6</text>
<text x='90' y='44' font-size='24' font-weight='900' fill='#152033'>Evidence saved</text>
<rect x='90' y='63' width='116' height='24' rx='12' fill='#10b981' opacity='.16'/><text x='103' y='81' font-size='13' font-weight='800' fill='#152033'>MORNING CHECK</text>
<text x='32' y='122' font-size='18' fill='#475569'>Are source, timestamp, status, and next-step notes captured</text>
<text x='32' y='150' font-size='18' fill='#475569'>for later review?</text>
<text x='32' y='178' font-size='18' fill='#475569'></text>
</g></g>
<rect x='72' y='760' width='1056' height='74' rx='22' fill='#152033'/>
<text x='104' y='803' font-family='Inter,Arial,sans-serif' font-size='21' font-weight='800' fill='#ffffff'>Truth boundary:</text>
<text x='278' y='803' font-family='Inter,Arial,sans-serif' font-size='19' fill='#dbeafe'>Educational workflow only — no legal, compliance, medical, financial, security, certification, savings, ranking, revenue, booking, or guaranteed-performance advice.</text>
