<title id='title'>Lead Follow-up Triage Board: 6 morning checks before the inbox gets busy</title><desc id='desc'>Six morning lead follow-up triage checks: new enquiries, aging replies, owner assigned, risk pause, promise check, evidence saved.</desc>
<rect width='1200' height='900' fill='#f6fbff'/>
<circle cx='1070' cy='105' r='125' fill='#ffd166' opacity='.58'/><circle cx='140' cy='805' r='150' fill='#7c4dff' opacity='.10'/>
<path d='M845 150c92 28 185 12 270-52' fill='none' stroke='#00b8a9' stroke-width='18' stroke-linecap='round' opacity='.22'/>
<text x='72' y='92' font-family='Inter,Arial,sans-serif' font-size='30' font-weight='900' fill='#00b8a9'>AICloudStrategist • safe educational workflow</text>
<text x='72' y='154' font-family='Inter,Arial,sans-serif' font-size='48' font-weight='900' fill='#152033'>Lead Follow-up Triage Board</text>
<text x='72' y='202' font-family='Inter,Arial,sans-serif' font-size='25' font-weight='650' fill='#43546a'>6 morning checks before the inbox gets busy</text>
<g font-family='Inter,Arial,sans-serif'><g transform='translate(72 250)'>
<rect width='316' height='210' rx='26' fill='#ffffff' stroke='#d8e6f3' stroke-width='2'/>
