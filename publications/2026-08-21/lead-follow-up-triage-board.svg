<text x='90' y='44' font-size='24' font-weight='900' fill='#152033'>New enquiries</text>
<rect x='90' y='63' width='116' height='24' rx='12' fill='#00b8a9' opacity='.16'/><text x='103' y='81' font-size='13' font-weight='800' fill='#152033'>MORNING CHECK</text>
<text x='32' y='122' font-size='18' fill='#475569'>Are all new form, WhatsApp, email, phone, and</text>
<text x='32' y='150' font-size='18' fill='#475569'>social enquiries in one visible queue?</text>
<text x='32' y='178' font-size='18' fill='#475569'></text>
</g><g transform='translate(430 250)'>
<rect width='316' height='210' rx='26' fill='#ffffff' stroke='#d8e6f3' stroke-width='2'/>
<circle cx='48' cy='48' r='26' fill='#7c4dff'/><text x='48' y='57' text-anchor='middle' font-size='25' font-weight='900' fill='white'>2</text>
<text x='90' y='44' font-size='24' font-weight='900' fill='#152033'>Aging replies</text>
<rect x='90' y='63' width='116' height='24' rx='12' fill='#7c4dff' opacity='.16'/><text x='103' y='81' font-size='13' font-weight='800' fill='#152033'>MORNING CHECK</text>
<text x='32' y='122' font-size='18' fill='#475569'>Which leads have waited too long and need</text>
<text x='32' y='150' font-size='18' fill='#475569'>a human response before more automation runs?</text>
<text x='32' y='178' font-size='18' fill='#475569'></text>
</g><g transform='translate(788 250)'>
<rect width='316' height='210' rx='26' fill='#ffffff' stroke='#d8e6f3' stroke-width='2'/>
<circle cx='48' cy='48' r='26' fill='#ff8a3d'/><text x='48' y='57' text-anchor='middle' font-size='25' font-weight='900' fill='white'>3</text>
<text x='90' y='44' font-size='24' font-weight='900' fill='#152033'>Owner assigned</text>
<rect x='90' y='63' width='116' height='24' rx='12' fill='#ff8a3d' opacity='.16'/><text x='103' y='81' font-size='13' font-weight='800' fill='#152033'>MORNING CHECK</text>
<text x='32' y='122' font-size='18' fill='#475569'>Does every open item have a named owner</text>
<text x='32' y='150' font-size='18' fill='#475569'>for the next action or escalation?</text>
<text x='32' y='178' font-size='18' fill='#475569'></text>
</g><g transform='translate(72 520)'>
<rect width='316' height='210' rx='26' fill='#ffffff' stroke='#d8e6f3' stroke-width='2'/>
