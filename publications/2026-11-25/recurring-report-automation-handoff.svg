      <path d='M244 320 Q312 314 380 320' fill='none' stroke='#6B6B6B' stroke-width='2' stroke-dasharray='5 6'/>
      <text x='245' y='350' class='labels'><tspan x='245' dy='0'>Approved source ·</tspan><tspan x='245' dy='17'>Owner · Timing ·</tspan><tspan x='245' dy='17'>Access path</tspan></text>
    </g><g filter='url(#shadow)'>
      <rect x='419' y='184' width='170' height='260' rx='24' fill='#D5C6E0' stroke='#2D2D2D' stroke-width='3'/>
      <circle cx='452' cy='218' r='22' fill='#2D2D2D'/><text x='452' y='226' class='num'>3</text>
      <text x='556' y='226' class='icon' text-anchor='middle'>≡</text>
      <text x='437' y='274' class='heading'><tspan x='437' dy='0'>DEFINE THE RULES</tspan></text>
      <path d='M436 320 Q504 314 572 320' fill='none' stroke='#6B6B6B' stroke-width='2' stroke-dasharray='5 6'/>
      <text x='437' y='350' class='labels'><tspan x='437' dy='0'>Calculation ·</tspan><tspan x='437' dy='17'>Filter · Grouping ·</tspan><tspan x='437' dy='17'>Exceptions</tspan></text>
    </g><g filter='url(#shadow)'>
      <rect x='611' y='184' width='170' height='260' rx='24' fill='#FFD5C2' stroke='#2D2D2D' stroke-width='3'/>
      <circle cx='644' cy='218' r='22' fill='#2D2D2D'/><text x='644' y='226' class='num'>4</text>
      <text x='748' y='226' class='icon' text-anchor='middle'>✓</text>
      <text x='629' y='274' class='heading'><tspan x='629' dy='0'>MARK THE CHECKS</tspan></text>
      <path d='M628 320 Q696 314 764 320' fill='none' stroke='#6B6B6B' stroke-width='2' stroke-dasharray='5 6'/>
      <text x='629' y='350' class='labels'><tspan x='629' dy='0'>Reviewer · Checks ·</tspan><tspan x='629' dy='17'>Evidence</tspan></text>
    </g><g filter='url(#shadow)'>
      <rect x='803' y='184' width='170' height='260' rx='24' fill='#A8D8EA' stroke='#2D2D2D' stroke-width='3'/>
      <circle cx='836' cy='218' r='22' fill='#2D2D2D'/><text x='836' y='226' class='num'>5</text>
      <text x='940' y='226' class='icon' text-anchor='middle'>!</text>
      <text x='821' y='274' class='heading'><tspan x='821' dy='0'>SET THE FALLBACK</tspan></text>
      <path d='M820 320 Q888 314 956 320' fill='none' stroke='#6B6B6B' stroke-width='2' stroke-dasharray='5 6'/>
      <text x='821' y='350' class='labels'><tspan x='821' dy='0'>Missing · Late ·</tspan><tspan x='821' dy='17'>Duplicated ·</tspan><tspan x='821' dy='17'>Inconsistent</tspan></text>
    </g><g filter='url(#shadow)'>
      <rect x='995' y='184' width='170' height='260' rx='24' fill='#FFD5C2' stroke='#2D2D2D' stroke-width='3'/>
