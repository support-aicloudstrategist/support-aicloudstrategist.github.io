<rect width='1200' height='675' fill='#F5F0E8'/><path d='M40 60 Q280 31 530 55' stroke='#A8D8EA' stroke-width='13' fill='none' stroke-linecap='round' opacity='.76'/><path d='M930 42 q22 15 40 0 q-15 20 0 39 q-20 -12 -40 0 q12 -20 0 -39z' fill='#B5E5CF'/>
<text x='40' y='72' class='title'>STILL BUILDING THE SAME REPORT BY HAND?</text><text x='42' y='108' class='sub'>A 6-STEP AUTOMATION HANDOFF</text><text x='42' y='140' class='deck'>Define ownership, inputs, rules, review, fallback and release before automation.</text>
<g filter='url(#shadow)'>
      <rect x='35' y='184' width='170' height='260' rx='24' fill='#A8D8EA' stroke='#2D2D2D' stroke-width='3'/>
      <circle cx='68' cy='218' r='22' fill='#2D2D2D'/><text x='68' y='226' class='num'>1</text>
      <text x='172' y='226' class='icon' text-anchor='middle'>◆</text>
      <text x='53' y='274' class='heading'><tspan x='53' dy='0'>NAME THE DECISION</tspan></text>
      <path d='M52 320 Q120 314 188 320' fill='none' stroke='#6B6B6B' stroke-width='2' stroke-dasharray='5 6'/>
      <text x='53' y='350' class='labels'><tspan x='53' dy='0'>Decision + owner</tspan></text>
    </g><g filter='url(#shadow)'>
      <rect x='227' y='184' width='170' height='260' rx='24' fill='#B5E5CF' stroke='#2D2D2D' stroke-width='3'/>
      <circle cx='260' cy='218' r='22' fill='#2D2D2D'/><text x='260' y='226' class='num'>2</text>
      <text x='364' y='226' class='icon' text-anchor='middle'>▤</text>
