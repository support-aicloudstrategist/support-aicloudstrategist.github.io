  <text x='75' y='104' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='900' fill='#4338ca' letter-spacing='3'>AICLOUDSTRATEGIST · EVENING VENDOR ACCESS CHECKLIST</text>
  <text x='75' y='166' font-family='Inter,Arial,sans-serif' font-size='56' font-weight='950' fill='#111827'>The AI Vendor Access Review Board</text>
  <text x='75' y='211' font-family='Inter,Arial,sans-serif' font-size='22' fill='#334155'>A safe educational checklist for reviewing what an AI vendor or tool may access before it touches business data.</text>
  <path d='M602 252 C602 252 602 730 602 730' stroke='#cbd5e1' stroke-width='3' stroke-dasharray='10 14'/>
  
