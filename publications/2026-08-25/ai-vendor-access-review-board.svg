      <text x='777' y='389' font-family='Inter,Arial,sans-serif' font-size='17.5' fill='#334155'><tspan x='777' dy='0'>What files, messages, records, prompts, or</tspan><tspan x='777' dy='23'>exports will the tool read or store?</tspan></text>
    </g>
