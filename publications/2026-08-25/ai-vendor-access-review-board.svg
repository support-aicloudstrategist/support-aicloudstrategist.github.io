      <text x='247' y='389' font-family='Inter,Arial,sans-serif' font-size='17.5' fill='#334155'><tspan x='247' dy='0'>What problem will the tool solve, and who owns</tspan><tspan x='247' dy='23'>the business decision?</tspan></text>
