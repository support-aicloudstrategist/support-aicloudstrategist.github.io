      <text x='247' y='634' font-family='Inter,Arial,sans-serif' font-size='17.5' fill='#334155'><tspan x='247' dy='0'>Which people, systems, keys, folders, inboxes,</tspan><tspan x='247' dy='23'>channels, or automations are in scope?</tspan></text>
    </g>
