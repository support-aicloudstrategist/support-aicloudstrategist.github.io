<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='900' viewBox='0 0 1200 900'><defs><linearGradient id='bg' x1='0' x2='1' y1='0' y2='1'><stop offset='0%' stop-color='#ecfeff'/><stop offset='48%' stop-color='#f0f9ff'/><stop offset='100%' stop-color='#fef3c7'/></linearGradient><filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='0' dy='14' stdDeviation='14' flood-color='#0f172a' flood-opacity='.15'/></filter></defs><rect width='1200' height='900' fill='url(#bg)'/><rect x='42' y='42' width='1116' height='816' rx='42' fill='rgba(255,255,255,.76)' stroke='#bae6fd'/><text x='75' y='104' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='900' fill='#0369a1' letter-spacing='3'>AICLOUDSTRATEGIST · MORNING SAFE AI WORKFLOW</text><text x='75' y='166' font-family='Inter,Arial,sans-serif' font-size='54' font-weight='950' fill='#111827'>The AI Change Request Safety Gate</text><text x='75' y='211' font-family='Inter,Arial,sans-serif' font-size='21' fill='#334155'>A safe educational checklist for deciding whether an AI-assisted change can proceed, needs review, or must be paused before it affects customers or operations.</text><g filter='url(#shadow)'><rect x='86' y='268' width='1028' height='122' rx='28' fill='#ffffff' stroke='#dbeafe'/><circle cx='160' cy='329' r='42' fill='#059669'/><text x='160' y='338' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='20' font-weight='950' fill='#fff'>Proceed</text><text x='235' y='313' font-family='Inter,Arial,sans-serif' font-size='28' font-weight='950' fill='#132033'>Low-risk internal change</text><text x='268' y='347' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='268' dy='0'>The change is reversible, uses approved information, affects</tspan><tspan x='268' dy='24'>no customer promise, and has a clear owner.</tspan></text></g><g filter='url(#shadow)'><rect x='86' y='426' width='1028' height='122' rx='28' fill='#ffffff' stroke='#dbeafe'/><circle cx='160' cy='487' r='42' fill='#d97706'/><text x='160' y='496' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='20' font-weight='950' fill='#fff'>Review</text><text x='235' y='471' font-family='Inter,Arial,sans-serif' font-size='28' font-weight='950' fill='#132033'>Needs human sign-off</text><text x='268' y='505' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='268' dy='0'>The change touches customer wording, pricing context, personal</tspan><tspan x='268' dy='24'>data, integrations, or a process that operators depend on.</tspan></text></g><g filter='url(#shadow)'><rect x='86' y='584' width='1028' height='122' rx='28' fill='#ffffff' stroke='#dbeafe'/><circle cx='160' cy='645' r='42' fill='#dc2626'/><text x='160' y='654' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='20' font-weight='950' fill='#fff'>Pause</text><text x='235' y='629' font-family='Inter,Arial,sans-serif' font-size='28' font-weight='950' fill='#132033'>Do not automate yet</text><text x='268' y='663' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='268' dy='0'>The change could affect payments, legal duties, medical or</tspan><tspan x='268' dy='24'>compliance decisions, credentials, identity, security,</tspan><tspan x='268' dy='24'>contracts, or result claims.</tspan></text></g><text x='92' y='726' font-family='Inter,Arial,sans-serif' font-size='21' font-weight='950' fill='#0f172a'>Five questions before an AI-assisted change goes live</text><g><rect x='94' y='762' width='176' height='82' rx='20' fill='#f0f9ff' stroke='#bae6fd'/><text x='182' y='793' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0369a1'>Owner</text><text x='110' y='823' font-family='Inter,Arial,sans-serif' font-size='13.5' fill='#334155'>Who approves the change?</text></g><g><rect x='298' y='762' width='176' height='82' rx='20' fill='#f0f9ff' stroke='#bae6fd'/><text x='386' y='793' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0369a1'>Scope</text><text x='314' y='823' font-family='Inter,Arial,sans-serif' font-size='13.5' fill='#334155'>What exactly may the AI modify?</text></g><g><rect x='502' y='762' width='176' height='82' rx='20' fill='#f0f9ff' stroke='#bae6fd'/><text x='590' y='793' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0369a1'>Source</text><text x='518' y='823' font-family='Inter,Arial,sans-serif' font-size='13.5' fill='#334155'>Which approved source supports it?</text></g><g><rect x='706' y='762' width='176' height='82' rx='20' fill='#f0f9ff' stroke='#bae6fd'/><text x='794' y='793' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0369a1'>Rollback</text><text x='722' y='823' font-family='Inter,Arial,sans-serif' font-size='13.5' fill='#334155'>How can the team undo it?</text></g><g><rect x='910' y='762' width='176' height='82' rx='20' fill='#f0f9ff' stroke='#bae6fd'/><text x='998' y='793' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0369a1'>Log</text><text x='926' y='823' font-family='Inter,Arial,sans-serif' font-size='13.5' fill='#334155'>Where is the decision recorded?</text></g><rect x='75' y='858' width='1050' height='1' fill='#cbd5e1'/></svg>