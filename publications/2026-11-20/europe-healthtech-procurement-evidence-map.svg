<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f4f8fb"/><rect x="55" y="45" width="1090" height="710" rx="28" fill="#17324d"/><text x="95" y="115" fill="#8ed1c2" font-family="Arial,sans-serif" font-size="24" font-weight="700">AICLOUDSTRATEGIST · EUROPE HEALTHCARE</text><text x="95" y="175" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="700">Procurement evidence map</text><text x="95" y="215" fill="#d9e2ec" font-family="Arial,sans-serif" font-size="22">Six gates before an AI or healthtech pilot</text><g font-family="Arial,sans-serif"><g fill="#ffffff"><rect x="95" y="275" width="315" height="125" rx="16"/><rect x="442" y="275" width="315" height="125" rx="16"/><rect x="789" y="275" width="315" height="125" rx="16"/><rect x="95" y="440" width="315" height="125" rx="16"/><rect x="442" y="440" width="315" height="125" rx="16"/><rect x="789" y="440" width="315" height="125" rx="16"/></g><g fill="#17324d" font-size="24" font-weight="700"><text x="120" y="320">1 · Intended use</text><text x="467" y="320">2 · Data boundary</text><text x="814" y="320">3 · Security evidence</text><text x="120" y="485">4 · Procurement response</text><text x="467" y="485">5 · Cloud/LLM economics</text><text x="814" y="485">6 · Decision / stop rule</text></g><g fill="#52606d" font-size="17"><text x="120" y="355">Job, people, oversight</text><text x="467" y="355">Purpose, access, retention</text><text x="814" y="355">Owner, source, date</text><text x="120" y="520">Evidence, not assumptions</text><text x="467" y="520">Driver, unit, budget owner</text><text x="814" y="520">Reversible next step</text></g></g><text x="95" y="650" fill="#d9e2ec" font-family="Arial,sans-serif" font-size="20">Mark unknowns. Date every source. Pause when the evidence boundary is unclear.</text><text x="95" y="700" fill="#8ed1c2" font-family="Arial,sans-serif" font-size="18">Synthetic / no-personal-data buyer education · no compliance or savings claim</text></svg>