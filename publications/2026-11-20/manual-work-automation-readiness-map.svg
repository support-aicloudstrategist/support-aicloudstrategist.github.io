<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='900' viewBox='0 0 1200 900'>
<defs><filter id='shadow' x='-15%' y='-15%' width='140%' height='145%'><feDropShadow dx='3' dy='7' stdDeviation='6' flood-color='#5b5146' flood-opacity='.2'/></filter><style>.title{font-family:Arial,sans-serif;font-size:49px;font-weight:900;fill:#2d2d2d}.sub{font-family:Arial,sans-serif;font-size:21px;font-weight:900;fill:#e8655a;letter-spacing:2px}.deck{font-family:Arial,sans-serif;font-size:17px;font-weight:600;fill:#555}.num{font-family:Arial,sans-serif;font-size:25px;font-weight:900;fill:#fff}.heading{font-family:Arial,sans-serif;font-size:18px;font-weight:900;fill:#2d2d2d}.body{font-family:Arial,sans-serif;font-size:15px;font-weight:600;fill:#2d2d2d}.labels{font-family:Arial,sans-serif;font-size:12px;font-weight:900;fill:#544d47;letter-spacing:.7px}.evidence{font-family:Arial,sans-serif;font-size:14px;font-weight:800;fill:#2d2d2d}.footer{font-family:Arial,sans-serif;font-size:11px;font-weight:800;fill:#fff;letter-spacing:.65px}</style></defs>
<rect width='1200' height='900' fill='#f5f0e8'/><path d='M56 76 Q340 48 690 74' fill='none' stroke='#a8d8ea' stroke-width='13' stroke-linecap='round' opacity='.65'/><text x='64' y='105' class='title'>TOO MUCH MANUAL WORK?</text><text x='66' y='145' class='sub'>A 5-CHECK AUTOMATION READINESS MAP</text><text x='66' y='181' class='deck'>Use this educational map before automating a repetitive business workflow.</text>
<g fill='#e8655a'><path d='M1125 77l8 18 19 3-14 13 3 19-16-9-17 9 4-19-15-13 20-3z'/></g>
<g filter='url(#shadow)'><rect x='64' y='224' width='330' height='208' rx='25' fill='#a8d8ea' stroke='#2d2d2d' stroke-width='3'/><circle cx='104' cy='265' r='25' fill='#2d2d2d'/><text x='104' y='274' class='num'>1</text><path d='M328 252 q20 -14 39 0 q-19 14 -39 0z' fill='none' stroke='#2d2d2d' stroke-width='3'/><circle cx='338' cy='252' r='3' fill='#e8655a'/><circle cx='355' cy='252' r='3' fill='#e8655a'/><text x='140' y='272' class='heading'>NAME THE WORKFLOW</text><text x='90' y='315' class='body'><tspan x='90' dy='0'>Write one clear start event, one end</tspan><tspan x='90' dy='22'>result and the person who owns the</tspan><tspan x='90' dy='22'>outcome.</tspan></text><path d='M88 374 Q229.0 367 370 374' fill='none' stroke='#6b6b6b' stroke-width='2' stroke-dasharray='6 7'/><text x='90' y='397' class='labels'><tspan x='90' dy='0'>START · END · OWNER</tspan></text></g><g filter='url(#shadow)'><rect x='435' y='224' width='330' height='208' rx='25' fill='#ffd5c2' stroke='#2d2d2d' stroke-width='3'/><circle cx='475' cy='265' r='25' fill='#2d2d2d'/><text x='475' y='274' class='num'>2</text><path d='M699 252 q20 -14 39 0 q-19 14 -39 0z' fill='none' stroke='#2d2d2d' stroke-width='3'/><circle cx='709' cy='252' r='3' fill='#e8655a'/><circle cx='726' cy='252' r='3' fill='#e8655a'/><text x='511' y='272' class='heading'>MAP THE HANDOFFS</text><text x='461' y='315' class='body'><tspan x='461' dy='0'>Mark every system, person, queue and</tspan><tspan x='461' dy='22'>approval the work passes through.</tspan></text><path d='M459 374 Q600.0 367 741 374' fill='none' stroke='#6b6b6b' stroke-width='2' stroke-dasharray='6 7'/><text x='461' y='397' class='labels'><tspan x='461' dy='0'>SYSTEM · PERSON · QUEUE ·</tspan><tspan x='461' dy='18'>APPROVAL</tspan></text></g><g filter='url(#shadow)'><rect x='806' y='224' width='330' height='208' rx='25' fill='#b5e5cf' stroke='#2d2d2d' stroke-width='3'/><circle cx='846' cy='265' r='25' fill='#2d2d2d'/><text x='846' y='274' class='num'>3</text><path d='M1070 252 q20 -14 39 0 q-19 14 -39 0z' fill='none' stroke='#2d2d2d' stroke-width='3'/><circle cx='1080' cy='252' r='3' fill='#e8655a'/><circle cx='1097' cy='252' r='3' fill='#e8655a'/><text x='882' y='272' class='heading'>CHECK REPEATABILITY</text><text x='832' y='315' class='body'><tspan x='832' dy='0'>Separate stable rules from judgment</tspan><tspan x='832' dy='22'>calls, rare cases and missing</tspan><tspan x='832' dy='22'>information.</tspan></text><path d='M830 374 Q971.0 367 1112 374' fill='none' stroke='#6b6b6b' stroke-width='2' stroke-dasharray='6 7'/><text x='832' y='397' class='labels'><tspan x='832' dy='0'>STABLE RULES · JUDGMENT ·</tspan><tspan x='832' dy='18'>RARE CASES · MISSING INFO</tspan></text></g><g filter='url(#shadow)'><rect x='64' y='466' width='516' height='218' rx='25' fill='#d5c6e0' stroke='#2d2d2d' stroke-width='3'/><circle cx='104' cy='507' r='25' fill='#2d2d2d'/><text x='104' y='516' class='num'>4</text><path d='M514 494 q20 -14 39 0 q-19 14 -39 0z' fill='none' stroke='#2d2d2d' stroke-width='3'/><circle cx='524' cy='494' r='3' fill='#e8655a'/><circle cx='541' cy='494' r='3' fill='#e8655a'/><text x='140' y='514' class='heading'>PROTECT THE EXCEPTIONS</text><text x='90' y='557' class='body'><tspan x='90' dy='0'>Define when automation must stop, ask for review or return</tspan><tspan x='90' dy='22'>work to a human owner.</tspan></text><path d='M88 626 Q322.0 619 556 626' fill='none' stroke='#6b6b6b' stroke-width='2' stroke-dasharray='6 7'/><text x='90' y='649' class='labels'><tspan x='90' dy='0'>STOP · REVIEW · HUMAN OWNER</tspan></text></g><g filter='url(#shadow)'><rect x='620' y='466' width='516' height='218' rx='25' fill='#f7df9c' stroke='#2d2d2d' stroke-width='3'/><circle cx='660' cy='507' r='25' fill='#2d2d2d'/><text x='660' y='516' class='num'>5</text><path d='M1070 494 q20 -14 39 0 q-19 14 -39 0z' fill='none' stroke='#2d2d2d' stroke-width='3'/><circle cx='1080' cy='494' r='3' fill='#e8655a'/><circle cx='1097' cy='494' r='3' fill='#e8655a'/><text x='696' y='514' class='heading'>CHOOSE THE NEXT MOVE</text><text x='646' y='557' class='body'><tspan x='646' dy='0'>AUTOMATE when rules and evidence are clear; SIMPLIFY when</tspan><tspan x='646' dy='22'>the process has avoidable steps; OBSERVE when the pattern is</tspan><tspan x='646' dy='22'>still unclear.</tspan></text><path d='M644 626 Q878.0 619 1112 626' fill='none' stroke='#6b6b6b' stroke-width='2' stroke-dasharray='6 7'/><text x='646' y='649' class='labels'><tspan x='646' dy='0'>AUTOMATE · SIMPLIFY · OBSERVE</tspan></text></g>
<path d='M395 328 q18 -15 36 0' fill='none' stroke='#6b6b6b' stroke-width='3' stroke-dasharray='6 7'/><path d='M766 328 q18 -15 36 0' fill='none' stroke='#6b6b6b' stroke-width='3' stroke-dasharray='6 7'/><path d='M580 575 q18 -15 36 0' fill='none' stroke='#6b6b6b' stroke-width='3' stroke-dasharray='6 7'/>
<rect x='64' y='724' width='1072' height='88' rx='24' fill='#fffaf2' stroke='#2d2d2d' stroke-width='3' stroke-dasharray='9 8'/><text x='90' y='757' class='heading'>MINIMUM EVIDENCE TO RECORD</text><text x='90' y='787' class='evidence'>workflow owner · trigger · inputs · decision rules · exceptions · expected output · review point · rollback path</text>
<rect x='64' y='832' width='1072' height='38' rx='14' fill='#2d2d2d'/><text x='600' y='856' text-anchor='middle' class='footer'>EDUCATIONAL WORKFLOW REVIEW · NOT A PRODUCTIVITY GUARANTEE OR PRODUCTION-CHANGE INSTRUCTION</text>
</svg>