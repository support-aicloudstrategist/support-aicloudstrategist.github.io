<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='900' viewBox='0 0 1200 900'>
  <defs>
    <linearGradient id='hero' x1='0' x2='1' y1='0' y2='1'><stop stop-color='#082f49'/><stop offset='.55' stop-color='#0369a1'/><stop offset='1' stop-color='#0f766e'/></linearGradient>
    <filter id='shadow' x='-15%' y='-20%' width='130%' height='150%'><feDropShadow dx='0' dy='16' stdDeviation='11' flood-color='#0f172a' flood-opacity='.12'/></filter>
  </defs>
  <rect width='1200' height='900' fill='#f7fbff'/>
  <rect x='36' y='34' width='1128' height='832' rx='44' fill='white' stroke='#cfe0f7' stroke-width='3'/>
  <rect x='70' y='68' width='1060' height='168' rx='36' fill='url(#hero)'/>
  <text x='106' y='116' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='900' fill='#bae6fd' letter-spacing='3'>AICLOUDSTRATEGIST · MORNING INFOGRAPHIC</text>
  <text x='106' y='174' font-family='Inter,Arial,sans-serif' font-size='52' font-weight='950' fill='white'>The AI Source Evidence Card</text>
  <text x='106' y='214' font-family='Inter,Arial,sans-serif' font-size='20' fill='#ccfbf1'>A safe educational checklist for keeping AI-assisted business work grounded in approved sources before an answer, draft, or decision moves forward.</text>
  <text x='80' y='270' font-family='Inter,Arial,sans-serif' font-size='23' font-weight='950' fill='#0f172a'>Six source checks before AI work becomes business output</text>
  
    <g filter='url(#shadow)'>
      <rect x='76' y='292' width='318' height='206' rx='30' fill='white' stroke='#d7e3f4' stroke-width='2'/>
      <rect x='104' y='320' width='54' height='54' rx='18' fill='#e0f2fe' stroke='#38bdf8'/>
      <text x='131' y='357' text-anchor='middle' font-family='Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif' font-size='26'>📄</text>
      <text x='174' y='352' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='950' fill='#0f172a'>Source named</text>
      <text x='108' y='410' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='108' dy='0'>Write the document, page, record,</tspan><tspan x='108' dy='22'>owner, or example the AI is allowed to</tspan><tspan x='108' dy='22'>use.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='438' y='292' width='318' height='206' rx='30' fill='white' stroke='#d7e3f4' stroke-width='2'/>
      <rect x='466' y='320' width='54' height='54' rx='18' fill='#e0f2fe' stroke='#38bdf8'/>
      <text x='493' y='357' text-anchor='middle' font-family='Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif' font-size='26'>🕒</text>
      <text x='536' y='352' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='950' fill='#0f172a'>Date checked</text>
      <text x='470' y='410' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='470' dy='0'>Mark when the source was last reviewed</tspan><tspan x='470' dy='22'>so old instructions do not look</tspan><tspan x='470' dy='22'>current.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='800' y='292' width='318' height='206' rx='30' fill='white' stroke='#d7e3f4' stroke-width='2'/>
      <rect x='828' y='320' width='54' height='54' rx='18' fill='#e0f2fe' stroke='#38bdf8'/>
      <text x='855' y='357' text-anchor='middle' font-family='Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif' font-size='26'>🔐</text>
      <text x='898' y='352' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='950' fill='#0f172a'>Permission level</text>
      <text x='832' y='410' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='832' dy='0'>Separate public, internal,</tspan><tspan x='832' dy='22'>confidential, customer, payment, and</tspan><tspan x='832' dy='22'>credential material.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='76' y='542' width='318' height='206' rx='30' fill='white' stroke='#d7e3f4' stroke-width='2'/>
      <rect x='104' y='570' width='54' height='54' rx='18' fill='#e0f2fe' stroke='#38bdf8'/>
      <text x='131' y='607' text-anchor='middle' font-family='Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif' font-size='26'>⛔</text>
      <text x='174' y='602' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='950' fill='#0f172a'>Answer boundary</text>
      <text x='108' y='660' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='108' dy='0'>State what the AI may draft, what it</tspan><tspan x='108' dy='22'>must not claim, and where it must</tspan><tspan x='108' dy='22'>pause.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='438' y='542' width='318' height='206' rx='30' fill='white' stroke='#d7e3f4' stroke-width='2'/>
      <rect x='466' y='570' width='54' height='54' rx='18' fill='#e0f2fe' stroke='#38bdf8'/>
      <text x='493' y='607' text-anchor='middle' font-family='Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif' font-size='26'>👤</text>
      <text x='536' y='602' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='950' fill='#0f172a'>Human reviewer</text>
      <text x='470' y='660' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='470' dy='0'>Assign a person to approve sensitive,</tspan><tspan x='470' dy='22'>uncertain, brand, pricing, or</tspan><tspan x='470' dy='22'>policy-impacting output.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='800' y='542' width='318' height='206' rx='30' fill='white' stroke='#d7e3f4' stroke-width='2'/>
      <rect x='828' y='570' width='54' height='54' rx='18' fill='#e0f2fe' stroke='#38bdf8'/>
      <text x='855' y='607' text-anchor='middle' font-family='Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif' font-size='26'>🧾</text>
      <text x='898' y='602' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='950' fill='#0f172a'>Evidence saved</text>
      <text x='832' y='660' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='832' dy='0'>Keep source link, prompt, draft,</tspan><tspan x='832' dy='22'>review note, final action, and</tspan><tspan x='832' dy='22'>correction trail.</tspan></text>
    </g>
  <rect x='78' y='812' width='1044' height='36' rx='18' fill='#f8fafc' stroke='#cbd5e1'/>
  <text x='600' y='836' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='14' fill='#64748b'>Educational operations guide only — not legal, compliance, medical, financial, security, certification, revenue, savings, ranking, customer-result, or guaranteed-performance advice.</text>
</svg>