<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='940' viewBox='0 0 1200 940'>
  <defs>
    <linearGradient id='bg' x1='0' x2='1' y1='0' y2='1'><stop offset='0%' stop-color='#fff7ed'/><stop offset='48%' stop-color='#eef2ff'/><stop offset='100%' stop-color='#ecfdf5'/></linearGradient>
    <filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='0' dy='14' stdDeviation='12' flood-color='#0f172a' flood-opacity='.13'/></filter>
  </defs>
  <rect width='1200' height='940' fill='url(#bg)'/>
  <rect x='42' y='42' width='1116' height='856' rx='44' fill='rgba(255,255,255,.78)' stroke='#fed7aa'/>
  <text x='76' y='106' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='900' fill='#9a3412' letter-spacing='3'>AICLOUDSTRATEGIST · MORNING AI HANDOFF WORKSHEET</text>
  <text x='76' y='166' font-family='Inter,Arial,sans-serif' font-size='58' font-weight='950' fill='#111827'>The AI Escalation Receipt</text>
  <text x='76' y='212' font-family='Inter,Arial,sans-serif' font-size='21' fill='#334155'>A safe educational worksheet for recording why an AI-assisted task stopped, who owns the decision, and what evidence is needed before work continues.</text>
  <path d='M600 234 C600 274 600 314 600 356' stroke='#fdba74' stroke-width='7' stroke-linecap='round' stroke-dasharray='14 15'/>
  
    <g filter='url(#shadow)'>
      <rect x='72' y='260' width='330' height='230' rx='28' fill='#ffffff' stroke='#dbeafe'/>
      <circle cx='130' cy='316' r='32' fill='#dc2626'/>
      <text x='130' y='325' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='23' font-weight='950' fill='#fff'>01</text>
      <text x='180' y='323' font-family='Inter,Arial,sans-serif' font-size='25' font-weight='950' fill='#111827'>Stop reason</text>
      <text x='100' y='376' font-family='Inter,Arial,sans-serif' font-size='16.5' fill='#334155'><tspan x='100' dy='0'>Write the plain-language reason the AI</tspan><tspan x='100' dy='20'>output should not move forward</tspan><tspan x='100' dy='20'>automatically: missing evidence,</tspan><tspan x='100' dy='20'>sensitive data, unclear owner, or</tspan><tspan x='100' dy='20'>risky impact.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='438' y='260' width='330' height='230' rx='28' fill='#ffffff' stroke='#dbeafe'/>
      <circle cx='496' cy='316' r='32' fill='#2563eb'/>
      <text x='496' y='325' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='23' font-weight='950' fill='#fff'>02</text>
      <text x='546' y='323' font-family='Inter,Arial,sans-serif' font-size='25' font-weight='950' fill='#111827'>Source evidence</text>
      <text x='466' y='376' font-family='Inter,Arial,sans-serif' font-size='16.5' fill='#334155'><tspan x='466' dy='0'>List the exact notes, tickets, emails,</tspan><tspan x='466' dy='20'>screenshots, logs, or documents that</tspan><tspan x='466' dy='20'>are allowed to support the next</tspan><tspan x='466' dy='20'>decision.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='804' y='260' width='330' height='230' rx='28' fill='#ffffff' stroke='#dbeafe'/>
      <circle cx='862' cy='316' r='32' fill='#7c3aed'/>
      <text x='862' y='325' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='23' font-weight='950' fill='#fff'>03</text>
      <text x='912' y='323' font-family='Inter,Arial,sans-serif' font-size='25' font-weight='950' fill='#111827'>Decision owner</text>
      <text x='832' y='376' font-family='Inter,Arial,sans-serif' font-size='16.5' fill='#334155'><tspan x='832' dy='0'>Name the person or role that must</tspan><tspan x='832' dy='20'>approve, reject, rewrite, or park the</tspan><tspan x='832' dy='20'>AI-assisted work before it affects</tspan><tspan x='832' dy='20'>anyone else.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='252' y='552' width='330' height='230' rx='28' fill='#ffffff' stroke='#dbeafe'/>
      <circle cx='310' cy='608' r='32' fill='#16a34a'/>
      <text x='310' y='617' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='23' font-weight='950' fill='#fff'>04</text>
      <text x='360' y='615' font-family='Inter,Arial,sans-serif' font-size='25' font-weight='950' fill='#111827'>Safe next step</text>
      <text x='280' y='668' font-family='Inter,Arial,sans-serif' font-size='16.5' fill='#334155'><tspan x='280' dy='0'>Choose one reversible action: ask for</tspan><tspan x='280' dy='20'>missing facts, create a human-review</tspan><tspan x='280' dy='20'>draft, update the checklist, or record</tspan><tspan x='280' dy='20'>“not enough information”.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='618' y='552' width='330' height='230' rx='28' fill='#ffffff' stroke='#dbeafe'/>
      <circle cx='676' cy='608' r='32' fill='#f97316'/>
      <text x='676' y='617' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='23' font-weight='950' fill='#fff'>05</text>
      <text x='726' y='615' font-family='Inter,Arial,sans-serif' font-size='25' font-weight='950' fill='#111827'>Audit trail</text>
      <text x='646' y='668' font-family='Inter,Arial,sans-serif' font-size='16.5' fill='#334155'><tspan x='646' dy='0'>Save the receipt with date, task,</tspan><tspan x='646' dy='20'>source list, reviewer, decision, and</tspan><tspan x='646' dy='20'>unresolved questions so the team can</tspan><tspan x='646' dy='20'>inspect it later.</tspan></text>
    </g>
  <text x='76' y='802' font-family='Inter,Arial,sans-serif' font-size='22' font-weight='950' fill='#0f172a'>Five prompts to complete the receipt before work resumes</text>
  
      <g>
        <path d='M64 824 h168 a18 18 0 0 1 18 18 v46 a18 18 0 0 1 -18 18 h-168 a18 18 0 0 1 -18 -18 v-46 a18 18 0 0 1 18 -18z' fill='#f8fafc' stroke='#cbd5e1'/>
        <text x='148' y='853' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='950' fill='#0f172a'>Why stop?</text>
        <text x='72' y='881' font-family='Inter,Arial,sans-serif' font-size='12.2' fill='#475569'>What made the AI-assisted task unsafe, uncertain, or incomplete?</text>
      </g>
      <g>
        <path d='M284 824 h168 a18 18 0 0 1 18 18 v46 a18 18 0 0 1 -18 18 h-168 a18 18 0 0 1 -18 -18 v-46 a18 18 0 0 1 18 -18z' fill='#f8fafc' stroke='#cbd5e1'/>
        <text x='368' y='853' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='950' fill='#0f172a'>What facts?</text>
        <text x='292' y='881' font-family='Inter,Arial,sans-serif' font-size='12.2' fill='#475569'>Which exact sources may be used for the next review?</text>
      </g>
      <g>
        <path d='M504 824 h168 a18 18 0 0 1 18 18 v46 a18 18 0 0 1 -18 18 h-168 a18 18 0 0 1 -18 -18 v-46 a18 18 0 0 1 18 -18z' fill='#f8fafc' stroke='#cbd5e1'/>
        <text x='588' y='853' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='950' fill='#0f172a'>Who owns it?</text>
        <text x='512' y='881' font-family='Inter,Arial,sans-serif' font-size='12.2' fill='#475569'>Who has authority to approve or reject the next action?</text>
      </g>
      <g>
        <path d='M724 824 h168 a18 18 0 0 1 18 18 v46 a18 18 0 0 1 -18 18 h-168 a18 18 0 0 1 -18 -18 v-46 a18 18 0 0 1 18 -18z' fill='#f8fafc' stroke='#cbd5e1'/>
        <text x='808' y='853' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='950' fill='#0f172a'>What is safe?</text>
        <text x='732' y='881' font-family='Inter,Arial,sans-serif' font-size='12.2' fill='#475569'>Which reversible step can happen without external impact?</text>
      </g>
      <g>
        <path d='M944 824 h168 a18 18 0 0 1 18 18 v46 a18 18 0 0 1 -18 18 h-168 a18 18 0 0 1 -18 -18 v-46 a18 18 0 0 1 18 -18z' fill='#f8fafc' stroke='#cbd5e1'/>
        <text x='1028' y='853' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='17' font-weight='950' fill='#0f172a'>What is logged?</text>
        <text x='952' y='881' font-family='Inter,Arial,sans-serif' font-size='12.2' fill='#475569'>What evidence proves the handoff was reviewed?</text>
      </g>
</svg>