<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='940' viewBox='0 0 1200 940'>
  <defs>
    <linearGradient id='bg' x1='0' x2='1' y1='0' y2='1'><stop offset='0%' stop-color='#fef2f2'/><stop offset='50%' stop-color='#fffbeb'/><stop offset='100%' stop-color='#ecfdf5'/></linearGradient>
    <filter id='shadow' x='-20%' y='-20%' width='140%' height='140%'><feDropShadow dx='0' dy='16' stdDeviation='13' flood-color='#0f172a' flood-opacity='.14'/></filter>
  </defs>
  <rect width='1200' height='940' fill='url(#bg)'/>
  <rect x='44' y='44' width='1112' height='852' rx='44' fill='rgba(255,255,255,.80)' stroke='#fde68a'/>
  <text x='76' y='106' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='900' fill='#92400e' letter-spacing='3'>AICLOUDSTRATEGIST · EVENING AUTOMATION WORKSHEET</text>
  <text x='76' y='166' font-family='Inter,Arial,sans-serif' font-size='54' font-weight='950' fill='#111827'>The Automation Readiness Traffic Light</text>
  <text x='76' y='214' font-family='Inter,Arial,sans-serif' font-size='21' fill='#334155'>A safe educational worksheet for deciding whether a workflow is ready for automation, needs human review, or should stay manual until facts are clearer.</text>
  <rect x='86' y='250' width='1028' height='12' rx='6' fill='#e5e7eb'/>
  <circle cx='245' cy='256' r='28' fill='#dc2626'/><circle cx='610' cy='256' r='28' fill='#f59e0b'/><circle cx='975' cy='256' r='28' fill='#16a34a'/>
  
    <g filter='url(#shadow)'>
      <rect x='86' y='302' width='318' height='338' rx='34' fill='#ffffff' stroke='#dc2626' stroke-width='4'/>
      <circle cx='158' cy='374' r='42' fill='#dc2626'/>
      <text x='158' y='384' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='20' font-weight='950' fill='#fff'>RED</text>
      <text x='118' y='464' font-family='Inter,Arial,sans-serif' font-size='31' font-weight='950' fill='#111827'>Keep manual</text>
      <text x='118' y='522' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='118' dy='0'>Use manual handling when the input is</tspan><tspan x='118' dy='23'>sensitive, the rule is unclear, the impact</tspan><tspan x='118' dy='23'>is external, or the owner cannot explain</tspan><tspan x='118' dy='23'>the decision path.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='451' y='302' width='318' height='338' rx='34' fill='#ffffff' stroke='#f59e0b' stroke-width='4'/>
      <circle cx='523' cy='374' r='42' fill='#f59e0b'/>
      <text x='523' y='384' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='20' font-weight='950' fill='#fff'>AMBER</text>
      <text x='483' y='464' font-family='Inter,Arial,sans-serif' font-size='31' font-weight='950' fill='#111827'>Human review first</text>
      <text x='483' y='522' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='483' dy='0'>Use assisted drafts only when a</tspan><tspan x='483' dy='23'>responsible reviewer can inspect the</tspan><tspan x='483' dy='23'>facts, approve the wording, and record</tspan><tspan x='483' dy='23'>unresolved questions.</tspan></text>
    </g>
    <g filter='url(#shadow)'>
      <rect x='816' y='302' width='318' height='338' rx='34' fill='#ffffff' stroke='#16a34a' stroke-width='4'/>
      <circle cx='888' cy='374' r='42' fill='#16a34a'/>
      <text x='888' y='384' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='20' font-weight='950' fill='#fff'>GREEN</text>
      <text x='848' y='464' font-family='Inter,Arial,sans-serif' font-size='31' font-weight='950' fill='#111827'>Automate carefully</text>
      <text x='848' y='522' font-family='Inter,Arial,sans-serif' font-size='18' fill='#334155'><tspan x='848' dy='0'>Automate only when the trigger, allowed</tspan><tspan x='848' dy='23'>data, owner, exception path, audit log,</tspan><tspan x='848' dy='23'>and rollback step are documented.</tspan></text>
    </g>
  <text x='76' y='712' font-family='Inter,Arial,sans-serif' font-size='23' font-weight='950' fill='#0f172a'>Five checks before changing the light to green</text>
  
      <g>
        <rect x='68' y='742' width='190' height='116' rx='24' fill='#f8fafc' stroke='#cbd5e1'/>
        <text x='163' y='783' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0f172a'>Trigger</text>
        <text x='84' y='816' font-family='Inter,Arial,sans-serif' font-size='12.4' fill='#475569'>What event starts the workflow, and can it be detected reliably?</text>
      </g>
      <g>
        <rect x='292' y='742' width='190' height='116' rx='24' fill='#f8fafc' stroke='#cbd5e1'/>
        <text x='387' y='783' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0f172a'>Data</text>
        <text x='308' y='816' font-family='Inter,Arial,sans-serif' font-size='12.4' fill='#475569'>Which fields are allowed, necessary, and safe to process?</text>
      </g>
      <g>
        <rect x='516' y='742' width='190' height='116' rx='24' fill='#f8fafc' stroke='#cbd5e1'/>
        <text x='611' y='783' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0f172a'>Owner</text>
        <text x='532' y='816' font-family='Inter,Arial,sans-serif' font-size='12.4' fill='#475569'>Who owns approval, exception handling, and rollback?</text>
      </g>
      <g>
        <rect x='740' y='742' width='190' height='116' rx='24' fill='#f8fafc' stroke='#cbd5e1'/>
        <text x='835' y='783' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0f172a'>Evidence</text>
        <text x='756' y='816' font-family='Inter,Arial,sans-serif' font-size='12.4' fill='#475569'>What log proves what happened and why?</text>
      </g>
      <g>
        <rect x='964' y='742' width='190' height='116' rx='24' fill='#f8fafc' stroke='#cbd5e1'/>
        <text x='1059' y='783' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='18' font-weight='950' fill='#0f172a'>Exit</text>
        <text x='980' y='816' font-family='Inter,Arial,sans-serif' font-size='12.4' fill='#475569'>How does a person pause or reverse the automation?</text>
      </g>
</svg>