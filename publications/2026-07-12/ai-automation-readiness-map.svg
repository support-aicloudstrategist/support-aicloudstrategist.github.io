<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='675' viewBox='0 0 1200 675'>
  <rect width='1200' height='675' fill='#f7fbff'/>
  <circle cx='1080' cy='80' r='150' fill='#dbeafe'/>
  <circle cx='90' cy='600' r='150' fill='#ccfbf1'/>
  <text x='58' y='58' font-family='Inter,Arial,sans-serif' font-size='20' font-weight='800' fill='#0f766e'>AICLOUDSTRATEGIST • EDUCATIONAL CHECKLIST</text>
  <text x='58' y='112' font-family='Inter,Arial,sans-serif' font-size='48' font-weight='900' fill='#0f172a'>AI Automation Readiness Map</text>
  <text x='58' y='152' font-family='Inter,Arial,sans-serif' font-size='24' fill='#334155'>7 green lights before a bot touches customers</text>
  <g font-family='Inter,Arial,sans-serif'>
    <rect x='58' y='200' width='310' height='130' rx='26' fill='#ffffff' stroke='#99f6e4' stroke-width='4'/>
    <text x='86' y='245' font-size='26' font-weight='900' fill='#0f766e'>1 Narrow use case</text>
    <text x='86' y='282' font-size='19' fill='#334155'>One workflow, one owner,</text><text x='86' y='310' font-size='19' fill='#334155'>one measurable handoff.</text>
    <rect x='445' y='200' width='310' height='130' rx='26' fill='#ffffff' stroke='#bfdbfe' stroke-width='4'/>
    <text x='473' y='245' font-size='26' font-weight='900' fill='#1d4ed8'>2 Data boundary</text>
    <text x='473' y='282' font-size='19' fill='#334155'>Approved sources only;</text><text x='473' y='310' font-size='19' fill='#334155'>visible read/write scope.</text>
    <rect x='832' y='200' width='310' height='130' rx='26' fill='#ffffff' stroke='#fde68a' stroke-width='4'/>
    <text x='860' y='245' font-size='26' font-weight='900' fill='#b45309'>3 Human review</text>
    <text x='860' y='282' font-size='19' fill='#334155'>Review pricing, legal,</text><text x='860' y='310' font-size='19' fill='#334155'>identity, deletion, impact.</text>
    <rect x='58' y='365' width='252' height='142' rx='24' fill='#ecfeff' stroke='#67e8f9' stroke-width='3'/>
    <text x='84' y='410' font-size='23' font-weight='900' fill='#0e7490'>4 Escalation</text>
    <text x='84' y='446' font-size='18' fill='#334155'>Uncertainty, complaints,</text><text x='84' y='473' font-size='18' fill='#334155'>security, VIPs → person.</text>
    <rect x='332' y='365' width='252' height='142' rx='24' fill='#f0fdf4' stroke='#86efac' stroke-width='3'/>
    <text x='358' y='410' font-size='23' font-weight='900' fill='#15803d'>5 Evidence log</text>
    <text x='358' y='446' font-size='18' fill='#334155'>Inputs, outputs, edits,</text><text x='358' y='473' font-size='18' fill='#334155'>approvals, exceptions.</text>
    <rect x='606' y='365' width='252' height='142' rx='24' fill='#fff7ed' stroke='#fdba74' stroke-width='3'/>
    <text x='632' y='410' font-size='23' font-weight='900' fill='#c2410c'>6 Safe failure</text>
    <text x='632' y='446' font-size='18' fill='#334155'>If unsure or offline,</text><text x='632' y='473' font-size='18' fill='#334155'>stop safely; do not guess.</text>
    <rect x='880' y='365' width='262' height='142' rx='24' fill='#f5f3ff' stroke='#c4b5fd' stroke-width='3'/>
    <text x='906' y='410' font-size='23' font-weight='900' fill='#6d28d9'>7 Owner review</text>
    <text x='906' y='446' font-size='18' fill='#334155'>Weekly quality, risk, cost,</text><text x='906' y='473' font-size='18' fill='#334155'>and next safe action.</text>
  </g>
  <rect x='58' y='560' width='1084' height='70' rx='24' fill='#0f172a'/>
  <text x='86' y='603' font-family='Inter,Arial,sans-serif' font-size='24' font-weight='800' fill='#ffffff'>Rule: do not automate the front door until the back office can explain what happened.</text>
  <text x='86' y='650' font-family='Inter,Arial,sans-serif' font-size='14' fill='#64748b'>Proof boundary: educational framework only; no client results, savings, certifications, rankings, or legal guarantees.</text>
</svg>
