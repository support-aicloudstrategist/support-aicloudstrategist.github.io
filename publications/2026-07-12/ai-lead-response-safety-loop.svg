417' r='22' fill='#ffbe4d'/><text x='297' y='425' text-anchor='middle' font-size='20' font-weight='900' fill='#102a43'>5</text><text x='345' y='457' text-anchor='middle' font-size='20' font-weight='900' fill='#102a43'>SLA timer started</text><foreignObject x='287' y='473' width='116' height='50'><div xmlns='http://www.w3.org/1999/xhtml' style='font:13px Arial;text-align:center;color:#334155;line-height:1.15'>Measure response ageing before adding more traffic or ad spend.</div></foreignObject></g><g><circle cx='345' cy='245' r='74' fill='white' stroke='#23c9a9' stroke-width='5'/><circle cx='297' cy='197' r='22' fill='#ffbe4d'/><text x='297' y='205' text-anchor='middle' font-size='20' font-weight='900' fill='#102a43'>6</text><text x='345' y='237' text-anchor='middle' font-size='20' font-weight='900' fill='#102a43'>Risk escalated</text><foreignObject x='287' y='253' width='116' height='50'><div xmlns='http://www.w3.org/1999/xhtml' style='font:13px Arial;text-align:center;color:#334155;line-height:1.15'>Route medical, legal, payment, identity, or angry-customer cases to humans.</div></foreignObject></g><g><circle cx='600' cy='360' r='74' fill='white' stroke='#23c9a9' stroke-width='5'/><circle cx='552' cy='312' r='22' fill='#ffbe4d'/><text x='552' y='320' text-anchor='middle' font-size='20' font-weight='900' fill='#102a43'>7</text><text x='600' y='352' text-anchor='middle' font-size='20' font-weight='900' fill='#102a43'>Evidence logged</text><foreignObject x='542' y='368' width='116' height='50'><div xmlns='http://www.w3.org/1999/xhtml' style='font:13px Arial;text-align:center;color:#334155;line-height:1.15'>Store timestamps, source, handoff, and outcome for weekly review.</div></foreignObject></g><rect x='92' y='608' width='1016' height='42' rx='21' fill='#102a43'/><text x='600' y='636' text-anchor='middle' font-size='17' font-weight='800' fill='white'>Demo educational framework • no client results or legal guarantees claimed</text></svg>