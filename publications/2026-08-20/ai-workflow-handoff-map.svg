<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='900' viewBox='0 0 1200 900'><rect width='1200' height='900' fill='#eef6ff'/><defs><filter id='shadow'><feDropShadow dx='0' dy='14' stdDeviation='12' flood-color='#0f172a' flood-opacity='.16'/></filter></defs><rect x='42' y='38' width='1116' height='824' rx='42' fill='white' stroke='#c7d2fe' stroke-width='3' filter='url(#shadow)'/><text x='82' y='100' font-size='24' font-weight='900' fill='#2563eb'>AICloudStrategist • safe educational infographic</text><foreignObject x='82' y='126' width='1030' height='110'><div xmlns='http://www.w3.org/1999/xhtml' style='font:900 46px Inter,Arial;color:#0f172a;line-height:1.05'>AI Workflow Handoff Map: 7 Places Automation Should Pause for a Human</div></foreignObject><foreignObject x='82' y='230' width='1000' height='75'><div xmlns='http://www.w3.org/1999/xhtml' style='font:22px Inter,Arial;color:#475569;line-height:1.32'>Good automation is not a straight line. The safest AI workflows know when to continue, when to ask for context, and when to hand off to a named human owner.</div></foreignObject><line x1='600' y1='485' x2='668' y2='244' stroke='#2563eb' stroke-width='5' stroke-linecap='round' opacity='.75'/><g><rect x='523' y='197' width='290' height='94' rx='18' fill='white' stroke='#2563eb' stroke-width='3'/><circle cx='557' cy='244' r='23' fill='#2563eb'/><text x='557' y='252' text-anchor='middle' font-size='21' font-weight='900' fill='white'>1</text><foreignObject x='592' y='216' width='195' height='60'><div xmlns='http://www.w3.org/1999/xhtml' style='font:700 18px Inter,Arial;color:#0f172a;line-height:1.15'>Unclear customer intent</div></foreignObject></g><line x1='600' y1='485' x2='938' y2='362' stroke='#06b6d4' stroke-width='5' stroke-linecap='round' opacity='.75'/><g><rect x='793' y='316' width='290' height='94' rx='18' fill='white' stroke='#06b6d4' stroke-width='3'/><circle cx='827' cy='362' r='23' fill='#06b6d4'/><text x='827' y='370' text-anchor='middle' font-size='21' font-weight='900' fill='white'>2</text><foreignObject x='862' y='334' width='195' height='60'><div xmlns='http://www.w3.org/1999/xhtml' style='font:700 18px Inter,Arial;color:#0f172a;line-height:1.15'>Missing identity context</div></foreignObject></g><line x1='600' y1='485' x2='966' y2='569' stroke='#16a34a' stroke-width='5' stroke-linecap='round' opacity='.75'/><g><rect x='821' y='522' width='290' height='94' rx='18' fill='white' stroke='#16a34a' stroke-width='3'/><circle cx='855' cy='569' r='23' fill='#16a34a'/><text x='855' y='577' text-anchor='middle' font-size='21' font-weight='900' fill='white'>3</text><foreignObject x='890' y='541' width='195' height='60'><div xmlns='http://www.w3.org/1999/xhtml' style='font:700 18px Inter,Arial;color:#0f172a;line-height:1.15'>Credential or OTP request</div></foreignObject></g><line x1='600' y1='485' x2='733' y2='715' stroke='#f59e0b' stroke-width='5' stroke-linecap='round' opacity='.75'/><g><rect x='588' y='668' width='290' height='94' rx='18' fill='white' stroke='#f59e0b' stroke-width='3'/><circle cx='622' cy='715' r='23' fill='#f59e0b'/><text x='622' y='723' text-anchor='middle' font-size='21' font-weight='900' fill='white'>4</text><foreignObject x='657' y='687' width='195' height='60'><div xmlns='http://www.w3.org/1999/xhtml' style='font:700 18px Inter,Arial;color:#0f172a;line-height:1.15'>Legal, medical, or tax risk</div></foreignObject></g><line x1='600' y1='485' x2='405' y2='697' stroke='#ef4444' stroke-width='5' stroke-linecap='round' opacity='.75'/><g><rect x='260' y='650' width='290' height='94' rx='18' fill='white' stroke='#ef4444' stroke-width='3'/><circle cx='294' cy='697' r='23' fill='#ef4444'/><text x='294' y='705' text-anchor='middle' font-size='21' font-weight='900' fill='white'>5</text><foreignObject x='329' y='669' width='195' height='60'><div xmlns='http://www.w3.org/1999/xhtml' style='font:700 18px Inter,Arial;color:#0f172a;line-height:1.15'>Price, refund, or contract ask</div></foreignObject></g><line x1='600' y1='485' x2='216' y2='528' stroke='#2563eb' stroke-width='5' stroke-linecap='round' opacity='.75'/><g><rect x='71' y='481' width='290' height='94' rx='18' fill='white' stroke='#2563eb' stroke-width='3'/><circle cx='105' cy='528' r='23' fill='#2563eb'/><text x='105' y='536' text-anchor='middle' font-size='21' font-weight='900' fill='white'>6</text><foreignObject x='140' y='500' width='195' height='60'><div xmlns='http://www.w3.org/1999/xhtml' style='font:700 18px Inter,Arial;color:#0f172a;line-height:1.15'>Sensitive personal data</div></foreignObject></g><line x1='600' y1='485' x2='301' y2='328' stroke='#06b6d4' stroke-width='5' stroke-linecap='round' opacity='.75'/><g><rect x='156' y='281' width='290' height='94' rx='18' fill='white' stroke='#06b6d4' stroke-width='3'/><circle cx='190' cy='328' r='23' fill='#06b6d4'/><text x='190' y='336' text-anchor='middle' font-size='21' font-weight='900' fill='white'>7</text><foreignObject x='225' y='300' width='195' height='60'><div xmlns='http://www.w3.org/1999/xhtml' style='font:700 18px Inter,Arial;color:#0f172a;line-height:1.15'>Angry, urgent, or high-stakes tone</div></foreignObject></g><g><circle cx='600' cy='485' r='112' fill='#0f172a'/><text x='600' y='462' text-anchor='middle' font-size='25' fill='white' font-weight='900'>HUMAN</text><text x='600' y='495' text-anchor='middle' font-size='25' fill='white' font-weight='900'>HANDOFF</text><text x='600' y='526' text-anchor='middle' font-size='16' fill='#bfdbfe'>pause • route • log</text></g><rect x='82' y='790' width='1036' height='44' rx='16' fill='#f8fafc' stroke='#e2e8f0'/><text x='105' y='818' font-size='17' fill='#475569'>Truth boundary: educational checklist only — no legal/compliance advice, fake clients, certifications, savings, or guaranteed outcomes.</text></svg>