<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='900' viewBox='0 0 1200 900'><defs><linearGradient id='hero' x1='0' x2='1'><stop stop-color='#0f766e'/><stop offset='1' stop-color='#7c3aed'/></linearGradient><filter id='shadow'><feDropShadow dx='0' dy='8' stdDeviation='8' flood-color='#0f172a' flood-opacity='.16'/></filter></defs><rect width='1200' height='900' fill='#eef2ff'/><rect x='34' y='34' width='1132' height='832' rx='44' fill='white' stroke='#c7d2fe' stroke-width='3' filter='url(#shadow)'/><rect x='62' y='60' width='1076' height='150' rx='34' fill='url(#hero)'/><text x='92' y='106' font-size='24' fill='#ccfbf1' font-weight='800'>Morning publication · vendor trust operations</text><foreignObject x='92' y='120' width='930' height='76'><div xmlns='http://www.w3.org/1999/xhtml' style='font:900 38px Arial;color:white;line-height:1.04'>SaaS Security Questionnaire Evidence Pack: 7 Red Flags Before AI Answers</div></foreignObject><rect x='990' y='92' width='110' height='86' rx='22' fill='rgba(255,255,255,.18)'/><text x='1045' y='128' text-anchor='middle' fill='white' font-size='31' font-weight='900'>7</text><text x='1045' y='157' text-anchor='middle' fill='#e0f2fe' font-size='17' font-weight='800'>red flags</text><text x='76' y='238' font-size='23' fill='#334155' font-weight='700'>Use this before AI drafts, rewrites, or submits security questionnaire answers.</text><g><rect x='70' y='245' width='470' height='118' rx='24' fill='#ffffff' stroke='#0f766e' stroke-width='3'/><circle cx='115' cy='288' r='27' fill='#0f766e'/><text x='115' y='298' text-anchor='middle' font-size='27' font-weight='900' fill='white'>1</text><text x='158' y='283' font-size='25' font-weight='900' fill='#111827'>Unclear source owner</text><foreignObject x='158' y='295' width='350' height='58'><div xmlns='http://www.w3.org/1999/xhtml' style='font:600 18px Arial;color:#334155;line-height:1.22'>No one can point to who approved the policy, control answer, or exception note.</div></foreignObject></g><g><rect x='600' y='245' width='470' height='118' rx='24' fill='#ffffff' stroke='#2563eb' stroke-width='3'/><circle cx='645' cy='288' r='27' fill='#2563eb'/><text x='645' y='298' text-anchor='middle' font-size='27' font-weight='900' fill='white'>2</text><text x='688' y='283' font-size='25' font-weight='900' fill='#111827'>Copied vendor language</text><foreignObject x='688' y='295' width='350' height='58'><div xmlns='http://www.w3.org/1999/xhtml' style='font:600 18px Arial;color:#334155;line-height:1.22'>The answer sounds polished but does not match your actual systems, process, or evidence.</div></foreignObject></g><g><rect x='70' y='390' width='470' height='118' rx='24' fill='#ffffff' stroke='#7c3aed' stroke-width='3'/><circle cx='115' cy='433' r='27' fill='#7c3aed'/><text x='115' y='443' text-anchor='middle' font-size='27' font-weight='900' fill='white'>3</text><text x='158' y='428' font-size='25' font-weight='900' fill='#111827'>Missing proof link</text><foreignObject x='158' y='440' width='350' height='58'><div xmlns='http://www.w3.org/1999/xhtml' style='font:600 18px Arial;color:#334155;line-height:1.22'>The answer says a process exists but no policy, ticket, screenshot, log, or owner note is attached.</div></foreignObject></g><g><rect x='600' y='390' width='470' height='118' rx='24' fill='#ffffff' stroke='#ea580c' stroke-width='3'/><circle cx='645' cy='433' r='27' fill='#ea580c'/><text x='645' y='443' text-anchor='middle' font-size='27' font-weight='900' fill='white'>4</text><text x='688' y='428' font-size='25' font-weight='900' fill='#111827'>Overstated coverage</text><foreignObject x='688' y='440' width='350' height='58'><div xmlns='http://www.w3.org/1999/xhtml' style='font:600 18px Arial;color:#334155;line-height:1.22'>Words like all, always, certified, guaranteed, or compliant appear without formal evidence.</div></foreignObject></g><g><rect x='70' y='535' width='470' height='118' rx='24' fill='#ffffff' stroke='#475569' stroke-width='3'/><circle cx='115' cy='578' r='27' fill='#475569'/><text x='115' y='588' text-anchor='middle' font-size='27' font-weight='900' fill='white'>5</text><text x='158' y='573' font-size='25' font-weight='900' fill='#111827'>Old control status</text><foreignObject x='158' y='585' width='350' height='58'><div xmlns='http://www.w3.org/1999/xhtml' style='font:600 18px Arial;color:#334155;line-height:1.22'>The answer was true last quarter but no one checked whether tools, vendors, or owners changed.</div></foreignObject></g><g><rect x='600' y='535' width='470' height='118' rx='24' fill='#ffffff' stroke='#059669' stroke-width='3'/><circle cx='645' cy='578' r='27' fill='#059669'/><text x='645' y='588' text-anchor='middle' font-size='27' font-weight='900' fill='white'>6</text><text x='688' y='573' font-size='25' font-weight='900' fill='#111827'>No exception route</text><foreignObject x='688' y='585' width='350' height='58'><div xmlns='http://www.w3.org/1999/xhtml' style='font:600 18px Arial;color:#334155;line-height:1.22'>The team has no safe way to answer partially met, not applicable, or planned controls.</div></foreignObject></g><g><rect x='330' y='680' width='470' height='118' rx='24' fill='#ffffff' stroke='#be123c' stroke-width='3'/><circle cx='375' cy='723' r='27' fill='#be123c'/><text x='375' y='733' text-anchor='middle' font-size='27' font-weight='900' fill='white'>7</text><text x='418' y='718' font-size='25' font-weight='900' fill='#111827'>Customer-risk blind spot</text><foreignObject x='418' y='730' width='350' height='58'><div xmlns='http://www.w3.org/1999/xhtml' style='font:600 18px Arial;color:#334155;line-height:1.22'>Sales speed is prioritized over accuracy, audit trail, or buyer trust.</div></foreignObject></g><rect x='70' y='800' width='1060' height='42' rx='20' fill='#f8fafc' stroke='#cbd5e1'/><text x='600' y='827' text-anchor='middle' font-size='18' fill='#475569' font-weight='800'>Educational guide only — not legal, compliance, security certification, approval, customer-result, or guaranteed-performance advice.</text></svg>