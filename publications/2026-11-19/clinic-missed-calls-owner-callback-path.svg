<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Clinic missed patient calls: callback ownership path</title><desc id="desc">Six-step synthetic no-PHI path: define window, separate call types, name queue owner, set callback status, check handoff, review before buying.</desc><rect width="1200" height="720" rx="32" fill="#f4f8fb"/><rect x="40" y="40" width="1120" height="128" rx="24" fill="#10243a"/><text x="82" y="91" fill="#bae6fd" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">AICLOUDSTRATEGIST · NO-PHI OWNER EDUCATION</text><text x="82" y="139" fill="white" font-family="Arial,sans-serif" font-size="38" font-weight="800">Clinic missing patient calls?</text><text x="82" y="198" fill="#10243a" font-family="Arial,sans-serif" font-size="25" font-weight="700">Turn a vague concern into an accountable callback queue</text><g font-family="Arial,sans-serif" font-size="21" font-weight="700"><g><rect x="70" y="245" width="320" height="120" rx="18" fill="#dff4ff" stroke="#4b9bc2" stroke-width="3"/><text x="94" y="282" fill="#075985">1 · DEFINE WINDOW</text><text x="94" y="320" fill="#10243a" font-size="18">Reconcile one shift/day</text><text x="94" y="345" fill="#10243a" font-size="18">with phone totals.</text></g><g><rect x="440" y="245" width="320" height="120" rx="18" fill="#e4f7ef" stroke="#38a169" stroke-width="3"/><text x="464" y="282" fill="#17653e">2 · SEPARATE TYPES</text><text x="464" y="320" fill="#10243a" font-size="18">Enquiry · referral · billing</text><text x="464" y="345" fill="#10243a" font-size="18">· existing-patient request.</text></g><g><rect x="810" y="245" width="320" height="120" rx="18" fill="#fff3d6" stroke="#d69e2e" stroke-width="3"/><text x="834" y="282" fill="#8a5a00">3 · NAME OWNER</text><text x="834" y="320" fill="#10243a" font-size="18">Role, backup and</text><text x="834" y="345" fill="#10243a" font-size="18">review time.</text></g><g><rect x="70" y="415" width="320" height="120" rx="18" fill="#eee6ff" stroke="#805ad5" stroke-width="3"/><text x="94" y="452" fill="#5b3aa3">4 · SET STATUS</text><text x="94" y="490" fill="#10243a" font-size="18">New · assigned · attempted</text><text x="94" y="515" fill="#10243a" font-size="18">· reached · closed.</text></g><g><rect x="440" y="415" width="320" height="120" rx="18" fill="#ffe5ed" stroke="#d53f8c" stroke-width="3"/><text x="464" y="452" fill="#9b235e">5 · CHECK HANDOFF</text><text x="464" y="490" fill="#10243a" font-size="18">No names, numbers,</text><text x="464" y="515" fill="#10243a" font-size="18">recordings or clinical data.</text></g><g><rect x="810" y="415" width="320" height="120" rx="18" fill="#d9f5f2" stroke="#159895" stroke-width="3"/><text x="834" y="452" fill="#08736f">6 · REVIEW OPTIONS</text><text x="834" y="490" fill="#10243a" font-size="18">Staffing, routing, CRM or</text><text x="834" y="515" fill="#10243a" font-size="18">AI receptionist after evidence.</text></g></g><rect x="70" y="590" width="1060" height="76" rx="16" fill="#081c30"/><text x="600" y="622" text-anchor="middle" fill="#e5f3ff" font-family="Arial,sans-serif" font-size="19" font-weight="700">SYNTHETIC / NO-PHI · NOT A PATIENT-GROWTH RESULT OR COMPLIANCE PROOF</text><text x="600" y="649" text-anchor="middle" fill="#bae6fd" font-family="Arial,sans-serif" font-size="16">Document the operating gap before selecting a tool.</text></svg>