<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Demo owner cloud spend dashboard for SMB cloud bill leakage review</title>
  <desc id="desc">Synthetic, no-credentials dashboard showing owner queues for cloud spend, AI API spikes, SaaS renewals, rollback gates and unsupported savings-claim stops.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.55" stop-color="#0f2745"/>
      <stop offset="1" stop-color="#123b33"/>
    </linearGradient>
    <style>
      .small{font:500 18px Inter,Segoe UI,Arial,sans-serif;fill:#cfe8f7}.tiny{font:600 14px Inter,Segoe UI,Arial,sans-serif;fill:#a8c8da}.label{font:800 14px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;fill:#69e6d4}.h1{font:900 38px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.h2{font:850 22px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.num{font:900 32px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.card{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.22);stroke-width:1.5}.warn{fill:#fbbf24}.ok{fill:#34d399}.danger{fill:#fb7185}.info{fill:#60a5fa}.line{stroke:rgba(255,255,255,.18);stroke-width:2}.pill{fill:rgba(105,230,212,.12);stroke:#69e6d4;stroke-width:1.4}.textdark{fill:#082032;font:800 14px Inter,Segoe UI,Arial,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="1050" cy="85" r="145" fill="#69e6d4" opacity=".08"/>
  <circle cx="110" cy="675" r="180" fill="#60a5fa" opacity=".08"/>

  <text x="56" y="64" class="label">DEMO / SYNTHETIC / NO CLOUD CREDENTIALS</text>
  <text x="56" y="112" class="h1">Owner cloud spend leakage dashboard</text>
  <text x="56" y="148" class="small">Founder-readable evidence before FinOps software, consultant spend, shutdowns or public savings claims.</text>

  <rect x="56" y="188" width="250" height="132" rx="24" class="card"/>
  <text x="82" y="228" class="label">Unowned spend</text>
  <text x="82" y="273" class="num">6 signals</text>
  <text x="82" y="300" class="tiny">Need owner + business purpose</text>

  <rect x="336" y="188" width="250" height="132" rx="24" class="card"/>
  <text x="362" y="228" class="label">AI/API spikes</text>
  <text x="362" y="273" class="num">Prompt-free</text>
  <text x="362" y="300" class="tiny">Usage bands only; no content</text>

  <rect x="616" y="188" width="250" height="132" rx="24" class="card"/>
  <text x="642" y="228" class="label">Renewal risk</text>
  <text x="642" y="273" class="num">Owner queue</text>
  <text x="642" y="300" class="tiny">Keep, downgrade, cancel, review</text>

  <rect x="896" y="188" width="248" height="132" rx="24" class="card"/>
  <text x="922" y="228" class="label">Claim gate</text>
  <text x="922" y="273" class="num">Blocked</text>
  <text x="922" y="300" class="tiny">No savings/ROI until measured</text>

  <rect x="56" y="360" width="1088" height="258" rx="28" class="card"/>
  <text x="88" y="405" class="h2">Owner action board</text>
  <line x1="88" y1="438" x2="1112" y2="438" class="line"/>
  <text x="88" y="470" class="label">Evidence signal</text><text x="360" y="470" class="label">Owner</text><text x="560" y="470" class="label">Gate</text><text x="820" y="470" class="label">Do not claim</text>
  <line x1="88" y1="490" x2="1112" y2="490" class="line"/>

  <circle cx="98" cy="527" r="8" class="warn"/><text x="118" y="533" class="small">Idle compute/database age band</text><text x="360" y="533" class="small">Technical lead</text><text x="560" y="533" class="small">Rollback approved</text><text x="820" y="533" class="small">Zero-risk shutdown</text>
  <circle cx="98" cy="571" r="8" class="info"/><text x="118" y="577" class="small">Model/API usage spike</text><text x="360" y="577" class="small">Product owner</text><text x="560" y="577" class="small">Budget guardrail</text><text x="820" y="577" class="small">AI accuracy or content proof</text>
  <circle cx="98" cy="615" r="8" class="danger"/><text x="118" y="621" class="small">SaaS renewal date near</text><text x="360" y="621" class="small">Department owner</text><text x="560" y="621" class="small">Usage evidence</text><text x="820" y="621" class="small">Guaranteed negotiation savings</text>

  <rect x="56" y="650" width="1088" height="58" rx="18" class="pill"/>
  <text x="84" y="686" class="small">Boundary: not a real customer dashboard, not cloud account data, not an invoice, not savings evidence, not security/privacy/compliance proof, and not legal/tax/accounting advice.</text>
</svg>
