<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Demo US healthcare patient-access comparison map</title>
<desc id="desc">Synthetic no-PHI decision map comparing AI receptionist, patient engagement, RCM prior authorization, GRC and FinOps options against AICS owner-evidence review.</desc>
<rect width="1200" height="720" fill="#07111f"/>
<text x="60" y="70" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700">US healthcare patient-access decision map</text>
<text x="60" y="108" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Demo-labelled, no-PHI owner-evidence lens before platform spend</text>
<g font-family="Arial, sans-serif" font-size="17">
<rect x="60" y="155" width="310" height="110" rx="18" fill="#0f766e"/><text x="85" y="195" fill="#ffffff" font-weight="700">AI receptionist</text><text x="85" y="226" fill="#ccfbf1">Missed calls + routing</text><text x="85" y="250" fill="#ccfbf1">Needs stop rules</text>
<rect x="445" y="155" width="310" height="110" rx="18" fill="#1d4ed8"/><text x="470" y="195" fill="#ffffff" font-weight="700">Patient engagement</text><text x="470" y="226" fill="#dbeafe">Reminders + recalls</text><text x="470" y="250" fill="#dbeafe">Needs consent source owner</text>
<rect x="830" y="155" width="310" height="110" rx="18" fill="#7c3aed"/><text x="855" y="195" fill="#ffffff" font-weight="700">RCM / prior-auth</text><text x="855" y="226" fill="#ede9fe">Eligibility + queue visibility</text><text x="855" y="250" fill="#ede9fe">Needs human review gate</text>
<rect x="250" y="365" width="310" height="110" rx="18" fill="#b45309"/><text x="275" y="405" fill="#ffffff" font-weight="700">GRC / trust centre</text><text x="275" y="436" fill="#ffedd5">Reusable answers</text><text x="275" y="460" fill="#ffedd5">Needs healthcare context</text>
<rect x="640" y="365" width="310" height="110" rx="18" fill="#be123c"/><text x="665" y="405" fill="#ffffff" font-weight="700">FinOps / cloud cost</text><text x="665" y="436" fill="#ffe4e6">Cloud + LLM cost gates</text><text x="665" y="460" fill="#ffe4e6">Needs workflow purpose</text>
<rect x="330" y="570" width="540" height="80" rx="20" fill="#e2e8f0"/><text x="380" y="612" fill="#0f172a" font-weight="700">AICS owner-evidence review</text><text x="380" y="638" fill="#334155">source owner · approval gate · rollback · claim boundary</text>
</g>
<g stroke="#94a3b8" stroke-width="3" fill="none" opacity=".85"><path d="M215 265 C300 340 430 500 520 570"/><path d="M600 265 V570"/><path d="M985 265 C900 340 770 500 680 570"/><path d="M405 475 C430 520 470 550 520 570"/><path d="M795 475 C770 520 730 550 680 570"/></g>
<text x="60" y="690" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">Boundary: synthetic readiness map only; no real patient, PHI/ePHI, client, compliance, revenue, savings, ROI or outcome proof.</text>
</svg>
