<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Demo B2B SaaS AI Control Evidence Risk Map</title>
  <desc id="desc">A synthetic visual map showing how AI feature, data boundary, vendor, human review, logs, change approval, sales claims and renewal review evidence move from question to owner-approved answer.</desc>
  <rect width="1200" height="675" fill="#07111f"/>
  <rect x="36" y="34" width="1128" height="607" rx="28" fill="#0d1b2f" stroke="#68d8ff" stroke-width="2"/>
  <text x="74" y="96" fill="#eaf6fb" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">B2B SaaS AI control evidence risk map</text>
  <text x="76" y="132" fill="#a8bdd2" font-family="Inter, Arial, sans-serif" font-size="18">Synthetic readiness visual — not SOC 2 evidence, audit evidence, certification, legal/security advice and not procurement approval.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="75" y="178" width="215" height="120" rx="18" fill="#123456" stroke="#68d8ff"/>
    <text x="100" y="218" fill="#ffffff" font-size="22" font-weight="700">Buyer asks</text>
    <text x="100" y="250" fill="#cfe8f3" font-size="16">AI use, data, vendors,</text>
    <text x="100" y="274" fill="#cfe8f3" font-size="16">SOC 2, trust centre</text>

    <rect x="355" y="178" width="215" height="120" rx="18" fill="#162842" stroke="#ffd166"/>
    <text x="380" y="218" fill="#ffffff" font-size="22" font-weight="700">Evidence map</text>
    <text x="380" y="250" fill="#cfe8f3" font-size="16">Feature, source, owner,</text>
    <text x="380" y="274" fill="#cfe8f3" font-size="16">review gate, expiry</text>

    <rect x="635" y="178" width="215" height="120" rx="18" fill="#16322a" stroke="#71f79f"/>
    <text x="660" y="218" fill="#ffffff" font-size="22" font-weight="700">Approved answer</text>
    <text x="660" y="250" fill="#cfe8f3" font-size="16">Owner-readable wording</text>
    <text x="660" y="274" fill="#cfe8f3" font-size="16">with unsafe claims blocked</text>

    <rect x="915" y="178" width="190" height="120" rx="18" fill="#341927" stroke="#ff7aa2"/>
    <text x="940" y="218" fill="#ffffff" font-size="22" font-weight="700">Do not claim</text>
    <text x="940" y="250" fill="#ffdbe6" font-size="16">certified, compliant,</text>
    <text x="940" y="274" fill="#ffdbe6" font-size="16">secure or approved</text>

    <path d="M300 238 H342" stroke="#68d8ff" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M580 238 H622" stroke="#ffd166" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M860 238 H902" stroke="#71f79f" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="76" y="365" fill="#eaf6fb" font-size="24" font-weight="700">Eight evidence checks before enterprise review</text>
    <g font-size="16" fill="#d8ecf5">
      <text x="92" y="410">1. AI feature inventory</text>
      <text x="92" y="444">2. Data category boundary</text>
      <text x="92" y="478">3. Vendor / model owner</text>
      <text x="92" y="512">4. Human review trigger</text>
      <text x="455" y="410">5. Access + change approval</text>
      <text x="455" y="444">6. Redacted evidence location</text>
      <text x="455" y="478">7. Unsupported claim stop</text>
      <text x="455" y="512">8. Renewal / material-change review</text>
    </g>
    <rect x="840" y="360" width="265" height="178" rx="20" fill="#0b1424" stroke="#68d8ff"/>
    <text x="870" y="405" fill="#ffffff" font-size="21" font-weight="700">AICS position</text>
    <text x="870" y="438" fill="#cfe8f3" font-size="16">Owner-evidence layer before</text>
    <text x="870" y="463" fill="#cfe8f3" font-size="16">questionnaire automation,</text>
    <text x="870" y="488" fill="#cfe8f3" font-size="16">GRC tools, auditors, counsel</text>
    <text x="870" y="513" fill="#cfe8f3" font-size="16">or trust-centre publishing.</text>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#68d8ff"/></marker></defs>
</svg>
