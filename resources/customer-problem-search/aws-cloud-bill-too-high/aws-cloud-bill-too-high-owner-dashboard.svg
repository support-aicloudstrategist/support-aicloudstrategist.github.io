<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AWS bill too high owner action dashboard</title><desc id="desc">Synthetic buyer-education dashboard showing evidence, owner and next move.</desc><rect width="1200" height="675" fill="#102a43"/><rect x="42" y="38" width="1116" height="599" rx="24" fill="#f6fbfc"/><text x="82" y="96" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#102a43">AWS BILL TOO HIGH · OWNER ACTION BOARD</text><text x="82" y="128" font-family="Arial,sans-serif" font-size="17" fill="#486581">DEMO / SYNTHETIC · no credentials · no production change · not a client result</text><g font-family="Arial,sans-serif"><rect x="82" y="172" width="300" height="145" rx="16" fill="#d9f0f2"/><text x="108" y="210" font-size="16" fill="#486581">WHAT CHANGED?</text><text x="108" y="252" font-size="31" font-weight="700" fill="#102a43">Service + account</text><text x="108" y="282" font-size="16" fill="#486581">Compare like periods first</text><rect x="450" y="172" width="300" height="145" rx="16" fill="#fff4d6"/><text x="476" y="210" font-size="16" fill="#486581">WHO OWNS IT?</text><text x="476" y="252" font-size="31" font-weight="700" fill="#102a43">Named owner</text><text x="476" y="282" font-size="16" fill="#486581">Assigned · shared · unallocated</text><rect x="818" y="172" width="300" height="145" rx="16" fill="#e6f4ea"/><text x="844" y="210" font-size="16" fill="#486581">NEXT MOVE</text><text x="844" y="252" font-size="31" font-weight="700" fill="#102a43">Act / hold</text><text x="844" y="282" font-size="16" fill="#486581">Evidence sets confidence</text><text x="82" y="382" font-size="20" font-weight="700" fill="#102a43">Decision register</text><line x1="82" y1="402" x2="1118" y2="402" stroke="#bcccdc"/><text x="82" y="444" font-size="18" fill="#102a43">Usage / price / transfer / storage / commitments / AI inference</text><text x="82" y="486" font-size="18" fill="#102a43">Owner: ____________________   Evidence due: __________</text><text x="82" y="528" font-size="18" fill="#102a43">Stop rule: no destructive action while owner or rollback path is unclear.</text><text x="82" y="590" font-size="16" fill="#d64545">NOT AWS ACCOUNT EVIDENCE · NOT SAVINGS, ROI, COMPLIANCE OR CERTIFICATION PROOF</text></g></svg>
