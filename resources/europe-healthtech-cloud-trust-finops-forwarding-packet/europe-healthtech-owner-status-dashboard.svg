<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Demo Europe healthtech owner status dashboard</title>
  <desc id="desc">Synthetic no-patient-data dashboard showing owner evidence status for healthtech cloud trust, AI FinOps, GDPR DPIA, security questionnaire, clinical human review and procurement route questions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#072033"/><stop offset="0.62" stop-color="#0f766e"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#020617" flood-opacity="0.22"/></filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="56" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Europe healthtech Cloud Trust + AI FinOps owner status</text>
  <text x="56" y="110" font-family="Inter, Arial, sans-serif" font-size="17" fill="#ccfbf1">Demo / synthetic / no patient data / no credentials / no compliance, savings, ranking or revenue claim</text>
  <g filter="url(#shadow)">
    <rect x="50" y="145" width="1100" height="540" rx="24" fill="#f8fafc"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="84" y="178" width="1032" height="54" rx="14" fill="#e0f2fe"/>
    <text x="104" y="213" font-size="18" font-weight="800" fill="#0f172a">Owner</text>
    <text x="310" y="213" font-size="18" font-weight="800" fill="#0f172a">Evidence queue</text>
    <text x="590" y="213" font-size="18" font-weight="800" fill="#0f172a">Status</text>
    <text x="790" y="213" font-size="18" font-weight="800" fill="#0f172a">Stop rule</text>

    <g font-size="16" fill="#334155">
      <rect x="84" y="252" width="1032" height="70" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="104" y="282" font-weight="800" fill="#0f172a">CFO / FinOps</text><text x="310" y="282">Cloud, AI, LLM and observability spend owners</text><text x="590" y="282" fill="#b45309" font-weight="800">Owner map pending</text><text x="790" y="282">No savings/ROI until baseline + result verified</text>
      <text x="310" y="306" font-size="13" fill="#64748b">Allowed: redacted category screenshots and tag gaps only</text>

      <rect x="84" y="336" width="1032" height="70" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="104" y="366" font-weight="800" fill="#0f172a">DPO / Privacy</text><text x="310" y="366">GDPR/DPIA, processor and data-residency questions</text><text x="590" y="366" fill="#0369a1" font-weight="800">Adviser review</text><text x="790" y="366">No legal/privacy conclusion by AICS</text>
      <text x="310" y="390" font-size="13" fill="#64748b">Allowed: approved policy links and redacted gap notes</text>

      <rect x="84" y="420" width="1032" height="70" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="104" y="450" font-weight="800" fill="#0f172a">CISO / Security</text><text x="310" y="450">Security-questionnaire evidence owner and expiry</text><text x="590" y="450" fill="#15803d" font-weight="800">Source named</text><text x="790" y="450">No ISO/SOC2/NHS DSPT compliance proof claim</text>
      <text x="310" y="474" font-size="13" fill="#64748b">Allowed: approved answer source and evidence link</text>

      <rect x="84" y="504" width="1032" height="70" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="104" y="534" font-weight="800" fill="#0f172a">Clinical / Ops</text><text x="310" y="534">AI human-review and patient communication boundary</text><text x="590" y="534" fill="#7c3aed" font-weight="800">Stop rule drafted</text><text x="790" y="534">No clinical safety or patient outcome claim</text>
      <text x="310" y="558" font-size="13" fill="#64748b">Allowed: redacted workflow step and escalation owner</text>

      <rect x="84" y="588" width="1032" height="70" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="104" y="618" font-weight="800" fill="#0f172a">Procurement</text><text x="310" y="618">Route decision: platform, adviser, GRC, FinOps or AICS</text><text x="590" y="618" fill="#b91c1c" font-weight="800">Decision due</text><text x="790" y="618">No vendor ranking or replacement claim</text>
      <text x="310" y="642" font-size="13" fill="#64748b">Allowed: missing evidence, decision owner and expiry date</text>
    </g>
  </g>
  <text x="56" y="724" font-family="Inter, Arial, sans-serif" font-size="14" fill="#dbeafe">AICloudStrategist proof asset — buyer-education dashboard only, not a customer case study or compliance artefact.</text>
</svg>
