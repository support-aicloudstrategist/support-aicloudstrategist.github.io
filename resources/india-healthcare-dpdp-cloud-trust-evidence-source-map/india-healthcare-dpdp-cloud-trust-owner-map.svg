<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Demo India healthcare DPDP cloud trust owner evidence map</title>
  <desc id="desc">Synthetic no-patient-data owner map for DPDP patient data inventory, consent source, ABDM/EMR handoff, processors, cloud boundary and claim approval.</desc>
  <rect width="1200" height="760" fill="#07111f"/>
  <text x="54" y="68" fill="#eaf6fb" font-family="Arial, sans-serif" font-size="34" font-weight="700">India Healthcare DPDP + Cloud Trust Evidence Source Map</text>
  <text x="54" y="104" fill="#93c5fd" font-family="Arial, sans-serif" font-size="18">Demo / synthetic only · no patient names · no reports · no WhatsApp exports · no credentials · no compliance proof</text>
  <g font-family="Arial, sans-serif">
    <rect x="54" y="142" width="330" height="120" rx="18" fill="#0f2747" stroke="#60a5fa"/>
    <text x="78" y="182" fill="#fff" font-size="22" font-weight="700">1. Patient data entry points</text>
    <text x="78" y="215" fill="#bfdbfe" font-size="16">Website, phone, WhatsApp, HIS/EMR, lab, PACS/RIS</text>
    <text x="78" y="242" fill="#fecaca" font-size="15">Redact identifiers before review</text>
    <rect x="434" y="142" width="330" height="120" rx="18" fill="#12351f" stroke="#34d399"/>
    <text x="458" y="182" fill="#fff" font-size="22" font-weight="700">2. Consent + notice source</text>
    <text x="458" y="215" fill="#bbf7d0" font-size="16">Channel, template owner, adviser question status</text>
    <text x="458" y="242" fill="#fecaca" font-size="15">Not legal/privacy advice</text>
    <rect x="814" y="142" width="330" height="120" rx="18" fill="#3b1d09" stroke="#f59e0b"/>
    <text x="838" y="182" fill="#fff" font-size="22" font-weight="700">3. ABDM / EMR / HIS handoff</text>
    <text x="838" y="215" fill="#fde68a" font-size="16">System owner + field names only</text>
    <text x="838" y="242" fill="#fecaca" font-size="15">No production login by default</text>
    <rect x="54" y="318" width="330" height="120" rx="18" fill="#271843" stroke="#a78bfa"/>
    <text x="78" y="358" fill="#fff" font-size="22" font-weight="700">4. Processor / vendor map</text>
    <text x="78" y="391" fill="#ddd6fe" font-size="16">Purpose, category, region, contract owner</text>
    <text x="78" y="418" fill="#fecaca" font-size="15">Adviser-owned unresolved risks</text>
    <rect x="434" y="318" width="330" height="120" rx="18" fill="#112b36" stroke="#22d3ee"/>
    <text x="458" y="358" fill="#fff" font-size="22" font-weight="700">5. Cloud + AI boundary</text>
    <text x="458" y="391" fill="#a5f3fc" font-size="16">Region, backup, logs, AI tool, spend owner</text>
    <text x="458" y="418" fill="#fecaca" font-size="15">No secrets, PHI, bills or keys</text>
    <rect x="814" y="318" width="330" height="120" rx="18" fill="#421828" stroke="#fb7185"/>
    <text x="838" y="358" fill="#fff" font-size="22" font-weight="700">6. Human-review stop rules</text>
    <text x="838" y="391" fill="#fecdd3" font-size="16">Clinical, emergency, complaint, insurance dispute</text>
    <text x="838" y="418" fill="#fecaca" font-size="15">Qualified owner before automation</text>
    <rect x="244" y="500" width="330" height="120" rx="18" fill="#172554" stroke="#818cf8"/>
    <text x="268" y="540" fill="#fff" font-size="22" font-weight="700">7. Breach / incident route</text>
    <text x="268" y="573" fill="#c7d2fe" font-size="16">Alert owner, escalation SLA, adviser question</text>
    <text x="268" y="600" fill="#fecaca" font-size="15">Actual incidents stop demo review</text>
    <rect x="624" y="500" width="330" height="120" rx="18" fill="#1f2937" stroke="#e5e7eb"/>
    <text x="648" y="540" fill="#fff" font-size="22" font-weight="700">8. Board claim approval gate</text>
    <text x="648" y="573" fill="#e5e7eb" font-size="16">No compliance, savings, ranking or ROI claims</text>
    <text x="648" y="600" fill="#fecaca" font-size="15">Publish only evidence-approved wording</text>
  </g>
  <text x="54" y="700" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="17">AICS role: source-to-owner evidence room before platform, automation, cloud, AI or adviser spend. This visual is a demo artifact, not a real client case study.</text>
</svg>
