<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Demo US specialty clinic referral and prior authorization owner dashboard</title>
  <desc id="desc">Synthetic dashboard showing referral leakage, prior authorization blockers, abandoned callbacks, HIPAA-aware AI boundaries and owner handoffs before any PHI, credentials or real payer data are shared.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="40" y="34" width="1120" height="110" rx="24" fill="#082f49"/>
  <text x="74" y="82" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">US Specialty Clinic Patient Access Owner Dashboard</text>
  <text x="74" y="120" font-family="Inter, Arial, sans-serif" font-size="18" fill="#bae6fd">Demo/synthetic — referral leakage, prior-auth blockers, abandoned calls and safe AI boundary review</text>
  <rect x="860" y="58" width="260" height="58" rx="16" fill="#0f766e"/>
  <text x="888" y="93" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">No PHI · no credentials</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="58" y="180" width="245" height="118" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="82" y="216" font-size="16" fill="#475569">Open referral rows</text>
    <text x="82" y="262" font-size="46" font-weight="800" fill="#0f172a">41</text>
    <text x="158" y="262" font-size="15" fill="#b45309">16 aged &gt; 3 days</text>

    <rect x="335" y="180" width="245" height="118" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="359" y="216" font-size="16" fill="#475569">Prior-auth blockers</text>
    <text x="359" y="262" font-size="46" font-weight="800" fill="#0f172a">23</text>
    <text x="435" y="262" font-size="15" fill="#b45309">payer/status unknown</text>

    <rect x="612" y="180" width="245" height="118" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="636" y="216" font-size="16" fill="#475569">Abandoned callbacks</text>
    <text x="636" y="262" font-size="46" font-weight="800" fill="#0f172a">18</text>
    <text x="712" y="262" font-size="15" fill="#b45309">script owner missing</text>

    <rect x="889" y="180" width="245" height="118" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="913" y="216" font-size="16" fill="#475569">Blocked unsafe claims</text>
    <text x="913" y="262" font-size="46" font-weight="800" fill="#dc2626">7</text>
    <text x="980" y="262" font-size="15" fill="#64748b">need proof/adviser</text>
  </g>

  <rect x="58" y="334" width="520" height="332" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="86" y="376" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Owner queue before automation</text>
  <g font-family="Inter, Arial, sans-serif" font-size="16">
    <rect x="86" y="402" width="456" height="38" rx="10" fill="#eff6ff"/><text x="104" y="427" fill="#1e3a8a">1. Referral source ageing by owner and missing document</text>
    <rect x="86" y="454" width="456" height="38" rx="10" fill="#ecfdf5"/><text x="104" y="479" fill="#065f46">2. Prior-auth status rows requiring human payer action</text>
    <rect x="86" y="506" width="456" height="38" rx="10" fill="#fff7ed"/><text x="104" y="531" fill="#9a3412">3. Eligibility / prep / patient callback blockers</text>
    <rect x="86" y="558" width="456" height="38" rx="10" fill="#fef2f2"/><text x="104" y="583" fill="#991b1b">4. AI receptionist stop: PHI, urgent, clinical or payer advice</text>
    <rect x="86" y="610" width="456" height="38" rx="10" fill="#f8fafc"/><text x="104" y="635" fill="#334155">5. Board-ready memo: fix, investigate, defer or stop</text>
  </g>

  <rect x="622" y="334" width="512" height="332" rx="24" fill="#07111f"/>
  <text x="654" y="376" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Top-3 consideration wedge</text>
  <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#dbeafe">
    <text x="654" y="420">Compared with patient engagement, AI receptionist, EHR/PMS,</text>
    <text x="654" y="446">call-center and RCM routes, AICS shows the evidence layer first:</text>
    <circle cx="666" cy="486" r="6" fill="#38bdf8"/><text x="684" y="492">redacted counts and screenshots only</text>
    <circle cx="666" cy="526" r="6" fill="#38bdf8"/><text x="684" y="532">human-review lanes for clinical/payer/HIPAA-risk rows</text>
    <circle cx="666" cy="566" r="6" fill="#38bdf8"/><text x="684" y="572">claim-boundary stops before public ROI, speed or compliance claims</text>
    <circle cx="666" cy="606" r="6" fill="#38bdf8"/><text x="684" y="612">30-day owner handoff before buying or replacing platforms</text>
  </g>
  <text x="654" y="646" font-family="Inter, Arial, sans-serif" font-size="13" fill="#94a3b8">Synthetic values for demonstration only; not a customer result or compliance proof.</text>
</svg>
