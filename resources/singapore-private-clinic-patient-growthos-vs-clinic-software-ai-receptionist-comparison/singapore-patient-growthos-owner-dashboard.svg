<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Demo Singapore Patient GrowthOS owner dashboard</title>
  <desc id="desc">Synthetic Singapore private clinic owner dashboard showing missed calls, WhatsApp appointment follow-up, recall queues, PDPA adviser questions, human review stops and no-credentials boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="1" stop-color="#12315b"/>
    </linearGradient>
    <style>
      .label{font:700 22px Arial,sans-serif;fill:#eaf6fb}.small{font:500 16px Arial,sans-serif;fill:#b9d7e8}.num{font:800 34px Arial,sans-serif;fill:#ffffff}.card{fill:#0f2038;stroke:#7cc8ff;stroke-opacity:.45;stroke-width:2}.warn{fill:#ffcf5a}.good{fill:#64e6ad}.stop{fill:#ff7f9b}.line{stroke:#7cc8ff;stroke-width:3;stroke-opacity:.55}.tag{font:700 14px Arial,sans-serif;fill:#06111f}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="52" y="68" class="label">AICloudStrategist · Demo Singapore Patient GrowthOS Dashboard</text>
  <text x="52" y="102" class="small">Synthetic visual only · no patient data, no clinic data, no call recordings, no WhatsApp exports, no PDPA compliance claim</text>
  <g transform="translate(52 142)">
    <rect class="card" width="246" height="126" rx="18"/><text x="24" y="42" class="small">Missed-call queue</text><text x="24" y="86" class="num">37</text><circle cx="205" cy="74" r="18" class="warn"/><text x="190" y="79" class="tag">SLA</text>
    <rect class="card" x="278" width="246" height="126" rx="18"/><text x="302" y="42" class="small">WhatsApp follow-up gaps</text><text x="302" y="86" class="num">22</text><circle cx="485" cy="74" r="18" class="warn"/><text x="472" y="79" class="tag">OWN</text>
    <rect class="card" x="556" width="246" height="126" rx="18"/><text x="580" y="42" class="small">Recall / review queue</text><text x="580" y="86" class="num">14</text><circle cx="764" cy="74" r="18" class="good"/><text x="752" y="79" class="tag">MAP</text>
    <rect class="card" x="834" width="246" height="126" rx="18"/><text x="858" y="42" class="small">Human-review stops</text><text x="858" y="86" class="num">9</text><circle cx="1043" cy="74" r="18" class="stop"/><text x="1031" y="79" class="tag">STOP</text>
  </g>
  <g transform="translate(52 318)">
    <rect class="card" width="1096" height="300" rx="22"/>
    <text x="28" y="44" class="label">Proof-before-platform owner lanes</text>
    <line x1="80" y1="88" x2="1015" y2="88" class="line"/>
    <line x1="80" y1="160" x2="1015" y2="160" class="line"/>
    <line x1="80" y1="232" x2="1015" y2="232" class="line"/>
    <g class="small">
      <text x="28" y="96">Source</text><text x="235" y="96">Owner</text><text x="440" y="96">Evidence needed</text><text x="700" y="96">PDPA question</text><text x="910" y="96">Next action</text>
      <text x="28" y="142">Google/website call</text><text x="235" y="142">Front desk lead</text><text x="440" y="142">Redacted call count</text><text x="700" y="142">Consent/retention?</text><text x="910" y="142">Callback queue</text>
      <text x="28" y="214">WhatsApp request</text><text x="235" y="214">Ops manager</text><text x="440" y="214">Thread labels only</text><text x="700" y="214">Purpose/use?</text><text x="910" y="214">Owner handoff</text>
      <text x="28" y="286">AI receptionist idea</text><text x="235" y="286">Clinic owner</text><text x="440" y="286">Safe scripts</text><text x="700" y="286">Adviser review?</text><text x="910" y="286">Human stop</text>
    </g>
  </g>
  <g transform="translate(52 660)">
    <rect x="0" y="0" width="1096" height="56" rx="16" fill="#eaf6fb" opacity=".96"/>
    <text x="24" y="35" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#06111f">AICS readiness wedge: inspect leakage and owner handoff before sharing credentials or buying clinic software, WhatsApp CRM or AI receptionist tools.</text>
  </g>
</svg>
