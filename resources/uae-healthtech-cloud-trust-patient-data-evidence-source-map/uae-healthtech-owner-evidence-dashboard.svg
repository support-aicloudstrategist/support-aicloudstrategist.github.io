<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Demo UAE healthtech owner evidence dashboard</title>
  <desc id="desc">Demo-labelled no-patient-data dashboard showing UAE healthtech cloud trust, patient data boundaries, AI spend approvals, access exceptions, backup restore evidence and questionnaire owners.</desc>
  <rect width="1200" height="760" fill="#06111f"/>
  <rect x="36" y="36" width="1128" height="688" rx="30" fill="#f8fbff"/>
  <text x="72" y="92" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#082f49">UAE Healthtech Cloud Trust + Patient GrowthOS Evidence Dashboard</text>
  <text x="72" y="124" font-family="Arial, sans-serif" font-size="15" fill="#475569">DEMO / SYNTHETIC · no patient data · no credentials · no production export · no compliance or savings claim</text>

  <g transform="translate(72 158)">
    <rect width="250" height="134" rx="18" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="22" y="36" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#075985">Patient-data boundary</text>
    <text x="22" y="68" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">6 lanes</text>
    <text x="22" y="98" font-family="Arial, sans-serif" font-size="14" fill="#334155">appointment, contact, report,</text>
    <text x="22" y="118" font-family="Arial, sans-serif" font-size="14" fill="#334155">payment, message, AI prompt</text>
  </g>
  <g transform="translate(350 158)">
    <rect width="250" height="134" rx="18" fill="#ecfdf5" stroke="#86efac"/>
    <text x="22" y="36" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#047857">AI/cloud spend owners</text>
    <text x="22" y="68" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">5 sources</text>
    <text x="22" y="98" font-family="Arial, sans-serif" font-size="14" fill="#334155">hosting, storage, observability,</text>
    <text x="22" y="118" font-family="Arial, sans-serif" font-size="14" fill="#334155">messaging, LLM/API</text>
  </g>
  <g transform="translate(628 158)">
    <rect width="250" height="134" rx="18" fill="#fff7ed" stroke="#fdba74"/>
    <text x="22" y="36" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9a3412">Human-review stops</text>
    <text x="22" y="68" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">9 triggers</text>
    <text x="22" y="98" font-family="Arial, sans-serif" font-size="14" fill="#334155">urgent symptoms, complaints,</text>
    <text x="22" y="118" font-family="Arial, sans-serif" font-size="14" fill="#334155">clinical, consent, payment</text>
  </g>
  <g transform="translate(906 158)">
    <rect width="206" height="134" rx="18" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="18" y="36" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b">No-go evidence</text>
    <text x="18" y="68" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">0 real</text>
    <text x="18" y="98" font-family="Arial, sans-serif" font-size="14" fill="#334155">no patient records, tokens,</text>
    <text x="18" y="118" font-family="Arial, sans-serif" font-size="14" fill="#334155">regulator letters or bills</text>
  </g>

  <g transform="translate(72 330)">
    <rect width="1040" height="250" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="24" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Owner evidence lanes before platform / automation spend</text>
    <line x1="24" y1="64" x2="1016" y2="64" stroke="#cbd5e1"/>
    <text x="24" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#475569">Lane</text>
    <text x="220" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#475569">Safe input</text>
    <text x="520" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#475569">Accountable owner</text>
    <text x="760" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#475569">Stop / escalate if</text>
    <g font-family="Arial, sans-serif" font-size="13" fill="#0f172a">
      <text x="24" y="126">Patient workflow</text><text x="220" y="126">Redacted source, status, handoff</text><text x="520" y="126">Clinical ops / patient access</text><text x="760" y="126">medical advice or no owner</text>
      <text x="24" y="160">Cloud + AI spend</text><text x="220" y="160">Monthly totals, thresholds</text><text x="520" y="160">Finance / CTO</text><text x="760" y="160">no approval path or live access needed</text>
      <text x="24" y="194">Access review</text><text x="220" y="194">Role names, counts, review date</text><text x="520" y="194">Security / IT</text><text x="760" y="194">privileged access unknown</text>
      <text x="24" y="228">Questionnaire</text><text x="220" y="228">Question, source, answer status</text><text x="520" y="228">CTO / privacy / legal / security</text><text x="760" y="228">formal adviser approval required</text>
    </g>
  </g>

  <g transform="translate(72 616)">
    <rect width="1040" height="64" rx="16" fill="#082f49"/>
    <text x="24" y="26" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">AICS top-3/top-5 wedge</text>
    <text x="24" y="48" font-family="Arial, sans-serif" font-size="14" fill="#bae6fd">Evidence-map and owner-handoff layer beside Okadoc/booking, WhatsApp automation, EHR/HIS, cloud providers, FinOps, GRC, MSP and adviser routes.</text>
  </g>
</svg>
