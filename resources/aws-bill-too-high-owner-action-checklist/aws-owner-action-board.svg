<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Demo AWS owner action board</title>
  <desc id="desc">Synthetic AWS bill owner action board showing owner evidence, safe action gates, rollback checks and claim boundaries.</desc>
  <rect width="1200" height="720" fill="#06111f"/>
  <text x="70" y="78" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="700">AWS bill too high: owner action board</text>
  <text x="70" y="118" fill="#b7d7ff" font-family="Inter,Arial,sans-serif" font-size="21">Demo-labelled · no credentials · no account IDs · no savings claims</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="70" y="165" width="245" height="405" rx="24" fill="#10243d" stroke="#2b6cb0"/>
    <text x="96" y="212" fill="#93c5fd" font-size="18" font-weight="700">1 · Cost signal</text>
    <text x="96" y="252" fill="#fff" font-size="25" font-weight="700">What changed?</text>
    <text x="96" y="294" fill="#dbeafe" font-size="18">• Service-family total</text>
    <text x="96" y="326" fill="#dbeafe" font-size="18">• Masked screenshot</text>
    <text x="96" y="358" fill="#dbeafe" font-size="18">• Business event</text>
    <text x="96" y="390" fill="#dbeafe" font-size="18">• AI/API spike</text>
    <text x="96" y="456" fill="#fef3c7" font-size="17">Do not request keys, ARNs,</text>
    <text x="96" y="482" fill="#fef3c7" font-size="17">logs or customer data first.</text>
    <rect x="360" y="165" width="245" height="405" rx="24" fill="#0f2d2f" stroke="#14b8a6"/>
    <text x="386" y="212" fill="#5eead4" font-size="18" font-weight="700">2 · Owner gate</text>
    <text x="386" y="252" fill="#fff" font-size="25" font-weight="700">Who approves?</text>
    <text x="386" y="294" fill="#ccfbf1" font-size="18">• Product owner</text>
    <text x="386" y="326" fill="#ccfbf1" font-size="18">• Finance owner</text>
    <text x="386" y="358" fill="#ccfbf1" font-size="18">• Platform owner</text>
    <text x="386" y="390" fill="#ccfbf1" font-size="18">• Security/retention</text>
    <text x="386" y="456" fill="#fef3c7" font-size="17">No shutdown, reservation or</text>
    <text x="386" y="482" fill="#fef3c7" font-size="17">deletion without ownership.</text>
    <rect x="650" y="165" width="245" height="405" rx="24" fill="#2a1745" stroke="#a855f7"/>
    <text x="676" y="212" fill="#d8b4fe" font-size="18" font-weight="700">3 · Safe action</text>
    <text x="676" y="252" fill="#fff" font-size="25" font-weight="700">What is reversible?</text>
    <text x="676" y="294" fill="#ede9fe" font-size="18">• Tag/owner cleanup</text>
    <text x="676" y="326" fill="#ede9fe" font-size="18">• Budget alert review</text>
    <text x="676" y="358" fill="#ede9fe" font-size="18">• Rightsize candidate</text>
    <text x="676" y="390" fill="#ede9fe" font-size="18">• Adviser-only item</text>
    <text x="676" y="456" fill="#fef3c7" font-size="17">Rollback owner and impact</text>
    <text x="676" y="482" fill="#fef3c7" font-size="17">window before live change.</text>
    <rect x="940" y="165" width="190" height="405" rx="24" fill="#3b1518" stroke="#fb7185"/>
    <text x="966" y="212" fill="#fda4af" font-size="18" font-weight="700">4 · Claim stop</text>
    <text x="966" y="252" fill="#fff" font-size="25" font-weight="700">Prove later</text>
    <text x="966" y="294" fill="#ffe4e6" font-size="18">• Baseline</text>
    <text x="966" y="326" fill="#ffe4e6" font-size="18">• Action date</text>
    <text x="966" y="358" fill="#ffe4e6" font-size="18">• Post bill</text>
    <text x="966" y="390" fill="#ffe4e6" font-size="18">• Finance review</text>
    <text x="966" y="456" fill="#fef3c7" font-size="17">No savings, ROI</text>
    <text x="966" y="482" fill="#fef3c7" font-size="17">or revenue claim.</text>
  </g>
  <path d="M318 365h36M608 365h36M898 365h36" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <text x="70" y="638" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="20">Use this visual as a safe first conversation artifact before AWS access, production changes, MSP escalation or FinOps platform spend.</text>
</svg>
