<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Australia NDIS intake owner dashboard demo</title>
  <desc id="desc">Synthetic no-participant-data dashboard example for missed-call, referral, consent, capacity and risk-escalation owner review. No real NDIS provider, participant, revenue, compliance or outcome proof.</desc>
  <rect width="1200" height="720" fill="#f4f8fb"/>
  <rect x="60" y="50" width="1080" height="620" rx="32" fill="#05111f"/>
  <text x="100" y="115" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">NDIS intake owner dashboard</text>
  <text x="100" y="152" fill="#9fd7ef" font-family="Arial, sans-serif" font-size="18">DEMO / SYNTHETIC ONLY · no participant data · no provider outcome proof</text>
  <g font-family="Arial, sans-serif">
    <rect x="100" y="205" width="225" height="130" rx="18" fill="#12324a"/>
    <text x="125" y="247" fill="#9fd7ef" font-size="16">New enquiries</text>
    <text x="125" y="292" fill="#ffffff" font-size="44" font-weight="700">42</text>
    <text x="125" y="317" fill="#cfe7f3" font-size="15">aggregate sample count</text>
    <rect x="355" y="205" width="225" height="130" rx="18" fill="#12324a"/>
    <text x="380" y="247" fill="#9fd7ef" font-size="16">Missed-call queue</text>
    <text x="380" y="292" fill="#ffffff" font-size="44" font-weight="700">9</text>
    <text x="380" y="317" fill="#cfe7f3" font-size="15">owner + due date needed</text>
    <rect x="610" y="205" width="225" height="130" rx="18" fill="#12324a"/>
    <text x="635" y="247" fill="#9fd7ef" font-size="16">Capacity blockers</text>
    <text x="635" y="292" fill="#ffffff" font-size="44" font-weight="700">7</text>
    <text x="635" y="317" fill="#cfe7f3" font-size="15">roster/service-fit review</text>
    <rect x="865" y="205" width="225" height="130" rx="18" fill="#3a1f2c"/>
    <text x="890" y="247" fill="#ffd1dc" font-size="16">Human escalation</text>
    <text x="890" y="292" fill="#ffffff" font-size="44" font-weight="700">3</text>
    <text x="890" y="317" fill="#f6d6df" font-size="15">not for automation</text>
    <rect x="100" y="385" width="475" height="195" rx="20" fill="#ffffff"/>
    <text x="130" y="430" fill="#05111f" font-size="22" font-weight="700">Owner review lanes</text>
    <text x="130" y="470" fill="#203344" font-size="17">1 · Source captured</text>
    <text x="130" y="505" fill="#203344" font-size="17">2 · Consent preference recorded</text>
    <text x="130" y="540" fill="#203344" font-size="17">3 · Capacity checked before promise</text>
    <rect x="625" y="385" width="465" height="195" rx="20" fill="#ffffff"/>
    <text x="655" y="430" fill="#05111f" font-size="22" font-weight="700">Unsafe claims excluded</text>
    <text x="655" y="470" fill="#203344" font-size="17">No NDIS compliance conclusion</text>
    <text x="655" y="505" fill="#203344" font-size="17">No participant outcome or care advice</text>
    <text x="655" y="540" fill="#203344" font-size="17">No revenue, ROI, ranking or customer proof</text>
    <text x="100" y="628" fill="#9fd7ef" font-size="16">AICloudStrategist · buyer-safe intake leakage evidence example</text>
  </g>
</svg>
