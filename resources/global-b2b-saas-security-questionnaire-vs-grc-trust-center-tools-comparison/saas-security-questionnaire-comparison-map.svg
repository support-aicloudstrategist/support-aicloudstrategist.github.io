    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#001024" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
