    <text x="362" y="414" fill="#0f766e" font-size="17" font-weight="700" font-family="Inter,Arial,sans-serif">Best when content is</text>
    <text x="362" y="438" fill="#0f766e" font-size="17" font-weight="700" font-family="Inter,Arial,sans-serif">current and safe</text>
