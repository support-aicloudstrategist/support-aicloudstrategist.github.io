  <path d="M302 333H336" stroke="#93e4f4" stroke-width="5" stroke-linecap="round"/>
  <path d="M576 333H610" stroke="#93e4f4" stroke-width="5" stroke-linecap="round"/>
  <path d="M850 333H884" stroke="#93e4f4" stroke-width="5" stroke-linecap="round"/>

  <rect x="62" y="520" width="1076" height="54" rx="18" fill="#001826" opacity="0.72"/>
  <text x="88" y="555" fill="#e2f9ff" font-size="19" font-family="Inter,Arial,sans-serif">Boundary: no real customer, security, CRM, contract, revenue, compliance or ranking proof. Buyer education only; no outreach sent.</text>
