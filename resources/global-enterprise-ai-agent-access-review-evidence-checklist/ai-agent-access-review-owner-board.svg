<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic AI agent access review owner board</title>
  <desc id="desc">Demo board showing owner, permission, retrieval, human review, monitoring and revocation evidence gates for AI agent access review. No real customer, credentials or production data.</desc>
  <rect width="1200" height="720" fill="#06111f"/>
  <circle cx="1040" cy="120" r="220" fill="#0ea5e9" opacity="0.12"/>
  <circle cx="170" cy="650" r="260" fill="#22c55e" opacity="0.08"/>
  <text x="60" y="78" fill="#eaf6fb" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">AI agent access review owner board</text>
  <text x="60" y="112" fill="#9fb3c8" font-family="Inter,Arial,sans-serif" font-size="17">Synthetic evidence view for approval, monitoring and revocation — no credentials, logs, customer data or production exports.</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="60" y="154" width="1080" height="72" rx="18" fill="#0f1f33" stroke="#24415f"/>
    <text x="88" y="185" fill="#38bdf8" font-size="16" font-weight="700">Review object</text>
    <text x="88" y="211" fill="#eaf6fb" font-size="22" font-weight="800">Customer-support triage agent · draft-only before send</text>
    <text x="730" y="185" fill="#38bdf8" font-size="16" font-weight="700">Decision state</text>
    <text x="730" y="211" fill="#facc15" font-size="22" font-weight="800">Narrow access until owner evidence is complete</text>

    <g transform="translate(60 260)">
      <rect width="250" height="152" rx="18" fill="#10243a" stroke="#2f4f6f"/>
      <text x="22" y="34" fill="#93c5fd" font-size="15" font-weight="700">1 · Business owner</text>
      <text x="22" y="68" fill="#eaf6fb" font-size="20" font-weight="800">Named accountable owner</text>
      <text x="22" y="102" fill="#bac8d6" font-size="15">Purpose, channel and exception owner recorded before expanded permissions.</text>
    </g>
    <g transform="translate(335 260)">
      <rect width="250" height="152" rx="18" fill="#10243a" stroke="#2f4f6f"/>
      <text x="22" y="34" fill="#93c5fd" font-size="15" font-weight="700">2 · Tool permission</text>
      <text x="22" y="68" fill="#eaf6fb" font-size="20" font-weight="800">Read / draft / send split</text>
      <text x="22" y="102" fill="#bac8d6" font-size="15">Write, payment, delete and external-send actions require separate approval.</text>
    </g>
    <g transform="translate(610 260)">
      <rect width="250" height="152" rx="18" fill="#10243a" stroke="#2f4f6f"/>
      <text x="22" y="34" fill="#93c5fd" font-size="15" font-weight="700">3 · Retrieval boundary</text>
      <text x="22" y="68" fill="#eaf6fb" font-size="20" font-weight="800">Source owner + data class</text>
      <text x="22" y="102" fill="#bac8d6" font-size="15">Knowledge bases, files and CRM fields mapped to audience and redaction rules.</text>
    </g>
    <g transform="translate(885 260)">
      <rect width="255" height="152" rx="18" fill="#10243a" stroke="#2f4f6f"/>
      <text x="22" y="34" fill="#93c5fd" font-size="15" font-weight="700">4 · Human review</text>
      <text x="22" y="68" fill="#eaf6fb" font-size="20" font-weight="800">Escalate before impact</text>
      <text x="22" y="102" fill="#bac8d6" font-size="15">Customers, money, policy, credentials or regulated data trigger human gate.</text>
    </g>

    <g transform="translate(60 452)">
      <rect width="525" height="142" rx="18" fill="#0b1b2d" stroke="#2f4f6f"/>
      <text x="24" y="38" fill="#34d399" font-size="17" font-weight="800">Monitoring evidence needed</text>
      <text x="24" y="72" fill="#eaf6fb" font-size="18">Approval ticket · prompt/tool version · action logs · sampled output review · incident route</text>
      <text x="24" y="108" fill="#9fb3c8" font-size="15">AICS maps owner evidence; it does not certify security, compliance or production readiness.</text>
    </g>
    <g transform="translate(615 452)">
      <rect width="525" height="142" rx="18" fill="#0b1b2d" stroke="#2f4f6f"/>
      <text x="24" y="38" fill="#f87171" font-size="17" font-weight="800">Revocation triggers</text>
      <text x="24" y="72" fill="#eaf6fb" font-size="18">Owner change · source sensitivity change · unsafe output · credential rotation · vendor exit</text>
      <text x="24" y="108" fill="#9fb3c8" font-size="15">No claim of risk reduction, compliance, savings, revenue, ranking or customer outcome.</text>
    </g>
  </g>
  <text x="60" y="666" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14">AICloudStrategist synthetic demo asset · replace with redacted authorised facts before any real review.</text>
</svg>
