<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Demo diagnostic lab report follow-up owner board</title>
<desc id="desc">Synthetic dashboard showing report-status, sample-collection, WhatsApp boundary, LIS handoff, DPDP prompts and owner review lanes with no patient data.</desc>
<rect width="1200" height="675" fill="#06111f"/>
<text x="60" y="70" fill="#eaf6fb" font-family="Arial, sans-serif" font-size="34" font-weight="700">Diagnostic Lab Report Follow-Up: Owner Evidence Board</text>
<text x="60" y="108" fill="#9fd7ef" font-family="Arial, sans-serif" font-size="18">Demo only · no patient data · no report values · no LIS/WhatsApp export · human review for risky cases</text>
<g font-family="Arial, sans-serif">
<rect x="60" y="150" width="330" height="170" rx="22" fill="#0f2742" stroke="#41c5ff"/>
<text x="90" y="195" fill="#ffffff" font-size="24" font-weight="700">1. Report status</text>
<text x="90" y="232" fill="#d2f1ff" font-size="18">Age by promised TAT band</text>
<text x="90" y="265" fill="#d2f1ff" font-size="18">Owner + next update</text>
<text x="90" y="298" fill="#ffc857" font-size="16">No report values exposed</text>
<rect x="435" y="150" width="330" height="170" rx="22" fill="#102b21" stroke="#5ee6a7"/>
<text x="465" y="195" fill="#ffffff" font-size="24" font-weight="700">2. Sample callbacks</text>
<text x="465" y="232" fill="#dfffee" font-size="18">Home collection requests</text>
<text x="465" y="265" fill="#dfffee" font-size="18">Reschedule + blocker queue</text>
<text x="465" y="298" fill="#ffc857" font-size="16">Escalate complaints</text>
<rect x="810" y="150" width="330" height="170" rx="22" fill="#321c3f" stroke="#c486ff"/>
<text x="840" y="195" fill="#ffffff" font-size="24" font-weight="700">3. WhatsApp boundary</text>
<text x="840" y="232" fill="#f0ddff" font-size="18">Safe status reply categories</text>
<text x="840" y="265" fill="#f0ddff" font-size="18">Identity + consent stop rules</text>
<text x="840" y="298" fill="#ffc857" font-size="16">No diagnosis automation</text>
<rect x="60" y="365" width="330" height="170" rx="22" fill="#392612" stroke="#ffb457"/>
<text x="90" y="410" fill="#ffffff" font-size="24" font-weight="700">4. LIS / CRM handoff</text>
<text x="90" y="447" fill="#fff1dd" font-size="18">Report-ready → reception</text>
<text x="90" y="480" fill="#fff1dd" font-size="18">Payment/retest/doctor review</text>
<text x="90" y="513" fill="#ffc857" font-size="16">Map before integrating</text>
<rect x="435" y="365" width="330" height="170" rx="22" fill="#173138" stroke="#56e3e3"/>
<text x="465" y="410" fill="#ffffff" font-size="24" font-weight="700">5. DPDP prompts</text>
<text x="465" y="447" fill="#dafbff" font-size="18">Purpose, notice, vendor</text>
<text x="465" y="480" fill="#dafbff" font-size="18">Access + retention evidence</text>
<text x="465" y="513" fill="#ffc857" font-size="16">Adviser review required</text>
<rect x="810" y="365" width="330" height="170" rx="22" fill="#122b4d" stroke="#7db7ff"/>
<text x="840" y="410" fill="#ffffff" font-size="24" font-weight="700">6. Weekly owner view</text>
<text x="840" y="447" fill="#e2f0ff" font-size="18">Ageing queues + owners</text>
<text x="840" y="480" fill="#e2f0ff" font-size="18">Human-review load</text>
<text x="840" y="513" fill="#ffc857" font-size="16">Readiness, not outcome proof</text>
<text x="60" y="615" fill="#9fd7ef" font-size="18">AICloudStrategist · synthetic/readiness asset · no compliance, revenue, turnaround or medical-result claim</text>
</g>
</svg>
