<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Demo healthcare AI trust controls owner map</title>
  <desc id="desc">Synthetic no-patient-data visual map for healthcare AI trust controls before AI receptionist, patient engagement or automation spend.</desc>
  <rect width="1200" height="760" fill="#08111f"/>
  <rect x="48" y="42" width="1104" height="676" rx="32" fill="#101d33" stroke="#7dd3fc" stroke-width="3"/>
  <text x="90" y="110" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="38" font-weight="700">Healthcare AI trust controls: owner evidence map</text>
  <text x="92" y="150" fill="#bae6fd" font-family="Arial, sans-serif" font-size="20">Demo / synthetic — no patient data, no production exports, no compliance proof.</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="86" y="205" width="300" height="132" rx="20" fill="#0f766e"/>
    <text x="116" y="254" fill="white">1. Data touchpoints</text><text x="116" y="292" fill="#ccfbf1" font-size="17" font-weight="400">Redacted fields only</text>
    <rect x="450" y="205" width="300" height="132" rx="20" fill="#2563eb"/>
    <text x="480" y="254" fill="white">2. Human stop rules</text><text x="480" y="292" fill="#dbeafe" font-size="17" font-weight="400">Approve before AI action</text>
    <rect x="814" y="205" width="300" height="132" rx="20" fill="#7c3aed"/>
    <text x="844" y="254" fill="white">3. Vendor evidence</text><text x="844" y="292" fill="#ede9fe" font-size="17" font-weight="400">BAA / DPA / subprocessor questions</text>
    <rect x="86" y="405" width="300" height="132" rx="20" fill="#b45309"/>
    <text x="116" y="454" fill="white">4. Audit trail</text><text x="116" y="492" fill="#ffedd5" font-size="17" font-weight="400">Who approved what, when</text>
    <rect x="450" y="405" width="300" height="132" rx="20" fill="#be123c"/>
    <text x="480" y="454" fill="white">5. Risk owner</text><text x="480" y="492" fill="#ffe4e6" font-size="17" font-weight="400">Named accountable approver</text>
    <rect x="814" y="405" width="300" height="132" rx="20" fill="#475569"/>
    <text x="844" y="454" fill="white">6. Spend guardrail</text><text x="844" y="492" fill="#e2e8f0" font-size="17" font-weight="400">No savings claim without evidence</text>
  </g>
  <path d="M386 271 H450 M750 271 H814 M236 337 V405 M600 337 V405 M964 337 V405" stroke="#93c5fd" stroke-width="5" stroke-linecap="round"/>
  <text x="90" y="640" fill="#fef3c7" font-family="Arial, sans-serif" font-size="24" font-weight="700">Use before: AI receptionist, patient engagement platform, CRM/PMS/EHR workflow changes, chatbot, call-centre automation or cloud migration.</text>
  <text x="90" y="678" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">Boundary: buyer education and readiness artefact; not medical, legal, privacy, security, procurement or compliance advice.</text>
</svg>
