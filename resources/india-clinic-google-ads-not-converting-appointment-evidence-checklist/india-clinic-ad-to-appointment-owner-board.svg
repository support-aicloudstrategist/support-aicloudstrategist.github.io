<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Demo India clinic ad-to-appointment owner board</title><desc id="desc">Synthetic demo board mapping clinic ad leads to source, callback SLA, WhatsApp handoff, booking status, owner and blocked claims without patient data.</desc><rect width="1200" height="675" fill="#f7fbff"/><rect x="45" y="45" width="1110" height="585" rx="28" fill="#ffffff" stroke="#bfd7ea" stroke-width="3"/><text x="82" y="105" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#12324a">Clinic ad-to-appointment owner board</text><text x="82" y="142" font-family="Arial, sans-serif" font-size="18" fill="#4b6478">Demo / synthetic / no patient data / no ad ROI claim</text><g font-family="Arial, sans-serif"><rect x="82" y="185" width="190" height="72" rx="16" fill="#e7f2ff"/><text x="104" y="216" font-size="18" font-weight="700" fill="#12324a">Source</text><text x="104" y="241" font-size="16" fill="#38566b">Google / Practo / WA</text><rect x="302" y="185" width="190" height="72" rx="16" fill="#e9fbf0"/><text x="324" y="216" font-size="18" font-weight="700" fill="#12324a">Callback SLA</text><text x="324" y="241" font-size="16" fill="#38566b">called / missed / stale</text><rect x="522" y="185" width="190" height="72" rx="16" fill="#fff7de"/><text x="544" y="216" font-size="18" font-weight="700" fill="#12324a">WhatsApp handoff</text><text x="544" y="241" font-size="16" fill="#38566b">template / stop-rule</text><rect x="742" y="185" width="190" height="72" rx="16" fill="#f1ebff"/><text x="764" y="216" font-size="18" font-weight="700" fill="#12324a">Booking status</text><text x="764" y="241" font-size="16" fill="#38566b">booked / no-show / next</text><rect x="962" y="185" width="150" height="72" rx="16" fill="#ffecea"/><text x="984" y="216" font-size="18" font-weight="700" fill="#12324a">Owner</text><text x="984" y="241" font-size="16" fill="#38566b">front desk / manager</text><line x1="272" y1="221" x2="302" y2="221" stroke="#6d8aa3" stroke-width="4"/><line x1="492" y1="221" x2="522" y2="221" stroke="#6d8aa3" stroke-width="4"/><line x1="712" y1="221" x2="742" y2="221" stroke="#6d8aa3" stroke-width="4"/><line x1="932" y1="221" x2="962" y2="221" stroke="#6d8aa3" stroke-width="4"/><rect x="82" y="310" width="1030" height="210" rx="20" fill="#f8fafc" stroke="#d7e3ee"/><text x="112" y="352" font-size="22" font-weight="700" fill="#12324a">Blocked claims until real evidence exists</text><text x="112" y="390" font-size="18" fill="#38566b">• no guaranteed patients, appointments, revenue, ROI, rankings or ad-performance claim</text><text x="112" y="424" font-size="18" fill="#38566b">• no DPDP compliance, legal, privacy, security, medical or clinical advice claim</text><text x="112" y="458" font-size="18" fill="#38566b">• no patient/health/personal/production/customer data in first-review template</text><text x="112" y="492" font-size="18" fill="#38566b">• human owner required before automation, AI receptionist or public result claim</text><rect x="82" y="548" width="1030" height="42" rx="12" fill="#12324a"/><text x="112" y="575" font-size="18" fill="#ffffff">AICS wedge: source-to-owner evidence before more ads, CRM, marketplace, WhatsApp bot or AI receptionist spend.</text></g></svg>