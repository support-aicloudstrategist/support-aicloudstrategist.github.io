<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic US AI startup LLM and GPU spend owner dashboard demo</title>
  <desc id="desc">Demo dashboard showing synthetic spend bands, owner coverage, decision queue and proof boundary for AI startup LLM, GPU, Kubernetes and cloud cost review.</desc>
  <rect width="1200" height="760" fill="#f8fbff"/>
  <rect x="36" y="32" width="1128" height="696" rx="34" fill="#07152f"/>
  <text x="72" y="92" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800">AICS synthetic dashboard demo</text>
  <text x="72" y="134" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="900">LLM / GPU Spend Owner Review</text>
  <text x="72" y="170" fill="#bfdbfe" font-family="Inter,Arial,sans-serif" font-size="19">US AI startup board-safe evidence shape · no client, investor, customer or production data</text>
  <g transform="translate(72 216)">
    <rect width="230" height="116" rx="22" fill="#102a54" stroke="#315b93"/>
    <text x="22" y="40" fill="#93c5fd" font-family="Inter,Arial" font-size="15" font-weight="800">Monthly reviewed band</text>
    <text x="22" y="82" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="900">$22k-$55k</text>
  </g>
  <g transform="translate(326 216)">
    <rect width="230" height="116" rx="22" fill="#102a54" stroke="#315b93"/>
    <text x="22" y="40" fill="#93c5fd" font-family="Inter,Arial" font-size="15" font-weight="800">Rows missing owners</text>
    <text x="22" y="82" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="900">2 of 5</text>
  </g>
  <g transform="translate(580 216)">
    <rect width="230" height="116" rx="22" fill="#102a54" stroke="#315b93"/>
    <text x="22" y="40" fill="#93c5fd" font-family="Inter,Arial" font-size="15" font-weight="800">Approval required</text>
    <text x="22" y="82" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="900">4 actions</text>
  </g>
  <g transform="translate(834 216)">
    <rect width="230" height="116" rx="22" fill="#102a54" stroke="#315b93"/>
    <text x="22" y="40" fill="#93c5fd" font-family="Inter,Arial" font-size="15" font-weight="800">Claim-safe savings</text>
    <text x="22" y="82" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="900">0</text>
  </g>
  <g transform="translate(72 376)" font-family="Inter,Arial,sans-serif">
