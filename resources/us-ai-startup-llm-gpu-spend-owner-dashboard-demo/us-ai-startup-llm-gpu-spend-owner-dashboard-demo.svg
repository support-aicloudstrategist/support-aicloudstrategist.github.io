    <text x="28" y="44" fill="#0f375f" font-size="23" font-weight="900">Owner decision queue</text>
    <g fill="#0f375f" font-size="15" font-weight="800"><text x="28" y="88">Source</text><text x="250" y="88">Product area</text><text x="470" y="88">Signal</text><text x="748" y="88">Decision</text></g>
    <line x1="28" y1="104" x2="1028" y2="104" stroke="#dbeafe"/>
    <g fill="#334155" font-size="14">
      <text x="28" y="136">LLM API usage</text><text x="250" y="136">Support agent beta</text><text x="470" y="136">Token spend rising; beta seats flat</text><text x="748" y="136">Explain + label + cache review</text>
      <text x="28" y="180">GPU training job</text><text x="250" y="180">Research evaluation</text><text x="470" y="180">Weekend run; no active ticket</text><text x="748" y="180">Owner confirm or pause</text>
