<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic manufacturing production follow-up owner dashboard demo</title>
  <desc id="desc">A demo-labelled owner dashboard layout for manufacturing RFQ, quote, production exception, WhatsApp change and dispatch promise follow-up evidence. It uses synthetic examples only and makes no performance claim.</desc>
  <rect width="1200" height="760" fill="#f4f8fb"/>
  <rect x="48" y="40" width="1104" height="92" rx="22" fill="#05111f"/>
  <text x="78" y="88" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Manufacturing production follow-up owner board</text>
  <text x="78" y="116" fill="#c8e6f4" font-family="Arial, sans-serif" font-size="17">Synthetic demo — RFQs, Excel rows, WhatsApp changes, production holds and dispatch promises before ERP/MRP/CRM/automation spend</text>
  <rect x="850" y="62" width="258" height="42" rx="21" fill="#18a0fb"/>
  <text x="895" y="89" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">NO REAL CUSTOMER DATA</text>

  <g font-family="Arial, sans-serif">
    <rect x="48" y="164" width="250" height="132" rx="18" fill="#ffffff" stroke="#d5e5f2"/>
    <text x="72" y="199" fill="#18324a" font-size="16" font-weight="700">RFQs waiting for quote owner</text>
    <text x="72" y="238" fill="#0b5cab" font-size="44" font-weight="700">12</text>
    <text x="72" y="268" fill="#607487" font-size="15">Example counter: unowned or stale</text>

    <rect x="326" y="164" width="250" height="132" rx="18" fill="#ffffff" stroke="#d5e5f2"/>
    <text x="350" y="199" fill="#18324a" font-size="16" font-weight="700">WhatsApp-only order changes</text>
    <text x="350" y="238" fill="#b35400" font-size="44" font-weight="700">7</text>
    <text x="350" y="268" fill="#607487" font-size="15">Needs system-of-record handoff</text>

    <rect x="604" y="164" width="250" height="132" rx="18" fill="#ffffff" stroke="#d5e5f2"/>
    <text x="628" y="199" fill="#18324a" font-size="16" font-weight="700">Production exceptions</text>
    <text x="628" y="238" fill="#b00020" font-size="44" font-weight="700">9</text>
    <text x="628" y="268" fill="#607487" font-size="15">Material, QC, rework, approval</text>

    <rect x="882" y="164" width="270" height="132" rx="18" fill="#ffffff" stroke="#d5e5f2"/>
    <text x="906" y="199" fill="#18324a" font-size="16" font-weight="700">Dispatch promises needing proof</text>
    <text x="906" y="238" fill="#0a7f49" font-size="44" font-weight="700">5</text>
    <text x="906" y="268" fill="#607487" font-size="15">Customer update + owner check</text>
  </g>

  <rect x="48" y="328" width="1104" height="350" rx="20" fill="#ffffff" stroke="#d5e5f2"/>
  <text x="76" y="368" fill="#18324a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Example owner queue fields to review weekly</text>

  <g font-family="Arial, sans-serif" font-size="15">
    <rect x="76" y="394" width="1050" height="44" rx="8" fill="#eaf3fb"/>
    <text x="96" y="422" fill="#18324a" font-weight="700">Issue type</text>
    <text x="250" y="422" fill="#18324a" font-weight="700">Evidence source</text>
    <text x="440" y="422" fill="#18324a" font-weight="700">Owner</text>
    <text x="600" y="422" fill="#18324a" font-weight="700">Stop rule</text>
    <text x="820" y="422" fill="#18324a" font-weight="700">Next buyer-safe action</text>

    <text x="96" y="474" fill="#263b50">Overdue quote</text>
    <text x="250" y="474" fill="#607487">Email + Excel row</text>
    <text x="440" y="474" fill="#607487">Sales head</text>
    <text x="600" y="474" fill="#b00020">No invented price/date</text>
    <text x="820" y="474" fill="#263b50">Confirm source and quote owner</text>
    <line x1="76" y1="500" x2="1126" y2="500" stroke="#edf3f8"/>

    <text x="96" y="540" fill="#263b50">Spec changed</text>
    <text x="250" y="540" fill="#607487">WhatsApp + drawing</text>
    <text x="440" y="540" fill="#607487">Operations</text>
    <text x="600" y="540" fill="#b00020">Human review required</text>
    <text x="820" y="540" fill="#263b50">Log revision and customer acknowledgement</text>
    <line x1="76" y1="566" x2="1126" y2="566" stroke="#edf3f8"/>

    <text x="96" y="606" fill="#263b50">Dispatch slip</text>
    <text x="250" y="606" fill="#607487">ERP + transport note</text>
    <text x="440" y="606" fill="#607487">Dispatch lead</text>
    <text x="600" y="606" fill="#b00020">No blame/guarantee</text>
    <text x="820" y="606" fill="#263b50">Send owner-approved status update</text>
  </g>

  <text x="60" y="718" fill="#607487" font-family="Arial, sans-serif" font-size="14">AICS synthetic proof-of-method asset. Not a case study, not operational advice, not proof of revenue, savings, throughput, delivery, quality or AI accuracy.</text>
</svg>
