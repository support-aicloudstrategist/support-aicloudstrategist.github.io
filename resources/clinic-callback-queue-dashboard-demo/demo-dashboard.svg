<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic clinic callback queue dashboard snapshot</title>
  <desc id="desc">Demo-labelled dashboard mockup showing overdue callbacks, safe handoffs, unresolved reasons and owner queues for missed clinic enquiries. No real patient or clinic data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2a44" flood-opacity="0.12"/>
    </filter>
    <style>
      .label{font-family:Inter,Arial,sans-serif;fill:#223047}.muted{fill:#637089}.small{font-size:17px}.tiny{font-size:14px}.title{font-size:34px;font-weight:800}.h2{font-size:22px;font-weight:800}.metric{font-size:42px;font-weight:900}.card{fill:#fff;stroke:#d9e3f0;stroke-width:1.4;filter:url(#shadow)}.pill{fill:#e8f7ef;stroke:#b9e4c8}.warn{fill:#fff4e4;stroke:#ffd38b}.risk{fill:#ffecec;stroke:#ffb4b4}.blue{fill:#eaf3ff;stroke:#b7d4ff}.barbg{fill:#edf2f7}.bar1{fill:#306fdb}.bar2{fill:#13a36b}.bar3{fill:#f59e0b}.bar4{fill:#ef4444}.grid{stroke:#e6edf5;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <text x="54" y="64" class="label title">Clinic callback queue dashboard snapshot</text>
  <text x="54" y="96" class="muted small">Synthetic demo data only · no real clinic, patient, PHI, booking, revenue or compliance claim</text>
  <rect x="54" y="124" width="250" height="138" rx="22" class="card"/>
  <text x="78" y="160" class="muted small">Overdue callbacks</text>
  <text x="78" y="211" class="label metric">18</text>
  <text x="78" y="239" class="muted tiny">Older than approved callback SLA</text>
  <rect x="326" y="124" width="250" height="138" rx="22" class="card"/>
  <text x="350" y="160" class="muted small">Safe handoffs</text>
  <text x="350" y="211" class="label metric">42</text>
  <text x="350" y="239" class="muted tiny">Human callback or approved WhatsApp</text>
  <rect x="598" y="124" width="250" height="138" rx="22" class="card"/>
  <text x="622" y="160" class="muted small">Escalation-needed rows</text>
  <text x="622" y="211" class="label metric">7</text>
  <text x="622" y="239" class="muted tiny">Requires front-desk/clinician routing</text>
  <rect x="870" y="124" width="276" height="138" rx="22" class="card"/>
  <text x="894" y="160" class="muted small">Owner gaps</text>
  <text x="894" y="211" class="label metric">11</text>
  <text x="894" y="239" class="muted tiny">No accountable callback owner</text>

  <rect x="54" y="292" width="515" height="384" rx="22" class="card"/>
  <text x="84" y="331" class="label h2">Unresolved reason mix</text>
  <line x1="84" y1="374" x2="526" y2="374" class="grid"/>
  <line x1="84" y1="434" x2="526" y2="434" class="grid"/>
  <line x1="84" y1="494" x2="526" y2="494" class="grid"/>
  <line x1="84" y1="554" x2="526" y2="554" class="grid"/>
  <text x="84" y="366" class="muted tiny">No answer after callback</text>
  <rect x="258" y="349" width="250" height="22" rx="11" class="barbg"/><rect x="258" y="349" width="190" height="22" rx="11" class="bar1"/>
  <text x="84" y="426" class="muted tiny">Staff action pending</text>
  <rect x="258" y="409" width="250" height="22" rx="11" class="barbg"/><rect x="258" y="409" width="142" height="22" rx="11" class="bar3"/>
  <text x="84" y="486" class="muted tiny">Already booked elsewhere</text>
  <rect x="258" y="469" width="250" height="22" rx="11" class="barbg"/><rect x="258" y="469" width="96" height="22" rx="11" class="bar2"/>
  <text x="84" y="546" class="muted tiny">Escalation needed</text>
  <rect x="258" y="529" width="250" height="22" rx="11" class="barbg"/><rect x="258" y="529" width="74" height="22" rx="11" class="bar4"/>
  <text x="84" y="622" class="muted small">Owner decision: fix source capture, staffing window or approved response wording before scaling automation.</text>

  <rect x="598" y="292" width="548" height="384" rx="22" class="card"/>
  <text x="628" y="331" class="label h2">Queue rows requiring today’s review</text>
  <rect x="628" y="358" width="488" height="50" rx="14" class="risk"/>
  <text x="650" y="389" class="label small">DEMO-004 · Google profile call · 193 min old · escalation needed</text>
  <rect x="628" y="424" width="488" height="50" rx="14" class="warn"/>
  <text x="650" y="455" class="label small">DEMO-007 · Website form · owner missing · pending callback</text>
  <rect x="628" y="490" width="488" height="50" rx="14" class="blue"/>
  <text x="650" y="521" class="label small">DEMO-009 · WhatsApp · approved template sent · waiting reply</text>
  <rect x="628" y="556" width="488" height="50" rx="14" class="pill"/>
  <text x="650" y="587" class="label small">DEMO-011 · Phone tap · human callback completed · booked status logged</text>
  <text x="628" y="642" class="muted small">Automation boundary: administrative prompts only; no diagnosis, emergency advice, treatment promise or privacy assurance.</text>
  <text x="54" y="724" class="muted tiny">AICloudStrategist proof asset · generated as a visual companion to sample-callback-queue.csv · synthetic values are illustrative operational fields, not outcome benchmarks.</text>
</svg>
