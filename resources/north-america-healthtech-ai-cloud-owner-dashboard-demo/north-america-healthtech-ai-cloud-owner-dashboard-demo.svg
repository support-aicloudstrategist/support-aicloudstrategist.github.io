<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Synthetic North America healthtech AI cloud owner dashboard demo</title><desc id="desc">Demo dashboard showing unowned AI and cloud spend, evidence ageing, vendor-risk blockers and human-review queues for healthtech buyers.</desc><rect width="1200" height="675" fill="#07152f"/><rect x="42" y="36" width="1116" height="603" rx="32" fill="#f8fbff"/><text x="78" y="92" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#102033">Healthtech AI + Cloud Owner Dashboard</text><text x="78" y="124" font-family="Inter,Arial,sans-serif" font-size="17" fill="#47627a">Synthetic demo • no PHI/ePHI • no credentials • no compliance/savings claim</text><g font-family="Inter,Arial,sans-serif"><rect x="78" y="160" width="238" height="118" rx="20" fill="#e0f2fe" stroke="#7dd3fc"/><text x="102" y="201" font-size="18" font-weight="800" fill="#075985">Unowned spend</text><text x="102" y="245" font-size="42" font-weight="900" fill="#0f172a">4</text><text x="153" y="245" font-size="16" fill="#475569">synthetic rows</text><rect x="348" y="160" width="238" height="118" rx="20" fill="#fef3c7" stroke="#fbbf24"/><text x="372" y="201" font-size="18" font-weight="800" fill="#92400e">Evidence ageing</text><text x="372" y="245" font-size="42" font-weight="900" fill="#0f172a">180+</text><text x="472" y="245" font-size="16" fill="#475569">days flagged</text><rect x="618" y="160" width="238" height="118" rx="20" fill="#fee2e2" stroke="#fca5a5"/><text x="642" y="201" font-size="18" font-weight="800" fill="#991b1b">Human review</text><text x="642" y="245" font-size="42" font-weight="900" fill="#0f172a">3</text><text x="693" y="245" font-size="16" fill="#475569">adviser queues</text><rect x="888" y="160" width="238" height="118" rx="20" fill="#dcfce7" stroke="#86efac"/><text x="912" y="201" font-size="18" font-weight="800" fill="#166534">