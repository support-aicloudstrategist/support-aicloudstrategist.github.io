<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Demo cardiology owner dashboard for TMT, Echo, ECG, Holter, report pickup and TPA follow-up</title>
  <desc id="desc">Synthetic dashboard showing redacted cardiology follow-up queues by source, service type, owner, age band and human-review boundary. No real patient or clinic data is used.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06111f"/><stop offset="0.55" stop-color="#0b3146"/><stop offset="1" stop-color="#075e62"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#25e6c8"/><stop offset="1" stop-color="#8affea"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/></filter>
    <style>
      .label{font:700 15px Inter,Arial,sans-serif;fill:#9ff8ea;letter-spacing:.08em;text-transform:uppercase}.h1{font:900 42px Inter,Arial,sans-serif;fill:#fff}.copy{font:600 20px Inter,Arial,sans-serif;fill:#cfe2ef}.card{fill:rgba(255,255,255,.09);stroke:rgba(255,255,255,.18);stroke-width:1.2}.card2{fill:#fff;stroke:#dce7f0;stroke-width:1}.dark{fill:#06111f}.muted{fill:#64748b;font:600 15px Inter,Arial,sans-serif}.text{fill:#0f172a;font:800 18px Inter,Arial,sans-serif}.small{fill:#334155;font:700 14px Inter,Arial,sans-serif}.white{fill:#fff}.num{font:950 36px Inter,Arial,sans-serif;fill:#06111f}.pill{fill:#e9fbf7;stroke:#b9f3e6}.warn{fill:#fff6df;stroke:#f1d675}.risk{fill:#fff0f3;stroke:#ffd0d9}.line{stroke:#d7e3ee;stroke-width:1}.axis{fill:#dbeafe;font:700 13px Inter,Arial,sans-serif}.no{fill:#f8fafc;font:800 15px Inter,Arial,sans-serif}.green{fill:#0f766e}.amber{fill:#986604}.red{fill:#b82242}
    </style>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <circle cx="1030" cy="95" r="160" fill="#8d6cff" opacity=".16"/>
  <circle cx="120" cy="650" r="190" fill="#25e6c8" opacity=".14"/>

  <text x="64" y="70" class="label">Demo/internal synthetic artifact · India cardiology GrowthOS</text>
  <text x="64" y="122" class="h1">Cardiology follow-up owner dashboard</text>
  <text x="64" y="158" class="copy">TMT, Echo, ECG, Holter, report pickup and TPA queues visible before more ads, CRM or AI receptionist spend.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="200" width="250" height="120" rx="24" fill="url(#teal)"/>
    <text x="92" y="245" class="num">6</text><text x="92" y="278" class="text">open demo rows</text><text x="92" y="302" class="small">redacted source-to-owner queue</text>
    <rect x="340" y="200" width="250" height="120" rx="24" class="card"/>
    <text x="368" y="245" font-family="Inter,Arial" font-size="36" font-weight="950" fill="#fff">2</text><text x="368" y="278" font-family="Inter,Arial" font-size="18" font-weight="800" fill="#fff">breached/48h+</text><text x="368" y="302" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#cfe2ef">callback SLA needs owner review</text>
    <rect x="616" y="200" width="250" height="120" rx="24" class="card"/>
    <text x="644" y="245" font-family="Inter,Arial" font-size="36" font-weight="950" fill="#fff">2</text><text x="644" y="278" font-family="Inter,Arial" font-size="18" font-weight="800" fill="#fff">human-review flags</text><text x="644" y="302" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#cfe2ef">clinical/TPA boundary, not AI advice</text>
    <rect x="892" y="200" width="244" height="120" rx="24" class="card"/>
    <text x="920" y="245" font-family="Inter,Arial" font-size="36" font-weight="950" fill="#fff">0</text><text x="920" y="278" font-family="Inter,Arial" font-size="18" font-weight="800" fill="#fff">patient identifiers</text><text x="920" y="302" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#cfe2ef">no names, phones, reports or symptoms</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="360" width="1072" height="314" rx="28" class="card2"/>
    <text x="92" y="402" class="text">Owner queue snapshot</text>
    <text x="92" y="433" class="muted">Synthetic rows only — designed to show evidence structure, not performance results.</text>
    <line x1="92" y1="463" x2="1108" y2="463" class="line"/>
    <text x="92" y="490" class="muted">Source</text><text x="286" y="490" class="muted">Service</text><text x="430" y="490" class="muted">Stage</text><text x="690" y="490" class="muted">Age / SLA</text><text x="845" y="490" class="muted">Owner</text><text x="1005" y="490" class="muted">Boundary</text>

    <g transform="translate(92 510)"><rect width="1016" height="42" rx="13" fill="#f8fafc"/><text x="0" y="27" class="small">GBP</text><text x="194" y="27" class="small">TMT</text><text x="338" y="27" class="small">appointment confirmation due</text><text x="598" y="27" class="green" font-family="Inter,Arial" font-size="14" font-weight="900">0-4h / on track</text><text x="753" y="27" class="small">front desk</text><text x="913" y="27" class="green" font-family="Inter,Arial" font-size="14" font-weight="900">standard</text></g>
    <g transform="translate(92 560)"><rect width="1016" height="42" rx="13" fill="#fff6df"/><text x="0" y="27" class="small">Practo-style</text><text x="194" y="27" class="small">Echo</text><text x="338" y="27" class="small">no-response follow-up</text><text x="598" y="27" class="amber" font-family="Inter,Arial" font-size="14" font-weight="900">4-24h / watch</text><text x="753" y="27" class="small">reception lead</text><text x="913" y="27" class="green" font-family="Inter,Arial" font-size="14" font-weight="900">standard</text></g>
    <g transform="translate(92 610)"><rect width="1016" height="42" rx="13" fill="#fff0f3"/><text x="0" y="27" class="small">Website</text><text x="194" y="27" class="small">Consultation</text><text x="338" y="27" class="small">TPA document blocked</text><text x="598" y="27" class="red" font-family="Inter,Arial" font-size="14" font-weight="900">48h+ / breached</text><text x="753" y="27" class="small">TPA desk</text><text x="913" y="27" class="red" font-family="Inter,Arial" font-size="14" font-weight="900">human review</text></g>
  </g>

  <text x="64" y="720" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#d3e7ef">Boundary: no real clinic, patient, PHI, appointment lift, no-show reduction, DPDP compliance proof, revenue, ROI, testimonial, ranking or AI-accuracy claim.</text>
</svg>
