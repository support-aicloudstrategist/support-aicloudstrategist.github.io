<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Synthetic accounting firm tax season owner dashboard demo</title><desc id="desc">Synthetic accounting firm tax season owner dashboard demo with intake, missing-document, portal and human-review queues.</desc><rect width="960" height="540" fill="#f7fafc"/><text x="40" y="55" font-family="Arial" font-size="26" font-weight="700" fill="#10233f">Synthetic accounting firm tax season owner dashboard demo</text><text x="40" y="86" font-family="Arial" font-size="14" fill="#52627a">Demo data only · not taxpayer/client data · human review for tax/accounting judgement</text><g font-family="Arial"><rect x="40" y="120" width="200" height="110" rx="18" fill="#e8f1ff"/><text x="62" y="155" font-size="15" fill="#335">Open intake</text><text x="62" y="205" font-size="42" font-weight="700" fill="#174ea6">7</text><rect x="270" y="120" width="200" height="110" rx="18" fill="#fff4dc"/><text x="292" y="155" font-size="15" fill="#335">Missing docs</text><text x="292" y="205" font-size="42" font-weight="700" fill="#9a5b00">4</text><rect x="500" y="120" width="200" height="110" rx="18" fill="#ffecec"/><text x="522" y="155" font-size="15" fill="#335">Human review</text><text x="522" y="205" font-size="42" font-weight="700" fill="#b42318">3</text><rect x="730" y="120" width="190" height="110" rx="18" fill="#eafaf1"/><text x="752" y="155" font-size="15" fill="#335">Follow-up today</text><text x="752" y="205" font-size="42" font-weight="700" fill="#16794c">5</text></g><rect x="40" y="270" width="880" height="178" rx="18" fill="#ffffff" stroke="#d9e2ef"/><text x="65" y="306" font-family="Arial" font-size="17" font-weight="700" fill="#10233f">Sample owner queue</text><text x="65" y="340" font-family="Arial" font-size="14" fill="#10233f">Business tax · prior return missing · preparer · 3-7 days · human review before advice</text><text x="65" y="372" font-family="Arial" font-size="14" fill="#10233f">Payroll · report unclear · partner · 8-14 days · professional judgement required</text><text x="65" y="404" font-family="Arial" font-size="14" fill="#10233f">Sales tax/GST/VAT · payment issue · finance · 3-7 days · no automated decision</text><text x="40" y="500" font-family="Arial" font-size="13" fill="#52627a">Truth boundary: synthetic demo only; not a case study, taxpayer data, tax/accounting/legal advice, revenue proof, ROI proof or compliance proof.</text></svg>