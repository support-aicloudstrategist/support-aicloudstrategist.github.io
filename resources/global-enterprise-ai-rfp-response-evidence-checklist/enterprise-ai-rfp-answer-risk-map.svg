<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Demo-labelled enterprise AI RFP answer risk map</title>
  <desc id="desc">Synthetic visual showing how enterprise AI RFP answers move from intake to evidence source, owner approval, claim boundary and safe response.</desc>
  <rect width="1200" height="720" fill="#f8fbff"/>
  <rect x="40" y="40" width="1120" height="640" rx="34" fill="#ffffff" stroke="#c7d2fe" stroke-width="3"/>
  <text x="80" y="100" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="#172554">Enterprise AI RFP answer risk map</text>
  <text x="80" y="137" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Demo / synthetic buyer-education visual — not a customer result, RFP win, compliance proof, security advice, legal advice or procurement advice.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="80" y="185" width="210" height="116" rx="20" fill="#eef2ff" stroke="#818cf8"/>
    <text x="105" y="225" font-size="22" font-weight="800" fill="#312e81">1. RFP question</text>
    <text x="105" y="260" font-size="15" fill="#334155">AI use, privacy, security,</text>
    <text x="105" y="282" font-size="15" fill="#334155">oversight, delivery or cost</text>

    <rect x="355" y="185" width="210" height="116" rx="20" fill="#ecfeff" stroke="#22d3ee"/>
    <text x="380" y="225" font-size="22" font-weight="800" fill="#155e75">2. Evidence source</text>
    <text x="380" y="260" font-size="15" fill="#334155">Policy, answer bank, data-flow,</text>
    <text x="380" y="282" font-size="15" fill="#334155">control summary or owner note</text>

    <rect x="630" y="185" width="210" height="116" rx="20" fill="#f0fdf4" stroke="#4ade80"/>
    <text x="655" y="225" font-size="22" font-weight="800" fill="#166534">3. Owner approval</text>
    <text x="655" y="260" font-size="15" fill="#334155">Security, privacy, AI product,</text>
    <text x="655" y="282" font-size="15" fill="#334155">finance or delivery sign-off</text>

    <rect x="905" y="185" width="210" height="116" rx="20" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="930" y="225" font-size="22" font-weight="800" fill="#92400e">4. Claim boundary</text>
    <text x="930" y="260" font-size="15" fill="#334155">Remove unsupported ROI,</text>
    <text x="930" y="282" font-size="15" fill="#334155">compliance, safety or SLA claims</text>

    <path d="M300 243 H345" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M575 243 H620" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M850 243 H895" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="80" y="365" width="330" height="190" rx="24" fill="#f8fafc" stroke="#dbeafe"/>
    <text x="110" y="410" font-size="24" font-weight="800" fill="#172554">Red flags to stop</text>
    <text x="110" y="445" font-size="17" fill="#334155">• “Guaranteed accuracy” without evidence</text>
    <text x="110" y="477" font-size="17" fill="#334155">• “Compliant” without accountable proof</text>
    <text x="110" y="509" font-size="17" fill="#334155">• “Savings” or “ROI” without approval</text>
    <text x="110" y="541" font-size="17" fill="#334155">• “Production-ready” without scope gates</text>

    <rect x="435" y="365" width="330" height="190" rx="24" fill="#f8fafc" stroke="#dbeafe"/>
    <text x="465" y="410" font-size="24" font-weight="800" fill="#172554">Safe answer shape</text>
    <text x="465" y="445" font-size="17" fill="#334155">• Source document + owner + review date</text>
    <text x="465" y="477" font-size="17" fill="#334155">• Assumption and exclusion stated plainly</text>
    <text x="465" y="509" font-size="17" fill="#334155">• Human-review gate before submission</text>
    <text x="465" y="541" font-size="17" fill="#334155">• Escalation route for uncertain claims</text>

    <rect x="790" y="365" width="330" height="190" rx="24" fill="#f8fafc" stroke="#dbeafe"/>
    <text x="820" y="410" font-size="24" font-weight="800" fill="#172554">AICS proof-first role</text>
    <text x="820" y="445" font-size="17" fill="#334155">• Organize the evidence queue</text>
    <text x="820" y="477" font-size="17" fill="#334155">• Identify unsafe overclaims</text>
    <text x="820" y="509" font-size="17" fill="#334155">• Create a buyer-safe response pack</text>
    <text x="820" y="541" font-size="17" fill="#334155">• Preserve legal/security owner approval</text>
  </g>
  <rect x="80" y="605" width="1040" height="44" rx="22" fill="#312e81"/>
  <text x="110" y="633" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Marker: enterprise-ai-rfp-answer-risk-map-demo-2026-09-01 · no outreach · no fake client proof</text>
</svg>
