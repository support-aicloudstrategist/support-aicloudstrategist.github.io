<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Demo US Clinic Source-to-Owner Leak Map Dashboard</title>
  <desc id="desc">Synthetic dashboard visual showing clinic request sources, owner gaps, overdue callbacks, human review boundaries and no-real-client claim boundaries.</desc>
  <rect width="1200" height="720" fill="#07111f"/>
  <rect x="40" y="36" width="1120" height="648" rx="28" fill="#0f1f33" stroke="#56d4ff" stroke-opacity="0.32"/>
  <text x="72" y="88" fill="#eaf6fb" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700">US Clinic Source-to-Owner Leak Map</text>
  <text x="72" y="120" fill="#9db7c8" font-family="Inter,Arial,sans-serif" font-size="16">DEMO / INTERNAL / SIMULATED ONLY — no real clinic, patient, PHI, HIPAA compliance, booking, revenue, ranking or AI accuracy claim</text>
  <g transform="translate(72 160)">
    <rect width="210" height="112" rx="18" fill="#132b46"/>
    <text x="20" y="36" fill="#9fe8ff" font-size="15" font-family="Inter,Arial">Sources inspected</text>
    <text x="20" y="78" fill="#fff" font-size="42" font-weight="800" font-family="Inter,Arial">10</text>
    <text x="82" y="78" fill="#cfe8f3" font-size="15" font-family="Inter,Arial">synthetic routes</text>
  </g>
  <g transform="translate(312 160)">
    <rect width="210" height="112" rx="18" fill="#132b46"/>
    <text x="20" y="36" fill="#ffd166" font-size="15" font-family="Inter,Arial">No owner</text>
    <text x="20" y="78" fill="#fff" font-size="42" font-weight="800" font-family="Inter,Arial">4</text>
    <text x="78" y="78" fill="#cfe8f3" font-size="15" font-family="Inter,Arial">sample queues</text>
  </g>
  <g transform="translate(552 160)">
    <rect width="210" height="112" rx="18" fill="#132b46"/>
    <text x="20" y="36" fill="#ff8fa3" font-size="15" font-family="Inter,Arial">Overdue / unresolved</text>
    <text x="20" y="78" fill="#fff" font-size="42" font-weight="800" font-family="Inter,Arial">5</text>
    <text x="78" y="78" fill="#cfe8f3" font-size="15" font-family="Inter,Arial">needs review</text>
  </g>
  <g transform="translate(792 160)">
    <rect width="290" height="112" rx="18" fill="#132b46"/>
    <text x="20" y="36" fill="#b7f7c4" font-size="15" font-family="Inter,Arial">AI boundary routes</text>
    <text x="20" y="78" fill="#fff" font-size="42" font-weight="800" font-family="Inter,Arial">10</text>
    <text x="96" y="78" fill="#cfe8f3" font-size="15" font-family="Inter,Arial">human/approved-script rules</text>
  </g>
  <g transform="translate(72 315)">
    <text x="0" y="0" fill="#eaf6fb" font-size="21" font-weight="700" font-family="Inter,Arial">Owner-gap queue</text>
    <g font-family="Inter,Arial" font-size="15">
      <rect y="24" width="1030" height="52" rx="12" fill="#0a1727"/><text x="18" y="57" fill="#fff">Google Business Profile call</text><text x="360" y="57" fill="#ffd166">No named owner</text><text x="650" y="57" fill="#ff8fa3">Overdue callback</text>
      <rect y="86" width="1030" height="52" rx="12" fill="#10233a"/><text x="18" y="119" fill="#fff">Referral fax/email</text><text x="360" y="119" fill="#b7f7c4">Referral coordinator</text><text x="650" y="119" fill="#ffd166">Blocked by missing document</text>
      <rect y="148" width="1030" height="52" rx="12" fill="#0a1727"/><text x="18" y="181" fill="#fff">Phone tree abandoned call</text><text x="360" y="181" fill="#ffd166">No owner</text><text x="650" y="181" fill="#ff8fa3">Unresolved over 24h</text>
      <rect y="210" width="1030" height="52" rx="12" fill="#10233a"/><text x="18" y="243" fill="#fff">Review site message</text><text x="360" y="243" fill="#b7f7c4">Practice manager</text><text x="650" y="243" fill="#ffd166">Human review required</text>
    </g>
  </g>
  <text x="72" y="638" fill="#9db7c8" font-family="Inter,Arial" font-size="15">Competitor context considered: NexHealth, Luma Health, Phreesia, Hyro, Notable, Podium, Salesforce Health Cloud. AICS role: proof-before-platform leak map and safe owner dashboard.</text>
</svg>
